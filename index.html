<html lang="en"><head>

<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

<style>
    :root {
      --bg: #eef1f6; --panel: #fff; --border: #c5cdd8; --primary: #0b3d91;
      --primary-d: #072a66; --text: #1a1a2e; --muted: #667085; --hover: #eef3fb;
      --sap-yellow: #fffef0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
    
    #login-view {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
    }
    .login-box {
      background: var(--panel); border: 1px solid var(--border); width: 380px; padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(11,61,145,.12);
    }
    .login-box h1 { color: var(--primary); font-size: 1.5rem; letter-spacing: 1px; }
    .login-box .sub { color: var(--muted); font-size: 12px; margin: 4px 0 18px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    input, select, textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); margin-bottom: 10px; font-size: 13px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 12px; border: 1px solid var(--border); background: #fff; cursor: pointer;
      font-size: 12.5px; font-weight: 600; border-radius: 2px;
    }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-d); }
    .btn-sm { padding: 4px 9px; font-size: 12px; }
    .btn-danger { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .btn-danger:hover { background: #fee2e2; }
    .btn-demo { background: #0284c7; color: #fff; border-color: #0284c7; }
    .btn-demo:hover { background: #0369a1; }
    .btn-outline-primary { border-color: var(--primary); color: var(--primary); background: #eff6ff; }
    .btn-outline-primary:hover { background: #dbeafe; }
    .err { color: #b91c1c; font-size: 12px; margin-top: 6px; }

    #app-view { display: none; min-height: 100vh; }
    .topbar {
      background: var(--primary); color: #fff; padding: 8px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .topbar strong { font-size: 15px; letter-spacing: .6px; }
    .badge { background: rgba(255,255,255,.2); padding: 2px 7px; font-size: 11px; margin-left: 6px; border-radius: 3px; }
    .badge-wildcard { background: #f59e0b; color: #000; font-weight: 700; padding: 2px 6px; border-radius: 3px; font-size: 11px; }
    .layout { display: flex; min-height: calc(100vh - 42px); }
    .sidebar { width: 175px; background: #1e293b; flex-shrink: 0; padding: 6px 0; overflow-y: auto; }
    .sidebar button {
      display: block; width: 100%; text-align: left; border: 0; background: none;
      color: #cbd5e1; padding: 8px 14px; cursor: pointer; font-size: 12.5px;
    }
    .sidebar button:hover, .sidebar button.active { background: var(--primary); color: #fff; }
    .main { flex: 1; padding: 10px 14px; overflow: auto; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .toolbar h2 { font-size: 15px; color: var(--primary); margin-right: auto; }

    /* Dense SAP/Excel-style grid */
    .grid-wrap { border: 1px solid var(--border); background: var(--panel); overflow: auto; max-height: calc(100vh - 160px); }
    table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.grid th {
      background: #e8eef7; border: 1px solid var(--border); padding: 5px 8px;
      text-align: left; font-weight: 700; position: sticky; top: 0; z-index: 1; white-space: nowrap;
    }
    table.grid td { border: 1px solid var(--border); padding: 3px 8px; vertical-align: middle; }
    table.grid tr:hover td { background: var(--hover); }

    .form-bar {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 10px;
      background: var(--panel); border: 1px solid var(--border); padding: 8px 10px; margin-bottom: 8px;
    }
    .form-bar .fg label { margin-bottom: 2px; }
    .form-bar .fg input, .form-bar .fg select { margin-bottom: 0; padding: 6px 8px; }

    /* SAP B1 Marketing Header & Footer styles */
    .mkt-hd {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px 32px; padding: 12px 14px;
      background: #f5f5f5; border: 1px solid #b0b0b0; margin-bottom: 0;
    }
    .mkt-hd .mkt-col { display: grid; grid-template-columns: 120px 1fr; gap: 5px 10px; align-items: center; }
    .mkt-hd .mkt-col label { font-size: 12px; font-weight: 600; color: #333; text-transform: none; margin: 0; }
    .mkt-hd .mkt-col input, .mkt-hd .mkt-col select {
      margin: 0; padding: 4px 8px; font-size: 12px; border: 1px solid #999; background: var(--sap-yellow); width: 100%;
    }
    .mkt-hd .mkt-col input[readonly] { background: #e8e8e8; color: #333; }
    .mkt-spacer {
      height: 0.28in; min-height: 24px; border-bottom: 1px dashed #ccc; margin: 0 0 6px 0;
      background: linear-gradient(180deg, #fafafa 0%, #fff 100%);
    }
    .mkt-lines-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; font-weight: 700; color: var(--primary); padding: 6px 10px;
      background: #eef3fb; border-top: 1px solid #ccd8ea; border-bottom: 2px solid var(--primary); margin-bottom: 6px;
    }
    .mkt-ft {
      display: grid; grid-template-columns: 1fr 280px; gap: 16px; padding: 10px 14px;
      background: #f5f5f5; border-top: 1px solid #ccc;
    }
    .mkt-ft .totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12px; align-items: center; }
    .mkt-ft .totals b { text-align: right; min-width: 100px; }

    /* Interactive Wildcard Banner & Line Search */
    .wildcard-tester-box {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 4px; padding: 8px 12px;
      margin-bottom: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    }
    .wildcard-chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .wildcard-chip {
      font-size: 11px; font-weight: 600; background: #fff; border: 1px solid #93c5fd;
      color: #1d4ed8; padding: 2px 7px; border-radius: 12px; cursor: pointer; user-select: none;
    }
    .wildcard-chip:hover { background: #1d4ed8; color: #fff; }

    .line-search-cell { position: relative; width: 100%; }
    .line-search-input {
      width: 100% !important; margin: 0 !important; padding: 4px 7px !important;
      font-size: 12px !important; border: 1px solid #999 !important; background: var(--sap-yellow) !important;
    }
    .line-search-input:focus { background: #fff !important; outline: 2px solid var(--primary) !important; }
    .search-hint-tag {
      position: absolute; right: 5px; top: 4px; font-size: 10px; background: #e0e7ff;
      color: var(--primary); padding: 1px 4px; border-radius: 2px; pointer-events: none; font-weight: 600;
    }

    /* Wildcard live dropdown popup */
    .wildcard-lookup-popup {
      position: absolute; top: 100%; left: 0; width: 340px; max-height: 220px;
      overflow-y: auto; background: #fff; border: 1px solid #0b3d91; box-shadow: 0 8px 24px rgba(0,0,0,0.18);
      z-index: 1000; border-radius: 0 0 4px 4px; display: none;
    }
    .wildcard-lookup-popup.active { display: block; }
    .lookup-head {
      background: #e8eef7; font-size: 11px; font-weight: 700; padding: 4px 8px;
      color: #334155; border-bottom: 1px solid #cbd5e1; display: flex; justify-content: space-between;
    }
    .lookup-item-row {
      padding: 6px 8px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex;
      justify-content: space-between; align-items: center; font-size: 12px;
    }
    .lookup-item-row:hover, .lookup-item-row.selected { background: #e0f2fe; }
    .lookup-item-code { font-weight: 700; color: var(--primary); font-size: 11.5px; }
    .lookup-item-name { color: #1e293b; font-size: 12px; }
    .lookup-item-price { font-size: 11px; font-weight: 600; color: #047857; }

    /* Search Wildcard Indicator & Autocomplete */
    .search-filter-box {
      display: inline-flex; align-items: center; gap: 4px; background: #fff;
      border: 1px solid var(--border); padding: 2px 6px; border-radius: 3px;
    }
    .search-filter-box input {
      border: none; outline: none; margin: 0; padding: 3px 4px; font-size: 12px; width: 150px;
    }
    .search-filter-box .wildcard-hint {
      font-size: 10px; color: var(--primary); font-weight: 700; cursor: help; background: #e0e7ff;
      padding: 1px 4px; border-radius: 2px;
    }

    /* Menubar */
    .menubar {
      background: #f3f4f6; border-bottom: 1px solid var(--border);
      display: flex; gap: 0; padding: 0 6px; font-size: 12.5px; user-select: none;
    }
    .menubar .menu { position: relative; padding: 6px 10px; cursor: pointer; color: #333; }
    .menubar .menu:hover { background: #e5e7eb; }
    .menubar .menu .dropdown {
      display: none; position: absolute; top: 100%; left: 0; min-width: 210px;
      background: #fff; border: 1px solid var(--border); box-shadow: 0 6px 16px rgba(0,0,0,.12); z-index: 50;
    }
    .menubar .menu:hover .dropdown { display: block; }
    .menubar .dropdown button {
      display: block; width: 100%; text-align: left; border: 0; background: none;
      padding: 7px 12px; font-size: 12.5px; cursor: pointer;
    }
    .menubar .dropdown button:hover { background: var(--hover); }
    .menubar .dropdown .sub { position: relative; }
    .menubar .dropdown .sub > .subdrop {
      display: none; position: absolute; left: 100%; top: 0; min-width: 200px;
      background: #fff; border: 1px solid var(--border); box-shadow: 0 6px 16px rgba(0,0,0,.12);
    }
    .menubar .dropdown .sub:hover > .subdrop { display: block; }
    .menubar .dropdown .sub > button::after { content: " ▸"; float: right; opacity: .6; }

    .sidebar .mod-title {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; color: #94a3b8; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .4px; cursor: pointer;
    }
    .sidebar .mod-title:hover { color: #fff; }
    .sidebar .mod-children { display: none; }
    .sidebar .mod-children.open { display: block; }
    .sidebar .mod-children button { padding-left: 22px; font-size: 12px; }
    .sidebar .mod-title .chev { font-size: 10px; opacity: .7; }

    .toast {
      position: fixed; bottom: 32px; right: 16px; background: #0f172a; color: #fff;
      padding: 10px 14px; font-size: 13px; display: none; z-index: 10000; max-width: 320px; border-radius: 4px;
    }
    .toast.show { display: block; }
    .toast.ok { background: #166534; }
    .toast.err { background: #991b1b; }

    .progress-bar-wrap {
      position: fixed; bottom: 0; left: 0; right: 0; height: 28px;
      background: #1e293b; z-index: 9999; display: none; align-items: center;
      padding: 0 12px; gap: 10px; font-size: 12px; color: #fff;
    }
    .progress-bar-wrap.show { display: flex; }
    .progress-track { flex: 1; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: #22c55e; width: 0%; transition: width 0.15s; }
  </style>
</head>

    /**
     * Matches text against search pattern supporting wildcard (*):
     * e.g., "*machale" matches "Nondo Machale 12mm"
     * "*12mm" matches "Nondo Machale 12mm" and "Deformed Bar 12mm"
     * "*tile" matches "Roof Tile Blue"
     */
    function matchWildcard(text, query) {
      if (!query || !query.trim()) return true;
      const target = String(text || "").toLowerCase();
      const q = query.trim().toLowerCase();

      if (q.startsWith("*")) {
        const sub = q.slice(1).trim();
        if (!sub) return true;
        return target.includes(sub);
      }
      if (q.includes("*")) {
        const escaped = q.split("*").map(s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join(".*");
        return new RegExp(escaped, "i").test(target);
      }
      return target.includes(q);
    }

    /**
     * Natural Alphanumeric A-Z comparator
     */
    function sortAlphaNum(getter) {
      return (a, b) => {
        const valA = String(getter(a) || "");
        const valB = String(getter(b) || "");
        return valA.localeCompare(valB, undefined, { numeric: true, sensitivity: "base" });
      };
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function loadAll() {
      if (!db) {
        enforceMasterSort();
        return;

      try {
        const [co, it, bp, wh, sd, pd, ac] = await Promise.all([
          db.collection("companies").get(),
          db.collection("items").get(),
          db.collection("partners").get(),
          db.collection("warehouses").get(),
          db.collection("sales_docs").get(),
          db.collection("purchase_docs").get(),
          db.collection("accounts").get()
        ]);

        if (!co.empty) companies = co.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!it.empty) {
          const dbItems = it.docs.map(d => ({ id: d.id, ...d.data() }));
          items = [...dbItems];
        }
        // Make sure default demo items exist
        DEFAULT_ITEMS.forEach(di => {
          if (!items.some(x => x.itemCode === di.itemCode)) items.push(di);
        });

        if (!bp.empty) partners = bp.docs.map(d => ({ id: d.id, ...d.data() }));
        DEFAULT_PARTNERS.forEach(dp => {
          if (!partners.some(x => x.bpCode === dp.bpCode)) partners.push(dp);
        });

        if (!wh.empty) warehouses = wh.docs.map(d => ({ id: d.id, ...d.data() }));
        if (!sd.empty) salesDocs = sd.docs.map(d => ({ id: d.id, ...d.data() }));

        if (!ac.empty) accounts = ac.docs.map(d => ({ id: d.id, ...d.data() }));

          </td>

    function removeMarketingLine(idx) {
      activeLinesDraft.splice(idx, 1);
      if (activeLinesDraft.length === 0) {

      }
      renderMarketingLines();
    }

    // ============================================================
    // INTERACTIVE WILDCARD POPUP LOGIC
    // ============================================================
    function onWildcardLineFocus(idx) {
      const inp = document.getElementById("line-search-input-" + idx);
      if (inp) onWildcardLineInput(idx, inp.value);
    }

    function onWildcardLineInput(idx, query) {
      activeLinesDraft[idx].name = query;
      const popup = document.getElementById("popup-" + idx);
      if (!popup) return;

      const cid = companyFilterId();
      let matched = scoped(items, cid).filter(i =>
        matchWildcard(i.name, query) ||
        matchWildcard(i.itemCode, query) ||
        matchWildcard(i.itemGroup, query)
      ).sort(sortAlphaNum(x => x.name || x.itemCode));

      if (!matched.length) {
        popup.innerHTML = `<div style="padding:8px;font-size:12px;color:#94a3b8">No items match "${esc(query)}"</div>`;
        popup.classList.add("active");
        return;
      }

      popup.innerHTML = `
        <div class="lookup-head">
          <span>MATCHED ITEMS (${matched.length}) — SORTED A-Z</span>
          <span style="color:#0284c7">Click or Enter to select</span>
        </div>
        ${matched.map((item, itemIdx) => `
          <div class="lookup-item-row ${itemIdx === 0 ? 'selected' : ''}"
               onclick="selectItemForLine(${idx}, '${esc(item.itemCode)}')">
            <div>
              <div class="lookup-item-name">${highlightMatch(esc(item.name), query)}</div>
              <span class="lookup-item-code">${esc(item.itemCode)}</span>
              <span style="font-size:10.5px;color:#64748b;margin-left:6px">${esc(item.itemGroup || '')} · UoM: ${esc(item.uom || 'pcs')}</span>
            </div>
            <div class="lookup-item-price">${Number(item.lastPurchasePrice || 0).toLocaleString()} TZS</div>
          </div>
        `).join("")}
      `;
      popup.classList.add("active");
    }

    function highlightMatch(text, query) {
      if (!query) return text;
      const cleanQ = query.replace(/\*/g, "").trim();
      if (!cleanQ) return text;
      try {
        const regex = new RegExp(`(${cleanQ.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
        return text.replace(regex, `<mark style="background:#fef08a;padding:0 2px">$1</mark>`);
      } catch (e) {
        return text;
      }
    }

    function onWildcardLineKeyDown(e, lineIdx) {
      const popup = document.getElementById("popup-" + lineIdx);
      if (e.key === "Enter") {
        e.preventDefault();
        if (popup && popup.classList.contains("active")) {
          const firstMatch = popup.querySelector(".lookup-item-row");
          if (firstMatch) {
            firstMatch.click();
            return;
          }
        }
      }
      if (e.key === "Escape") {
        closeAllPopups();
      }
    }

    function selectItemForLine(lineIdx, itemCode) {
      const it = items.find(x => x.itemCode === itemCode);
      if (it && activeLinesDraft[lineIdx]) {
        activeLinesDraft[lineIdx].itemCode = it.itemCode;
        activeLinesDraft[lineIdx].name = it.name;
        activeLinesDraft[lineIdx].uom = it.uom || "pcs";
        activeLinesDraft[lineIdx].price = Number(it.lastPurchasePrice || 0);
        if (!activeLinesDraft[lineIdx].qty || activeLinesDraft[lineIdx].qty <= 0) {
          activeLinesDraft[lineIdx].qty = 1;
        }
        activeLinesDraft[lineIdx].lineTotal = activeLinesDraft[lineIdx].qty * activeLinesDraft[lineIdx].price;
      }
      closeAllPopups();
      renderMarketingLines();
      toast(`Added ${it.name} (${it.itemCode})`, true);
    }

    function closeAllPopups() {
      document.querySelectorAll(".wildcard-lookup-popup").forEach(p => p.classList.remove("active"));
    }

    // Close lookup popups on outside click
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".line-search-cell")) {
        closeAllPopups();
      }
    });

    // ============================================================
    // LIVE TESTER BAR QUERIES
    // ============================================================
    function onLiveTesterQuery(query) {
      const countEl = document.getElementById("tester-results-count");
      const matched = items.filter(i =>
        matchWildcard(i.name, query) ||
        matchWildcard(i.itemCode, query) ||
        matchWildcard(i.itemGroup, query)
      );
      if (countEl) {
        countEl.textContent = `${matched.length} matched (A-Z)`;
      }

      // If document form is currently open, apply to the first empty line or inject immediately
      if (activeLinesDraft && activeLinesDraft.length > 0) {
        const targetIdx = activeLinesDraft.findIndex(l => !l.itemCode) !== -1 ?
          activeLinesDraft.findIndex(l => !l.itemCode) : activeLinesDraft.length - 1;
        const inputEl = document.getElementById("line-search-input-" + targetIdx);
        if (inputEl) {
          inputEl.value = query;
          onWildcardLineInput(targetIdx, query);
        }
      }
    }

    function applyTesterQuery(pattern) {
      const testInp = document.getElementById("quick-test-input");
      if (testInp) testInp.value = pattern;
      onLiveTesterQuery(pattern);

      // Open document form if closed
      const salesForm = document.getElementById("sales-form");
      const purchForm = document.getElementById("purch-form");
      if (salesForm && salesForm.style.display === "none" && (!purchForm || purchForm.style.display === "none")) {
        startSalesForm("SO");
      }

      // Direct inject to current line
      const emptyIdx = activeLinesDraft.findIndex(l => !l.itemCode);
      const targetIdx = emptyIdx >= 0 ? emptyIdx : 0;
      const inp = document.getElementById("line-search-input-" + targetIdx);
      if (inp) {
        inp.value = pattern;
        onWildcardLineInput(targetIdx, pattern);
        inp.focus();
      }
    }

    function recalcDocTotals() {
      let total = 0;
      activeLinesDraft.forEach(l => {
        l.lineTotal = (parseFloat(l.qty) || 0) * (parseFloat(l.price) || 0);
        total += l.lineTotal;
      });
      const totSales = document.getElementById("s-total");
      if (totSales) totSales.textContent = total.toLocaleString(undefined, { minimumFractionDigits: 2 }) + " TZS";
      const totPurch = document.getElementById("p-total");
      if (totPurch) totPurch.textContent = total.toLocaleString(undefined, { minimumFractionDigits: 2 }) + " TZS";
    }

    function onSalesCustomerChange() {
      const bpCode = document.getElementById("s-bp").value;
      const inp = document.getElementById("s-bp-code");
      if (inp) inp.value = bpCode;
    }

    async function postSalesDoc(docType) {
      const cid = companyFilterId();
      const bpCode = document.getElementById("s-bp").value;
      const docDate = document.getElementById("s-date").value;
      const remarks = document.getElementById("s-remarks").value.trim() || null;
      if (!bpCode || !docDate) return toast("Select Customer and Posting Date");

      const validLines = activeLinesDraft.filter(l => l.itemCode && l.qty > 0);
      if (!validLines.length) return toast("Add at least one item row with valid code and quantity");

      const grandTotal = validLines.reduce((s, l) => s + l.lineTotal, 0);
      const bp = partners.find(p => p.bpCode === bpCode);
      const docNo = docType + "-" + Date.now().toString().slice(-6);

      const data = {
        companyId: cid, docType, docNo, docDate, bpCode,
        bpName: bp ? bp.name : "", remarks, lines: validLines, grandTotal,
        status: "Open", createdAt: new Date().toISOString()
      };

      salesDocs.unshift({ id: "doc-" + Date.now(), ...data });
      if (db) {
        try { await db.collection("sales_docs").add(data); } catch(e){}
      }
      toast(`Document ${docNo} posted successfully! Total: ${grandTotal.toLocaleString()} TZS`, true);
      document.getElementById("sales-form").style.display = "none";
      renderSalesDoc(document.getElementById("main"), docType);
    }

      const cid = companyFilterId();
      const bpCode = document.getElementById("p-bp").value;
      const docDate = document.getElementById("p-date").value;
      const remarks = document.getElementById("p-remarks").value.trim() || null;
      if (!bpCode || !docDate) return toast("Select Vendor and Posting Date");

      const grandTotal = validLines.reduce((s, l) => s + l.lineTotal, 0);

      const docNo = docType + "-" + Date.now().toString().slice(-6);

      const data = {
        companyId: cid, docType, docNo, docDate, bpCode,
        bpName: bp ? bp.name : "", remarks, lines: validLines, grandTotal,
        status: "Open", createdAt: new Date().toISOString()
      };

    function itemRows(list) {
      return list.map(r => `<tr>
        <td><b>${esc(r.itemCode)}</b></td>
        <td>${esc(r.name)}</td>
        <td>${esc(r.itemGroup || "")}</td>
        <td>${esc(r.uom || "pcs")}</td>
        <td style="text-align:right">${Number(r.lastPurchasePrice || 0).toLocaleString()} TZS</td>
        <td style="white-space:nowrap;text-align:right">
          <button class="btn btn-sm" onclick="openItemForm('${r.id}')">Edit</button>

        </td>
      </tr>`).join("") || `<tr><td colspan="6">No items found</td></tr>`;
    }

    function filterItems() {
      const q = document.getElementById("item-q").value;
      const cid = companyFilterId();
      let list = scoped(items, cid).filter(i =>
        matchWildcard(i.itemCode, q) || matchWildcard(i.name, q) || matchWildcard(i.itemGroup, q)
      );
      list.sort(sortAlphaNum(x => x.itemCode || x.name));
      document.getElementById("item-body").innerHTML = itemRows(list);
    }

    let editingItemId = null;
    function openItemForm(id) {
      editingItemId = id || null;
      document.getElementById("item-form").style.display = "block";
      document.getElementById("item-edit-label").textContent = id ? "(edit)" : "(new)";
      if (!id) {
        document.getElementById("item-code").value = "";
        document.getElementById("item-name").value = "";
        document.getElementById("item-group").value = "";
        document.getElementById("item-uom").value = "pcs";
        document.getElementById("item-lpp").value = "0";
        return;
      }
      const it = items.find(x => x.id === id); if (!it) return;
      document.getElementById("item-code").value = it.itemCode || "";
      document.getElementById("item-name").value = it.name || "";
      document.getElementById("item-group").value = it.itemGroup || "";
      document.getElementById("item-uom").value = it.uom || "pcs";
      document.getElementById("item-lpp").value = it.lastPurchasePrice || 0;
    }

    async function saveItem() {
      const cid = companyFilterId();
      const itemCode = document.getElementById("item-code").value.trim().toUpperCase();
      const name = document.getElementById("item-name").value.trim();
      const itemGroup = document.getElementById("item-group").value.trim() || null;
      const uom = document.getElementById("item-uom").value.trim() || "pcs";
      const lastPurchasePrice = parseFloat(document.getElementById("item-lpp").value) || 0;

      if (!itemCode || !name) return toast("Code and Name are required");
      const data = { companyId: cid, itemCode, name, itemGroup, uom, lastPurchasePrice, isActive: true };

      if (editingItemId) {
        const idx = items.findIndex(x => x.id === editingItemId);
        if (idx >= 0) items[idx] = { ...items[idx], ...data };
        if (db) try { await db.collection("items").doc(editingItemId).update(data); } catch(e){}
        toast("Item updated", true);
      } else {
        data.id = "it-" + Date.now();
        data.createdAt = new Date().toISOString();
        items.push(data);
        if (db) try { await db.collection("items").add(data); } catch(e){}
        toast("Item saved", true);
      }
      enforceMasterSort();
      editingItemId = null;
      renderItems(document.getElementById("main"));
    }

    async function deleteItem(id) {
      if (!confirm("Delete this item?")) return;
      items = items.filter(x => x.id !== id);
      if (db) try { await db.collection("items").doc(id).delete(); } catch(e){}
      enforceMasterSort();
      toast("Deleted", true);
      renderItems(document.getElementById("main"));
    }

      const bpCode = document.getElementById("bp-code").value.trim().toUpperCase();
      const name = document.getElementById("bp-name").value.trim();
      const bpType = document.getElementById("bp-type").value;
      const phone = document.getElementById("bp-phone").value.trim() || null;
      const currencyCode = document.getElementById("bp-cur").value.trim() || "TZS";
      if (!bpCode || !name) return toast("BP Code and Name required");

      const data = { id: "bp-" + Date.now(), companyId: cid, bpCode, name, bpType, phone, currencyCode, isActive: true };
      partners.push(data);
      if (db) try { await db.collection("partners").add(data); } catch(e){}
      enforceMasterSort();
      toast("Partner saved", true);
      renderPartners(document.getElementById("main"));
    }

    async function deletePartner(id) {
      if (!confirm("Delete partner?")) return;
      partners = partners.filter(x => x.id !== id);
      if (db) try { await db.collection("partners").doc(id).delete(); } catch(e){}
      enforceMasterSort();
      renderPartners(document.getElementById("main"));
    }

    // ============================================================
    // OTHER STANDARD MODULES
    // ============================================================
    function renderCOA(el) {
      const cid = companyFilterId();
      let list = scoped(accounts, cid).slice().sort(sortAlphaNum(x => x.acctCode));
      el.innerHTML = `
        <div class="toolbar">
          <h2>Chart of Accounts</h2>
          <div class="search-filter-box">
            <span style="color:#64748b;font-size:11px">🔍</span>
            <input placeholder="Type or *wildcard..." oninput="const q=this.value; const b=document.getElementById('coa-b'); b.innerHTML=accounts.filter(a=>matchWildcard(a.acctName,q)||matchWildcard(a.acctCode,q)).map(a=>'<tr><td><b>'+esc(a.acctCode)+'</b></td><td>'+esc(a.acctName)+'</td><td>'+esc(a.category)+'</td></tr>').join('')">
            <span class="wildcard-hint">*Wildcard</span>
          </div>
        </div>
        <div class="grid-wrap"><table class="grid">
          <thead><tr><th>Account Code (A-Z)</th><th>Account Name</th><th>Category</th></tr></thead>
          <tbody id="coa-b">${list.map(a => `<tr><td><b>${esc(a.acctCode)}</b></td><td>${esc(a.acctName)}</td><td>${esc(a.category || "")}</td></tr>`).join("")}</tbody>
        </table></div>`;
    }

    function renderWarehouses(el) {
      const list = scoped(warehouses, companyFilterId());
      el.innerHTML = `
        <div class="toolbar"><h2>Warehouses</h2></div>
        <div class="grid-wrap"><table class="grid">
          <thead><tr><th>Code (A-Z)</th><th>Name</th></tr></thead>
          <tbody>${list.map(w => `<tr><td><b>${esc(w.code)}</b></td><td>${esc(w.name)}</td></tr>`).join("")}</tbody>
        </table></div>`;
    }

    function renderEmployees(el) {
      el.innerHTML = `<div class="toolbar"><h2>Employees</h2></div><p style="padding:10px;color:#64748b">Employee management active.</p>`;
    }
    function renderSalesEmployees(el) {
      el.innerHTML = `<div class="toolbar"><h2>Sales Employees</h2></div><p style="padding:10px;color:#64748b">Sales employee assignments active.</p>`;
    }
    function renderStock(el) {
      el.innerHTML = `<div class="toolbar"><h2>Goods Receipt / Issue</h2></div><p style="padding:10px;color:#64748b">Inventory transactions active.</p>`;
    }
    function renderStockBalance(el) {
      const cid = companyFilterId();
      el.innerHTML = `
        <div class="toolbar"><h2>Stock Balance per Item</h2></div>
        <div class="grid-wrap"><table class="grid">
          <thead><tr><th>Item Code</th><th>Item Name</th><th>UoM</th><th>On Hand</th></tr></thead>
          <tbody>${scoped(items, cid).map(i => `<tr><td><b>${esc(i.itemCode)}</b></td><td>${esc(i.name)}</td><td>${esc(i.uom)}</td><td style="text-align:right">100.00</td></tr>`).join("")}</tbody>
        </table></div>`;
    }
    function renderTrialBalance(el) {
      el.innerHTML = `<div class="toolbar"><h2>Trial Balance</h2></div><p style="padding:10px;color:#64748b">Double-entry ledger balances aligned.</p>`;
    }
    function renderCompanies(el) {
      el.innerHTML = `<div class="toolbar"><h2>Companies</h2></div>
        <div class="grid-wrap"><table class="grid">
          <thead><tr><th>Code</th><th>Name</th></tr></thead>
          <tbody>${companies.map(c => `<tr><td><b>${esc(c.code)}</b></td><td>${esc(c.name)}</td></tr>`).join("")}</tbody>
        </table></div>`;
    }
    function renderPayments(el) {
      el.innerHTML = `<div class="toolbar"><h2>Incoming Payment</h2></div><p style="padding:10px;color:#64748b">Customer incoming payments.</p>`;
    }

    // Startup initialization
    (async () => {
      await loadAll();
      refreshLoginCompanies();
    })();
  </script>
</body></html>
