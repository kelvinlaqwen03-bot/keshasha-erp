<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KESHASHA ERP — Full Functional Production Suite</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #eef2f7; --panel: #ffffff; --border: #c3ccdb;
      --primary: #0b3d91; --primary-dark: #072a66;
      --text: #1a202c; --muted: #64748b; --hover: #e8f0fe;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; overflow: hidden; height: 100vh; }
    #login-view { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a8a, #0b3d91); }
    .login-box { background: #fff; width: 420px; padding: 30px 26px; border-radius: 8px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
    .brand-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .brand-k { width: 44px; height: 44px; background: #0b3d91; color: #f59e0b; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900; border-radius: 6px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--border); margin-bottom: 11px; font-size: 12.5px; border-radius: 4px; background: #fff; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; border-radius: 4px; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-sm { padding: 4px 9px; font-size: 11.5px; }
    .btn-danger { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    #app-view { display: none; height: 100vh; flex-direction: column; }
    .topbar { background: #0b3d91; color: #fff; height: 44px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; }
    .menubar { background: #f1f5f9; border-bottom: 1px solid var(--border); height: 32px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; }
    .menu-item { position: relative; padding: 6px 12px; cursor: pointer; color: #334155; }
    .menu-item:hover > .dropdown { display: block; }
    .dropdown { display: none; position: absolute; top: 100%; left: 0; min-width: 220px; background: #fff; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.15); z-index: 1000; }
    .dropdown button { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; font-size: 12px; cursor: pointer; }
    .main-layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 225px; background: #0f172a; color: #cbd5e1; flex-shrink: 0; overflow-y: auto; border-right: 1px solid #1e293b; }
    .mod-group { border-bottom: 1px solid #1e293b; }
    .mod-header { padding: 9px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; display: flex; justify-content: space-between; color: #94a3b8; }
    .mod-items { display: none; background: #090d16; }
    .mod-items.open { display: block; }
    .mod-btn { display: block; width: 100%; text-align: left; padding: 7px 12px 7px 22px; border: 0; background: none; color: #cbd5e1; font-size: 12px; cursor: pointer; }
    .mod-btn:hover { background: rgba(11,61,145,0.4); color: #fff; }
    .mod-btn.active { background: #0b3d91; color: #fff; font-weight: 600; }
    .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f8fafc; }
    .subbar { height: 40px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
    .view-container { flex: 1; padding: 12px; overflow-y: auto; }
    .form-box { background: #fff; border: 1px solid var(--border); border-radius: 4px; padding: 14px 16px; margin-bottom: 12px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px 12px; }
    .mkt-box { background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; margin-bottom: 14px; }
    .mkt-header { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 12px 16px; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; }
    .mkt-col { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; align-items: center; }
    .doc-tabs { display: flex; background: #e2e8f0; border-bottom: 1px solid var(--border); padding: 0 8px; }
    .doc-tab-btn { padding: 7px 16px; border: 0; background: none; font-size: 12px; font-weight: 600; cursor: pointer; }
    .doc-tab-btn.active { color: #0b3d91; border-bottom: 2px solid #0b3d91; background: #fff; }
    .doc-tab-content { display: none; padding: 14px; }
    .doc-tab-content.active { display: block; }
    .table-tools { padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .grid-wrap { overflow-x: auto; border: 1px solid var(--border); background: #fff; }
    table.dense { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    table.dense th { background: #e2e8f0; border: 1px solid var(--border); padding: 6px 8px; font-weight: 700; white-space: nowrap; }
    table.dense td { border: 1px solid var(--border); padding: 4px 8px; white-space: nowrap; }
    .mkt-footer { display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: 12px 16px; background: #f8fafc; border-top: 1px solid var(--border); }
    .totals-box { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 12px; align-items: center; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff; padding: 10px 16px; font-size: 12.5px; border-radius: 6px; display: none; z-index: 10000; }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div id="login-view">
    <div class="login-box">
      <div class="brand-header">
        <div class="brand-k">K</div>
        <div><h1 style="font-size:20px;color:#0b3d91">KESHASHA ERP</h1><p style="font-size:11.5px;color:#64748b">Integrated Business One Suite</p></div>
      </div>
      <label>Select Company *</label>
      <select id="login-company">
        <option value="KESH-01">KESH-01 — Keshasha Steel & Building Supplies Ltd</option>
        <option value="ANDO-02">ANDO-02 — Ando Construction & Yard Ltd</option>
      </select>
      <label>Email Address</label>
      <input type="email" id="login-email" value="admin@keshasha.co.tz" />
      <label>Password</label>
      <input type="password" id="login-password" value="admin123" />
      <button class="btn btn-primary" style="width:100%;padding:9px;" onclick="doLogin()">Sign In</button>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid #e2e8f0;display:flex;flex-direction:column;gap:6px;">
        <button class="btn btn-sm" onclick="promptCreateCompany()">+ Create New Company</button>
        <button class="btn btn-sm" onclick="promptCreateCompanyUser()">+ Create Company User</button>
      </div>
    </div>
  </div>

  <div id="app-view">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:26px;height:26px;background:#fff;color:#0b3d91;display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:4px;">K</div>
        <strong>KESHASHA ERP</strong>
        <span id="active-company-display" style="font-size:12px;opacity:0.9;"></span>
      </div>
      <div>
        <span id="user-display">Super Admin</span>
        <button class="btn btn-sm" style="margin-left:8px;" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <div class="menubar">
      <div class="menu-item">Modules
        <div class="dropdown">
          <button onclick="nav('so')">Sales Order</button>
          <button onclick="nav('po')">Purchase Order</button>
          <button onclick="nav('users')">Users Management</button>
          <button onclick="nav('authz')">Authorizations</button>
        </div>
      </div>
    </div>

    <div class="main-layout">
      <nav class="sidebar">
        <div class="mod-group">
          <div class="mod-header" onclick="toggleGroup('grp-sales')"><span>Sales — A/R</span><span>▾</span></div>
          <div class="mod-items open" id="grp-sales">
            <button class="mod-btn" onclick="nav('sq')">Sales Quotation [SQ]</button>
            <button class="mod-btn active" onclick="nav('so')">Sales Order [SO]</button>
            <button class="mod-btn" onclick="nav('dn')">Delivery Note [DN]</button>
            <button class="mod-btn" onclick="nav('inv')">A/R Invoice [INV]</button>
          </div>
        </div>
        <div class="mod-group">
          <div class="mod-header" onclick="toggleGroup('grp-purch')"><span>Purchasing — A/P</span><span>▾</span></div>
          <div class="mod-items" id="grp-purch">
            <button class="mod-btn" onclick="nav('pr')">Purchase Request [PR]</button>
            <button class="mod-btn" onclick="nav('po')">Purchase Order [PO]</button>
            <button class="mod-btn" onclick="nav('grpo')">Goods Receipt PO [GRPO]</button>
            <button class="mod-btn" onclick="nav('apinv')">A/P Invoice [APINV]</button>
          </div>
        </div>
        <div class="mod-group">
          <div class="mod-header" onclick="toggleGroup('grp-admin')"><span>Administration</span><span>▾</span></div>
          <div class="mod-items open" id="grp-admin">
            <button class="mod-btn" onclick="nav('companies')">Companies</button>
            <button class="mod-btn" onclick="nav('branches')">Branches</button>
            <button class="mod-btn" onclick="nav('users')">Users Management</button>
            <button class="mod-btn" onclick="nav('authz')">Authorizations</button>
          </div>
        </div>
      </nav>

      <div class="content-area">
        <div class="subbar">
          <div style="font-weight:700;color:#0b3d91;" id="page-title">Sales Order [SO]</div>
        </div>
        <div class="view-container" id="main-view"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Operation completed</div>

  <script>
    const DEFAULT_DATA = {
      activeCompanyId: "KESH-01",
      companies: [
        { code: "KESH-01", name: "Keshasha Steel & Building Supplies Ltd" },
        { code: "ANDO-02", name: "Ando Construction & Yard Ltd" }
      ],
      users: [
        { email: "admin@keshasha.co.tz", name: "Super Admin", role: "Super Admin", password: "••••••••", auths: { sales: 2, purchasing: 2, inventory: 2, banking: 2, financials: 2, admin: 2 } },
        { email: "sales@keshasha.co.tz", name: "Juma Sales", role: "Sales Rep", password: "••••••••", auths: { sales: 2, purchasing: 1, inventory: 1, banking: 0, financials: 0, admin: 0 } },
        { email: "accountant@keshasha.co.tz", name: "Fatma Finance", role: "Accountant", password: "••••••••", auths: { sales: 1, purchasing: 1, inventory: 1, banking: 2, financials: 2, admin: 0 } }
      ],
      customers: [
        { bpCode: "C20001", name: "Kilimanjaro Commercial Builders Ltd" }
      ],
      vendors: [
        { bpCode: "S10001", name: "Tanzania Steel Mills & Heavy Forging Ltd" }
      ],
      salesOrders: [
        {
          docNo: "SO-26-9243", bpCode: "C20001", bpName: "Kilimanjaro Commercial Builders Ltd",
          docDate: "2026-11-09", dueDate: "2026-11-26", branch: "CHANIKA MAIN YARD",
          lines: [
            { itemCode: "STL-REB-012", name: "Deformed High-Tensile Steel Rebars 12mm x 12m", qty: 120, uom: "PCS", price: 27500, disc: 0, taxCode: "V18" }
          ]
        }
      ]
    };

    let AppState = JSON.parse(localStorage.getItem("KESHASHA_ERP_STORE")) || DEFAULT_DATA;
    function saveState() { localStorage.setItem("KESHASHA_ERP_STORE", JSON.stringify(AppState)); }
    function toast(msg) { const t=document.getElementById("toast"); t.textContent=msg; t.className="toast show"; setTimeout(()=>t.className="toast",2500); }

    function doLogin() {
      const co = document.getElementById("login-company").value;
      AppState.activeCompanyId = co;
      saveState();
      document.getElementById("login-view").style.display = "none";
      document.getElementById("app-view").style.display = "flex";
      const comp = AppState.companies.find(c => c.code === co) || AppState.companies[0];
      document.getElementById("active-company-display").textContent = "Entity: " + comp.name + " (" + comp.code + ")";
      nav("so");
    }

    function doLogout() {
      document.getElementById("app-view").style.display = "none";
      document.getElementById("login-view").style.display = "flex";
    }

    function toggleGroup(id) { const el = document.getElementById(id); if (el) el.classList.toggle("open"); }

    function nav(page) {
      document.querySelectorAll(".mod-btn").forEach(b => b.classList.remove("active"));
      event?.target?.classList?.add("active");
      const titleEl = document.getElementById("page-title");
      const main = document.getElementById("main-view");

      if (page === "users") {
        titleEl.textContent = "Administration — Users Management";
        renderUsersManagementView(main);
      } else if (page === "authz") {
        titleEl.textContent = "Administration — User Authorizations (Module Dropdown Control)";
        renderAuthorizationsView(main);
      } else {
        titleEl.textContent = page.toUpperCase() + " — Active Working Form";
        renderGenericForm(main, page);
      }
    }

    function renderUsersManagementView(container) {
      container.innerHTML = `
        <div class="form-box">
          <h3 style="color:#0b3d91;margin-bottom:10px;">+ Add New Company User</h3>
          <div class="form-grid">
            <div><label>User Email *</label><input type="email" id="u-email" placeholder="user@keshasha.co.tz" /></div>
            <div><label>Full Name *</label><input type="text" id="u-name" placeholder="E.g. Baraka Petro" /></div>
            <div><label>Designation / Role</label><input type="text" id="u-role" placeholder="E.g. Inventory Clerk" /></div>
            <div><label>Password</label><input type="password" id="u-pwd" value="123456" /></div>
          </div>
          <div style="text-align:right;"><button class="btn btn-sm btn-primary" onclick="addUserRecord()">+ Save User</button></div>
        </div>
        <div class="mkt-box">
          <div class="table-tools"><strong>System Users (${AppState.users.length})</strong><span>Configure permissions at <b>Authorizations</b></span></div>
          <div class="grid-wrap">
            <table class="dense">
              <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Action</th></tr></thead>
              <tbody>
                ${AppState.users.map((u, i) => `
                  <tr>
                    <td>${i+1}</td><td><b>${u.name}</b></td><td>${u.email}</td><td>${u.role}</td>
                    <td><span style="color:#166534;font-weight:700">Active</span></td>
                    <td><button class="btn btn-sm btn-primary" onclick="nav('authz');setTimeout(()=>selectAuthUser('${u.email}'),100);">Permissions ➔</button></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function addUserRecord() {
      const email = document.getElementById("u-email").value.trim().toLowerCase();
      const name = document.getElementById("u-name").value.trim();
      const role = document.getElementById("u-role").value.trim() || "Operator";
      if (!email || !name) return toast("Email & Name required");
      AppState.users.push({ email, name, role, password:"••••••••", auths:{sales:1,purchasing:1,inventory:1,banking:0,financials:0,admin:0} });
      saveState();
      renderUsersManagementView(document.getElementById("main-view"));
      toast("User added!");
    }

    function renderAuthorizationsView(container) {
      container.innerHTML = `
        <div style="background:#fff;border:1px solid #cbd5e1;padding:16px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
            <div><h2 style="font-size:15px;color:#0b3d91;">User Authorizations (Module Access Dropdowns)</h2>
            <p style="font-size:11.5px;color:#64748b;">Specify exact module permissions for each user</p></div>
            <button class="btn btn-sm btn-primary" onclick="saveUserAuths()">💾 Save Authorizations</button>
          </div>
          <div style="display:grid;grid-template-columns:220px 1fr;gap:20px;">
            <div style="border-right:1px solid #e2e8f0;padding-right:12px;">
              <label>Select User:</label>
              <select id="auth-user-select" onchange="loadUserAuths(this.value)">
                ${AppState.users.map(u => `<option value="${u.email}">${u.name} (${u.role})</option>`).join("")}
              </select>
            </div>
            <div>
              <table class="dense">
                <thead><tr><th>Module</th><th style="width:220px;">Access Permission (Dropdown)</th><th>Status</th></tr></thead>
                <tbody id="auth-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      `;
      loadUserAuths(AppState.users[0].email);
    }

    const AUTH_MODULES = [
      { key: "sales", name: "Sales — A/R (Quotations, Orders, Deliveries, Invoices)" },
      { key: "purchasing", name: "Purchasing — A/P (Requests, Orders, GRPO, Invoices)" },
      { key: "inventory", name: "Inventory (Item Master, Stock Movements, Warehouses)" },
      { key: "banking", name: "Banking & Payments (Incoming & Outgoing Payments)" },
      { key: "financials", name: "Financials & G/L (Chart of Accounts, Journal Entries)" },
      { key: "admin", name: "Administration & Settings" }
    ];

    function loadUserAuths(email) {
      const u = AppState.users.find(x => x.email === email) || AppState.users[0];
      const tbody = document.getElementById("auth-tbody");
      if (!tbody) return;
      tbody.innerHTML = AUTH_MODULES.map(m => {
        const val = u.auths[m.key] ?? 2;
        return `
          <tr>
            <td><b>${m.name}</b></td>
            <td>
              <select data-mod="${m.key}" class="auth-level-sel">
                <option value="2" ${val===2?"selected":""}>Full Authorization</option>
                <option value="1" ${val===1?"selected":""}>Read Only</option>
                <option value="0" ${val===0?"selected":""}>No Authorization</option>
              </select>
            </td>
            <td><b style="color:${val===2?'#166534':val===1?'#0284c7':'#b91c1c'}">${val===2?'Full Access':val===1?'Read Only':'Blocked'}</b></td>
          </tr>
        `;
      }).join("");
    }

    function selectAuthUser(email) {
      const sel = document.getElementById("auth-user-select");
      if (sel) { sel.value = email; loadUserAuths(email); }
    }

    function saveUserAuths() {
      const email = document.getElementById("auth-user-select").value;
      const u = AppState.users.find(x => x.email === email);
      if (u) {
        document.querySelectorAll(".auth-level-sel").forEach(s => {
          u.auths[s.dataset.mod] = parseInt(s.value, 10);
        });
        saveState();
        toast("Authorizations saved for " + u.name);
      }
    }

    function renderGenericForm(container, page) {
      container.innerHTML = `
        <div class="form-box">
          <h3 style="color:#0b3d91;margin-bottom:10px;">+ Add New Entry (${page.toUpperCase()})</h3>
          <div class="form-grid">
            <div><label>Code / Ref *</label><input type="text" placeholder="${page.toUpperCase()}-01" /></div>
            <div><label>Description *</label><input type="text" placeholder="Description..." /></div>
          </div>
          <div style="text-align:right;"><button class="btn btn-sm btn-primary" onclick="toast('Record saved successfully!')">+ Save Entry</button></div>
        </div>
      `;
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (AppState.activeCompanyId) doLogin();
    });
  </script>
</body>
</html>
