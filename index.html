    function startPurchase(docType) {
      purchaseLines = [{ lineType: "I", itemCode: "", name: "", qty: 1, numPerMsr: 1, price: 0, discPct: 0, whsCode: "", acctCode: "" }];
      purchaseCopyFromId = null;
      const form = document.getElementById("purch-form");
      if (!form) return;
      form.style.display = "block";
      const meta = PURCH_META[docType] || { title: docType };
      const winId = openAppWindow(meta.title + " — New", "", { w: 980, h: 560 });
      const body = document.querySelector("#" + winId + " .win-body");
      if (body) { body.innerHTML = ""; body.appendChild(form); form.style.display = "block"; }
      renderPurchaseLines();
    }
    function addPurchaseLine() {
      purchaseLines.push({ itemCode: "", name: "", qty: 1, price: 0, discPct: 0 });
      renderPurchaseLines();
    }
    function dimTypeName(code) {
      const t = dimensionTypes.find(x => x.companyId === companyFilterId() && (x.code||"").toUpperCase() === code.toUpperCase());
      return t ? t.name : code;
    }
    function renderPurchaseLines() {
      const cid = companyFilterId();
      const itemList = scoped(items, cid);
      const accts = scoped(accounts, cid).filter(a => a.postable !== false);
      const dims = scoped(dimensions, cid);
      const taxList = scoped(taxCodes, cid).filter(t => (t.taxType||"").toUpperCase() === "INPUT" || (t.taxType||"").toUpperCase() === "EXEMPT");
      const body = document.getElementById("p-lines");
      const head = document.querySelector("#purch-form thead tr");
      if (!body) return;
      const visible = PURCH_LINE_COLS.filter(c => isPurchColVisible(c.key));
      if (head) {
        head.innerHTML = `<th>#</th>${visible.map(c => {
          let label = c.label;
          if (c.key === "project") label = dimTypeName("PROJECT");
          else if (c.key === "ocrCode") label = dimTypeName("DEPARTMENT");
          else if (c.key === "ocrCode2") label = dimTypeName("BRANCH");
          else if (c.key === "ocrCode3") label = dimTypeName("TEAM");
          return `<th>${esc(label)}</th>`;
        }).join("")}<th></th>`;
      }
      const common = `style="width:100%;margin:0;padding:2px;border:1px solid var(--border);min-width:60px"`;
      function pCell(idx, key, l) {
        const isItem = (l.lineType || "I") === "I";
        if (key === "lineType") return `<select onchange="purchaseLines[${idx}].lineType=this.value;renderPurchaseLines();" ${common}><option value="I" ${isItem?"selected":""}>Item</option><option value="S" ${!isItem?"selected":""}>Service</option></select>`;
        if (key === "itemCode") {
          if (!isItem) return `<span style="color:#999">—</span>`;
          return `<select onchange="purchaseLines[${idx}].itemCode=this.value;onPurchItemChange(${idx});" ${common}><option value="">—</option>${itemList.map(i=>`<option value="${i.itemCode}" ${i.itemCode===l.itemCode?"selected":""}>${esc(i.itemCode)}</option>`).join("")}</select>`;
        }
        if (key === "name") {
          if (isItem) return `<select onchange="purchaseLines[${idx}].itemCode=this.value;onPurchItemChange(${idx});" ${common}><option value="">—</option>${itemList.map(i=>`<option value="${i.itemCode}" ${i.itemCode===l.itemCode?"selected":""}>${esc(i.name||i.itemCode)}</option>`).join("")}</select>`;
          return `<input value="${esc(l.name||"")}" onchange="purchaseLines[${idx}].name=this.value" ${common}>`;
        }
        if (key === "qty") return `<input type="number" step="any" value="${l.qty||""}" onchange="purchaseLines[${idx}].qty=this.value;renderPurchaseLines();" ${common}>`;
        if (key === "numPerMsr") return `<input type="number" step="any" value="${l.numPerMsr||1}" onchange="purchaseLines[${idx}].numPerMsr=this.value;renderPurchaseLines();" ${common}>`;
        if (key === "whsCode") {
          if (!isItem) return `<span style="color:#999">—</span>`;
          return `<select onchange="purchaseLines[${idx}].whsCode=this.value" ${common}><option value="">—</option>${scoped(warehouses,cid).map(w=>`<option value="${w.code}" ${w.code===l.whsCode?"selected":""}>${esc(w.code)}</option>`).join("")}</select>`;
        }
        if (key === "acctCode") {
          if (isItem) return `<span style="color:#999">—</span>`;
          return `<select onchange="purchaseLines[${idx}].acctCode=this.value" ${common}><option value="">—</option>${accts.map(a=>`<option value="${a.acctCode}" ${a.acctCode===l.acctCode?"selected":""}>${esc(a.acctCode)}</option>`).join("")}</select>`;
        }
        if (key === "price" || key === "priceBefDi") return `<input type="number" step="any" value="${l.price||""}" onchange="purchaseLines[${idx}].price=this.value;renderPurchaseLines();" ${common}>`;
        if (key === "discPct") return `<input type="number" step="any" value="${l.discPct||""}" onchange="purchaseLines[${idx}].discPct=this.value;renderPurchaseLines();" ${common}>`;
        if (key === "taxCode") return `<select onchange="purchaseLines[${idx}].taxCode=this.value" ${common}><option value="">—</option>${taxList.map(t=>`<option value="${esc(t.code)}" ${t.code===l.taxCode?"selected":""}>${esc(t.code)}</option>`).join("")}</select>`;
        if (key === "lineTotal") {
          const lt = (parseFloat(l.qty)||0) * (parseFloat(l.price)||0) * (1 - (parseFloat(l.discPct)||0)/100);
          return `<span style="display:block;text-align:right;padding:2px">${lt.toLocaleString(undefined,{minimumFractionDigits:2})}</span>`;
        }
        if (key === "project" || key === "ocrCode" || key === "ocrCode2" || key === "ocrCode3") {
          const dimType = key === "project" ? "PROJECT" : key === "ocrCode" ? "DEPARTMENT" : key === "ocrCode2" ? "BRANCH" : "TEAM";
          const opts = dims.filter(d => (d.dimType||"").toUpperCase() === dimType).map(d => `<option value="${d.code}" ${d.code===l[key]?"selected":""}>${esc(d.code)}</option>`).join("");
          return `<select onchange="purchaseLines[${idx}].${key}=this.value" ${common}><option value="">—</option>${opts}</select>`;
        }
        return `<input value="${esc(l[key]||"")}" onchange="purchaseLines[${idx}].${key}=this.value" ${common}>`;
      }
      body.innerHTML = purchaseLines.map((l, idx) => {
        return `<tr><td>${idx+1}</td>${visible.map(c => `<td>${pCell(idx, c.key, l)}</td>`).join("")}<td><button class="btn btn-sm btn-danger" onclick="purchaseLines.splice(${idx},1);renderPurchaseLines();">✕</button></td></tr>`;
      }).join("");
      const ptbl = document.querySelector("#purch-form table.grid");
      if (ptbl && typeof enableColumnResize === "function") enableColumnResize(ptbl);
      // Update footer totals
      let bef = 0, disc = 0, tax = 0;
      purchaseLines.forEach(l => {
        const qty = parseFloat(l.qty)||0;
        const price = parseFloat(l.price)||0;
        const dp = parseFloat(l.discPct)||0;
        const gross = qty * price;
        const dAmt = gross * dp / 100;
        bef += gross;
        disc += dAmt;
      });
      const freight = parseFloat(document.getElementById("p-freight")&&document.getElementById("p-freight").value)||0;
      const set = (id, n) => { const el = document.getElementById(id); if (el) el.textContent = n.toLocaleString(undefined,{minimumFractionDigits:2}); };
      set("p-total-bef", bef);
      set("p-total-disc", disc);
      set("p-total-tax", tax);
      set("p-total", bef - disc + freight + tax);
    }

    function onPurchItemChange(idx) {
      const code = purchaseLines[idx].itemCode;
      const it = items.find(i => i.itemCode === code && i.companyId === companyFilterId());
      if (it) {
        purchaseLines[idx].name = it.name || "";
        purchaseLines[idx].price = parseFloat(it.lastPurchasePrice) || 0;
      }
      renderPurchaseLines();
    }
    function onRequesterChange() {
      const sel = document.getElementById("p-requester");
      const nameSel = document.getElementById("p-requester-name");
      const dept = document.getElementById("p-dept");
      if (!sel) return;
      const opt = sel.options[sel.selectedIndex];
      if (dept) dept.value = opt ? (opt.dataset.dept || "") : "";
      if (nameSel) nameSel.value = sel.value;
    }
    function onRequesterNameChange() {
      const nameSel = document.getElementById("p-requester-name");
      const sel = document.getElementById("p-requester");
      const dept = document.getElementById("p-dept");
      if (!nameSel) return;
      const opt = nameSel.options[nameSel.selectedIndex];
      if (sel) sel.value = nameSel.value;
      if (dept) dept.value = opt ? (opt.dataset.dept || "") : "";
    }
    function onPurchVendorChange() {
      const code = document.getElementById("p-bp").value;
      const p = partners.find(x => x.bpCode === code && x.companyId === companyFilterId());
      const el = document.getElementById("p-bp-name");
      const nameSel = document.getElementById("p-bp-name-sel");
      if (el) el.value = p ? p.name : "";
      if (nameSel) nameSel.value = code;
    }
    function onPurchVendorNameChange() {
      const nameSel = document.getElementById("p-bp-name-sel");
      const codeSel = document.getElementById("p-bp");
      const el = document.getElementById("p-bp-name");
      if (!nameSel) return;
      const code = nameSel.value;
      if (codeSel) codeSel.value = code;
      const p = partners.find(x => x.bpCode === code && x.companyId === companyFilterId());
      if (el) el.value = p ? p.name : "";
    }

    async function postPurchaseDoc(docType) {
      const companyId = activeCompanyId || companyFilterId();
      const bpCode = document.getElementById("p-bp").value;
      const bpName = document.getElementById("p-bp-name").value;
      const docDate = document.getElementById("p-date").value;
      const dueDate = document.getElementById("p-due").value || null;
      const warehouseCode = document.getElementById("p-wh").value || null;
      const branchCode = document.getElementById("p-branch").value || null;
      const remarks = document.getElementById("p-remarks").value.trim() || null;
      const requester = (document.getElementById("p-requester") && document.getElementById("p-requester").value) || null;
      const department = (document.getElementById("p-dept") && document.getElementById("p-dept").value) || null;
      if (!companyId) return toast("Company required");
      if (!bpCode) return toast("Vendor is required");
      if (!docDate) return toast("Posting Date is required");
      if (!branchCode) return toast("Branch is required");
      if ((docType === "GRPO" || docType === "APINV") && !warehouseCode) return toast("Warehouse is required for " + docType);
      for (let i = 0; i < purchaseLines.length; i++) {
        const l = purchaseLines[i];
        const isItem = (l.lineType || "I") === "I";
        if (isItem && l.itemCode && !l.whsCode) return toast("Warehouse required for item line " + (i+1));
        if (!isItem && (l.name || l.acctCode) && !l.acctCode) return toast("GL Account required for service line " + (i+1));
      }
      const lines = purchaseLines.filter(l => {
        const isItem = (l.lineType || "I") === "I";
        if (isItem) return l.itemCode && parseFloat(l.qty) > 0 && l.whsCode;
        return (l.name || l.acctCode) && parseFloat(l.qty) > 0 && l.acctCode;
      }).map((l, i) => {
        const isItem = (l.lineType || "I") === "I";
        return {
          lineNum: i + 1, lineType: l.lineType || "I",
          itemCode: isItem ? l.itemCode : null,
          name: l.name || "",
          qty: parseFloat(l.qty),
          whsCode: isItem ? l.whsCode : null,
          acctCode: !isItem ? l.acctCode : null,
          price: parseFloat(l.price)||0, discPct: parseFloat(l.discPct)||0,
          dimPROJECT: l.dimPROJECT || null, dimDEPARTMENT: l.dimDEPARTMENT || null, dimBRANCH: l.dimBRANCH || null,
          lineTotal: (parseFloat(l.qty)||0) * (parseFloat(l.price)||0) * (1 - (parseFloat(l.discPct)||0)/100)
        };
      });
      if (!lines.length) return toast("Add at least one valid line");
      const grandTotal = lines.reduce((s, l) => s + l.lineTotal, 0);
      let docNo;
      try { docNo = await nextSalesDocNo(companyId, docType); }
      catch (e) { return toast(e.message); }
      const data = {
        companyId, docType, docNo, docDate, dueDate, bpCode, bpName,
        warehouseCode, branchCode, remarks, requester, department, lines, grandTotal,
        status: "open", createdBy: currentUser.email, createdAt: new Date().toISOString()
      };
      // GL for A/P Invoice
      if (docType === "APINV" || docType === "APCM") {
        const ap = getMap(companyId, "AP_CONTROL");
        const invAcct = getMap(companyId, "INVENTORY");
        if (!ap || !invAcct) return toast("GL Account Determination is mandatory: set AP Control and Inventory before posting " + docType);
        const glLines = docType === "APINV"
          ? [{ acctCode: invAcct, debit: grandTotal, credit: 0, lineMemo: "AP Inv " + docNo },
             { acctCode: ap, debit: 0, credit: grandTotal, lineMemo: "AP " + docNo }]
          : [{ acctCode: ap, debit: grandTotal, credit: 0, lineMemo: "AP CM " + docNo },
             { acctCode: invAcct, debit: 0, credit: grandTotal, lineMemo: "AP CM inv " + docNo }];
        try {
          const je = await postJournalEntry(companyId, {
            refDate: docDate, memo: docType + " " + docNo, lines: glLines,
            sourceType: docType, sourceDoc: docNo
          });
          data.journalNo = je.transId;
        } catch (ge) { toast("Saved but GL failed: " + ge.message); }
      }
      // Stock for GRPO
      if (docType === "GRPO" && warehouseCode) {
        const sDocNo = await nextStockDocNo(companyId, "IN");
        const sData = {
          companyId, docNo: sDocNo, docType: "IN", docDate, warehouseCode,
          remarks: "GRPO " + docNo, lines: lines.map((l,i)=>({ lineNum:i+1, itemCode:l.itemCode, name:l.name, qty: (parseFloat(l.qty)||0) * (parseFloat(l.numPerMsr)||1) })),
          status: "posted", createdBy: currentUser.email, createdAt: new Date().toISOString(), sourceDoc: docNo
        };
        const sRef = await db.collection("stock_docs").add(sData);
        stockDocs.unshift({ id: sRef.id, ...sData });
        data.stockDocNo = sDocNo;
      }
      const ref = await db.collection("purchase_docs").add(data);
      purchaseDocs.unshift({ id: ref.id, ...data });
      // Close base
      if (purchaseCopyFromId) {
        const base = purchaseDocs.find(x => x.id === purchaseCopyFromId);
        if (base && base.status !== "cancelled") {
          const payload = { status: "closed", targetDocType: docType, targetDocNo: docNo, targetDocId: ref.id };
          await db.collection("purchase_docs").doc(base.id).update(payload);
          Object.assign(base, payload);
        }
        purchaseCopyFromId = null;
      }
      toast("Posted " + docNo + (data.journalNo ? " / JE " + data.journalNo : ""), true);

    async function nextSalesDocNo(companyId, docType) {
      const year = new Date().getFullYear();
      const yy = String(year).slice(-2);
      const meta = (typeof SALES_META !== "undefined" && SALES_META[docType])
        || (typeof PURCH_META !== "undefined" && PURCH_META[docType])
        || { prefix: docType };
      const prefix = (meta.prefix || docType) + "-" + yy + "-";
      const series = docSeries.find(s => s.companyId === companyId && s.docType === docType && (s.prefix||"").includes("-"+yy+"-"));
      if (!series) {
        throw new Error("Numbering series for " + docType + " (" + year + ") is not set up. Go to Administration → Document Numbering and Seed All Series first.");
      }
      const num = series.nextNumber || 1;
      await db.collection("doc_series").doc(series.id).update({ nextNumber: num + 1 });
      series.nextNumber = num + 1;
      return prefix + String(num).padStart(4, "0");
    }

    function onSalesLineField(idx, key, value) {
      salesLines[idx][key] = value;
      const l = salesLines[idx];
      // Cutting size: Qty = Pcs × Size(m)
      if (key === "pcs" || key === "sizeMeter" || key === "sizeWidth" || key === "sizeHeight") {
        const pcs = parseFloat(l.pcs) || 0;
        const len = parseFloat(l.sizeMeter) || 0;
        const w = parseFloat(l.sizeWidth) || 0;
        const h = parseFloat(l.sizeHeight) || 0;
        if (pcs && len) l.qty = +(pcs * len).toFixed(6);
        else if (pcs && w && h) l.qty = +(pcs * w * h).toFixed(6);
        else if (pcs && w) l.qty = +(pcs * w).toFixed(6);
        else if (len && !pcs) l.qty = len;
      }
      // Entering unit price
      if (key === "price" && (l.priceBefDi === "" || l.priceBefDi == null || parseFloat(l.discPct)||0 === 0)) {
        l.priceBefDi = value;
      }
      if (key === "priceBefDi") {
        l.priceBefDi = value;
      }
      syncLinePrices(l);
      if (["qty","price","discPct","priceBefDi","pcs","sizeMeter","sizeWidth","sizeHeight","numPerMsr","vatPrcnt"].includes(key)) {
        recalcSalesTotal();
        renderSalesLines();
      }
    }

    /** SAP-style price chain:
     *  Unit Price (priceBefDi) → Price after Discount (price) → Row Total (lineTotal)
     *  Gross Price after Discount (priceAfVAT) → Gross Total (gTotal)
     *  Items per Unit (numPerMsr) multiplies quantity basis when > 0
     */
    function effectiveQty(l) {
      const qty = parseFloat(l.qty) || 0;
      const per = parseFloat(l.numPerMsr) || 0;
      return per > 0 ? qty * per : qty;
    }
    function unitPriceBeforeDisc(l) {
      const bef = parseFloat(l.priceBefDi);
      if (!isNaN(bef) && l.priceBefDi !== "" && l.priceBefDi != null) return bef;
      return parseFloat(l.price) || 0;
    }
    function priceAfterDiscount(l) {
      const unit = unitPriceBeforeDisc(l);
      const disc = parseFloat(l.discPct) || 0;
      return unit * (1 - disc / 100);
    }
    function lineTotal(l) {
      return effectiveQty(l) * priceAfterDiscount(l);
    }
    function grossUnitAfterDisc(l) {
      const net = priceAfterDiscount(l);
      const vat = parseFloat(l.vatPrcnt) || 0;
      return net * (1 + vat / 100);
    }
    function grossLineTotal(l) {
      return effectiveQty(l) * grossUnitAfterDisc(l);
    }
    function syncLinePrices(l) {
      const unit = unitPriceBeforeDisc(l);
      l.priceBefDi = unit;
      l.price = priceAfterDiscount(l);
      l.lineTotal = lineTotal(l);
      l.priceAfVAT = grossUnitAfterDisc(l);
      l.gTotal = grossLineTotal(l);
      l.vatSum = l.gTotal - l.lineTotal;
      return l;
    }

    function enableColumnResize(table) {
      if (!table) return;
      const cols = table.querySelectorAll("th");
      cols.forEach(th => {
        let handle = th.querySelector(".col-resizer");
        if (!handle) {
          handle = document.createElement("span");
          handle.className = "col-resizer";
          handle.style.cssText = "position:absolute;right:0;top:0;bottom:0;width:5px;cursor:col-resize;user-select:none";
          th.style.position = "relative";
          th.appendChild(handle);
        }
        let startX, startW;
        handle.onmousedown = function(e) {
          e.preventDefault();
          e.stopPropagation();
          startX = e.pageX;
          startW = th.offsetWidth;
          function onMove(ev) {
            const w = Math.max(50, startW + (ev.pageX - startX));
            th.style.width = w + "px";
            th.style.minWidth = w + "px";
          }
          function onUp() {
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onUp);
          }
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        };
      });
    }

    function renderSalesLines() {
      const cid = currentUser.isSuperAdmin && document.getElementById("s-co")
        ? document.getElementById("s-co").value
        : companyFilterId();
      const itemList = scoped(items, cid).filter(i => i.isSales !== false);
      const whList = scoped(warehouses, cid);
      const body = document.getElementById("s-lines");
      const head = document.getElementById("s-lines-head");
      if (!body) return;
      const visible = SALES_LINE_COLS.filter(c => isLineColVisible(c.key));

      if (head) {
        head.innerHTML = `<tr>
          <th style="width:28px">#</th>
          ${visible.map(c => `<th data-col="${c.key}" style="min-width:80px">${esc(c.label)}<span class="col-resizer"></span></th>`).join("")}
          <th style="width:36px"></th>
        </tr>`;
        enableColumnResize(head.closest("table"));
      }

      const itemOpts = (selected) => itemList.map(i =>
        `<option value="${i.itemCode}" ${i.itemCode===selected?"selected":""}>${esc(i.itemCode)} — ${esc(i.name)}</option>`
      ).join("");
      const whOpts = (selected) => `<option value="">—</option>` + whList.map(w =>
        `<option value="${w.code}" ${w.code===selected?"selected":""}>${esc(w.code)}</option>`
      ).join("");

      function cellInput(idx, key, val, type) {
        const common = `style="width:100%;margin:0;padding:3px;border:1px solid var(--border);min-width:70px"`;
        if (key === "lineType") {
          return `<select onchange="salesLines[${idx}].lineType=this.value;renderSalesLines();" ${common}>
            <option value="I" ${(val||"I")==="I"?"selected":""}>Item</option>
            <option value="S" ${val==="S"?"selected":""}>Service</option>
          </select>`;
        }
        if (key === "itemCode") {
          return `<select onchange="onSalesItem(${idx}, this.value)" ${common}>
            <option value="">—</option>${itemOpts(val||"")}</select>`;
        }
        if (key === "taxCode") {
          const taxList = scoped(taxCodes, cid).filter(t => (t.taxType||"").toUpperCase() === "OUTPUT" || (t.taxType||"").toUpperCase() === "EXEMPT");
          return `<select onchange="salesLines[${idx}].taxCode=this.value" ${common}><option value="">—</option>${taxList.map(t=>`<option value="${esc(t.code)}" ${t.code===val?"selected":""}>${esc(t.code)}</option>`).join("")}</select>`;
        }
        if (key === "whsCode" || key === "fromWhsCod") {
          return `<select onchange="salesLines[${idx}].${key}=this.value" ${common}>${whOpts(val||"")}</select>`;
        }
        if (key === "project" || key === "ocrCode" || key === "ocrCode2" || key === "ocrCode3" || key === "ocrCode4" || key === "ocrCode5") {
          const dimType = key === "project" ? "PROJECT" : key === "ocrCode" ? "DEPARTMENT" : key === "ocrCode2" ? "BRANCH" : key === "ocrCode3" ? "TEAM" : null;
          let dims = scoped(dimensions, cid);
          if (dimType) dims = dims.filter(d => (d.dimType||"").toUpperCase() === dimType || (key==="project" && (d.dimType||"").toUpperCase()==="PROJECT"));
          // branches as dim3 fallback
          if (key === "ocrCode2" && !dims.length) {
            return `<select onchange="salesLines[${idx}].${key}=this.value" ${common}><option value="">—</option>${scoped(branches,cid).map(b=>`<option value="${b.code}" ${b.code===val?"selected":""}>${esc(b.code)}</option>`).join("")}</select>`;
          }
          return `<select onchange="salesLines[${idx}].${key}=this.value" ${common}><option value="">—</option>${dims.map(d=>`<option value="${d.code}" ${d.code===val?"selected":""}>${esc(d.code)} — ${esc(d.name||"")}</option>`).join("")}</select>`;
        }
        if (key === "lineTotal" || key === "gTotal" || key === "vatSum" || key === "priceAfVAT" || key === "price" || key === "grssProfit") {
          syncLinePrices(salesLines[idx]);
          const l = salesLines[idx];
          let n = 0;
          if (key === "lineTotal") n = l.lineTotal;
          else if (key === "gTotal") n = l.gTotal;
          else if (key === "priceAfVAT") n = l.priceAfVAT;
          else if (key === "price") n = l.price;
          else if (key === "vatSum") n = l.vatSum;
          else n = parseFloat(val)||0;
          return `<span style="display:block;text-align:right;padding:3px">${Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`;
        }
        if (key === "lineStatus") {
          return `<input value="${esc(val||"O")}" readonly ${common}>`;
        }
        const t = (type || (["qty","openQty","price","priceBefDi","discPct","rate","vatPrcnt","numPerMsr","packQty","invQty","weight1","volume","stockPrice"].includes(key) ? "number" : "text"));
        const step = t === "number" ? ' step="any"' : "";
        return `<input type="${t}"${step} value="${val!=null&&val!==""?esc(String(val)):""}" onchange="onSalesLineField(${idx},'${key}',this.value)" ${common}>`;
      }

      body.innerHTML = salesLines.map((l, idx) => {
        return `<tr>
          <td>${idx+1}</td>
          ${visible.map(c => {
            let val = l[c.key];
            if (c.key === "name") val = l.name;
            if (c.key === "lineTotal") val = lineTotal(l);
            return `<td>${cellInput(idx, c.key, val)}</td>`;
          }).join("")}
          <td><button class="btn btn-sm btn-danger" onclick="salesLines.splice(${idx},1);renderSalesLines();recalcSalesTotal();">✕</button></td>
        </tr>`;
      }).join("");
      recalcSalesTotal();
    }


    function getSalesColVisibility() {
      try {
        const raw = localStorage.getItem("keshasha_sales_cols");
        if (!raw) return {};
        const v = JSON.parse(raw);
        return v && typeof v === "object" ? v : {};
      } catch (e) {
        return {};
      }

      if (!keys.length) {
        const c = SALES_LINE_COLS.find(x => x.key === key);
        return c ? !!c.def : true;

      syncLinePrices(salesLines[idx]);

    function onSalesCurrencyChange() {
      const cur = document.getElementById("s-currency") && document.getElementById("s-currency").value;
      const date = document.getElementById("s-date") && document.getElementById("s-date").value;
      const rateEl = document.getElementById("s-rate");
      if (!cur || !rateEl) { if (rateEl) rateEl.value = 1; recalcSalesTotal(); return; }

    function recalcSalesTotal() {
      let before = 0, disc = 0, tax = 0, total = 0;
      salesLines.forEach(l => {
        syncLinePrices(l);
        const qty = effectiveQty(l);
        const unit = unitPriceBeforeDisc(l);
        before += qty * unit;
        disc += qty * unit * ((parseFloat(l.discPct)||0)/100);
        tax += parseFloat(l.vatSum)||0;
        total += parseFloat(l.lineTotal)||lineTotal(l);
      });
      const fmt = n => Number(n||0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = fmt(v); };
      set("s-total-bef", before);
      set("s-total-disc", disc);
      set("s-total-tax", tax);
      set("s-total", total);
    }

    async function postSalesDoc(docType) {
      const companyId = currentUser.isSuperAdmin ? document.getElementById("s-co").value : currentUser.companyId;
      const bpCode = document.getElementById("s-bp").value;
      const docDate = document.getElementById("s-date").value;
      const dueDate = document.getElementById("s-due").value || null;
      const warehouseCode = document.getElementById("s-wh").value || null;
      const branchCode = (document.getElementById("s-branch") && document.getElementById("s-branch").value) || null;
      const remarks = document.getElementById("s-remarks").value.trim() || null;
      const slpCode = (document.getElementById("s-slp") && document.getElementById("s-slp").value) || null;
      const owner = (document.getElementById("s-owner") && document.getElementById("s-owner").value) || null;
      const meta = SALES_META[docType];
      if (!companyId) return toast("Company required");
      if (!bpCode) return toast("Customer is required");
      if (!docDate) return toast("Posting Date is required");
      if (!branchCode) return toast("Branch is required");
      if ((docType === "DN" || docType === "RET" || docType === "INV") && !warehouseCode) return toast("Warehouse is required for " + docType);
      const bp = partners.find(p => p.companyId === companyId && p.bpCode === bpCode);
      const lines = salesLines.filter(l => (l.itemCode || l.name) && parseFloat(l.qty) > 0).map((l, i) => ({
        lineNum: i + 1,
        lineType: l.lineType || "I",
        itemCode: l.itemCode,
        name: l.name,
        qty: parseFloat(l.qty),
        uom: l.uom || "pcs",
        price: parseFloat(l.price) || 0,
        discPct: parseFloat(l.discPct) || 0,
        lineTotal: lineTotal(l),
        whsCode: l.whsCode || null,
        taxCode: l.taxCode || null,
        project: l.project || null,
      }));
      if (!lines.length) return toast("At least one line with item and qty is required");
      lines.forEach(l => syncLinePrices(l));
      const grandTotal = lines.reduce((s, l) => s + (parseFloat(l.lineTotal)||lineTotal(l)), 0);
      let docNo;
      try { docNo = await nextSalesDocNo(companyId, docType); }
      catch (e) { return toast(e.message); }
      const baseDoc = salesCopyFromId ? salesDocs.find(x => x.id === salesCopyFromId) : null;
      const data = {
        companyId, docType, docNo, docDate, dueDate, bpCode,
        bpName: bp ? bp.name : "",
        warehouseCode, branchCode, remarks, slpCode, owner, lines, grandTotal,
        status: "open",
        paidAmount: 0,
        baseDocId: baseDoc ? baseDoc.id : null,
        baseDocType: baseDoc ? baseDoc.docType : null,
        baseDocNo: baseDoc ? baseDoc.docNo : null,
        createdBy: currentUser.email,
        createdAt: new Date().toISOString(),
      };
      try {
        // Stock effect for Delivery / Return
        if (meta.stock && warehouseCode) {
          const stockType = meta.stock; // OUT or IN
          const sDocNo = await nextStockDocNo(companyId, stockType);
          const sData = {
            companyId, docNo: sDocNo, docType: stockType, docDate, warehouseCode,
            remarks: (docType + " " + docNo) + (remarks ? " — " + remarks : ""),
            lines: lines.map((l, i) => ({ lineNum: i+1, itemCode: l.itemCode, name: l.name, qty: l.qty, uom: l.uom })),
            status: "posted",
            createdBy: currentUser.email,
            createdAt: new Date().toISOString(),
            sourceDoc: docNo,
          };
          const sRef = await db.collection("stock_docs").add(sData);
          stockDocs.unshift({ id: sRef.id, ...sData });
          data.stockDocNo = sDocNo;
        }
        // Mandatory GL for Delivery / Invoice / Credit Memo
        if (docType === "DN" || docType === "INV" || docType === "DPI" || docType === "CM") {
          const ar = getMap(companyId, "AR_CONTROL");
          const rev = getMap(companyId, "REVENUE");
          const cogs = getMap(companyId, "COGS");
          const invAcct = getMap(companyId, "INVENTORY");
          if ((docType === "INV" || docType === "DPI" || docType === "CM") && (!ar || !rev)) {
            toast("GL Account Determination is mandatory: set AR Control and Revenue before posting " + docType);
            return;
          }
          if (docType === "DN" && (!cogs || !invAcct)) {
            toast("GL Account Determination is mandatory: set COGS and Inventory before posting Delivery");
            return;
          }
          let glLines = [];
          if (docType === "INV" || docType === "DPI") {
            glLines = [
              { acctCode: ar, debit: grandTotal, credit: 0, lineMemo: "AR " + docNo },
              { acctCode: rev, debit: 0, credit: grandTotal, lineMemo: "Revenue " + docNo },
            ];
          } else if (docType === "CM") {
            // Reverse: Dr Revenue, Cr AR (reduces customer balance)
            glLines = [
              { acctCode: rev, debit: grandTotal, credit: 0, lineMemo: "CM reverse revenue " + docNo },
              { acctCode: ar, debit: 0, credit: grandTotal, lineMemo: "CM reverse AR " + docNo },
            ];
          } else if (docType === "DN") {
            // Delivery: Dr COGS, Cr Inventory
            const cost = (lines || []).reduce((s, l) => s + ((parseFloat(l.qty)||0) * (parseFloat(l.price)||0) * 0.7), 0) || grandTotal * 0.7;
            glLines = [
              { acctCode: cogs, debit: cost, credit: 0, lineMemo: "COGS " + docNo },
              { acctCode: invAcct, debit: 0, credit: cost, lineMemo: "Inventory " + docNo },
            ];
          }
          try {
            const je = await postJournalEntry(companyId, {
              refDate: docDate, memo: docType + " " + docNo, lines: glLines,
              sourceType: docType, sourceDoc: docNo
            });
            data.journalNo = je.transId;
          } catch (ge) {
            toast("Document saved but GL failed: " + ge.message);
          }
        }
        const ref = await db.collection("sales_docs").add(data);
        salesDocs.unshift({ id: ref.id, ...data });

        // Relationship map: close base document (SQ→SO→DN→INV flow)
        if (salesCopyFromId) {
          const base = salesDocs.find(x => x.id === salesCopyFromId);
          if (base && base.status !== "cancelled") {
            const closePayload = {
              status: "closed",
              closedAt: new Date().toISOString(),
              closedBy: currentUser.email,
              closedReason: "Copied to " + docType + " " + docNo,
              targetDocId: ref.id,
              targetDocType: docType,
              targetDocNo: docNo,
            };
            await db.collection("sales_docs").doc(base.id).update(closePayload);
            Object.assign(base, closePayload);
          }
          salesCopyFromId = null;
        }
        if (!(docType === "INV" || docType === "CM")) toast("Posted " + docNo, true);
        else if (data.journalNo) toast("Posted " + docNo + " / JE " + data.journalNo, true);
        else toast("Posted " + docNo, true);
        salesEditId = null;
        // return form node to main if it was moved into a window
        const main = document.getElementById("main");
        renderSalesDoc(main, docType);
        // close topmost draft windows optionally left to user

      } catch (e) {
        toast(e.message);
      }
    }

    // ---- Multi-document windows ----
    let winZ = 90, winSeq = 0;
    const openWins = {};
    function openAppWindow(title, htmlBody, opts) {
      opts = opts || {};
      const id = "w" + (++winSeq);
      const layer = document.getElementById("win-layer");
      const tb = document.getElementById("taskbar-wins");
      if (!layer) {
        console.error("win-layer missing");
        toast("Window layer missing");
        return null;
      }
      if (tb) tb.style.display = "flex";
      const win = document.createElement("div");
      win.className = "win";
      win.id = id;
      win.style.left = (40 + (winSeq % 6) * 28) + "px";
      win.style.top = (40 + (winSeq % 6) * 28) + "px";
      win.style.width = (opts.w || 720) + "px";
      win.style.height = (opts.h || 480) + "px";
      win.style.zIndex = ++winZ;
      win.innerHTML = `<div class="win-title"><span></span><span class="win-btns">
        <button type="button" onclick="minimizeWin('${id}')">_</button>
        <button type="button" onclick="maximizeWin('${id}')">□</button>
        <button type="button" onclick="closeWin('${id}')">✕</button>
      </span></div><div class="win-body"></div>`;
      win.querySelector(".win-title span").textContent = title;
      win.querySelector(".win-body").innerHTML = htmlBody;
      layer.appendChild(win);
      openWins[id] = { el: win, title, minimized: false };
      const hd = win.querySelector(".win-title");
      let dragging=false, ox=0, oy=0;
      hd.addEventListener("mousedown", e => {
        if (e.target.closest("button") || win.classList.contains("maximized")) return;
        dragging = true; ox = e.clientX - win.offsetLeft; oy = e.clientY - win.offsetTop; e.preventDefault();
      });
      document.addEventListener("mousemove", e => {
        if (!dragging) return;
        win.style.left = Math.max(0, e.clientX - ox) + "px";
        win.style.top = Math.max(0, e.clientY - oy) + "px";
      });
      document.addEventListener("mouseup", () => { dragging = false; });
      win.addEventListener("mousedown", () => { win.style.zIndex = ++winZ; refreshTaskbar(); });
      refreshTaskbar();
      return id;
    }
    function minimizeWin(id) { const w=openWins[id]; if(!w)return; w.el.classList.add("minimized"); w.minimized=true; refreshTaskbar(); }
    function maximizeWin(id) { const w=openWins[id]; if(!w)return; w.el.classList.toggle("maximized"); w.el.classList.remove("minimized"); w.minimized=false; refreshTaskbar(); }
    function closeWin(id) { const w=openWins[id]; if(!w)return; w.el.remove(); delete openWins[id]; refreshTaskbar(); }
    function focusWin(id) { const w=openWins[id]; if(!w)return; w.el.classList.remove("minimized"); w.minimized=false; w.el.style.zIndex=++winZ; refreshTaskbar(); }
    function refreshTaskbar() {
      const tb = document.getElementById("taskbar-wins"); if (!tb) return;
      const ids = Object.keys(openWins);
      if (!ids.length) { tb.style.display="none"; tb.innerHTML=""; return; }
      tb.style.display="flex";
      tb.innerHTML = ids.map(id => `<button type="button" class="${openWins[id].minimized?"":"active"}" onclick="focusWin('${id}')">${esc(openWins[id].title)}</button>`).join("");
    }

    async function doCopyTo(docId) {
      const src = salesDocs.find(x => x.id === docId);
      if (!src) return;
      const targetEl = document.getElementById("copy-target");
      const target = targetEl ? targetEl.value : null;
      if (!target) return toast("Select target document");
      const meta = SALES_META[target];
      if (!meta) return;
      // Flow rules
      const allowed = {
        SQ: ["SO"],
        SO: ["DN", "DPR", "DPI"],
        DPR: ["DPI"],
        DN: ["INV", "RET"],
        DPI: ["CM"],
        INV: ["CM", "RET"],
        RET: ["CM"],
        CM: []
      };
      if (allowed[src.docType] && !allowed[src.docType].includes(target)) {
        if (!confirm("Non-standard flow " + src.docType + " → " + target + ". Continue?")) return;
      }
      salesLines = (src.lines || []).map(l => ({ ...l }));
      salesEditId = null;
      salesCopyFromId = src.id;
      const pageMap = { SQ:"sq", SO:"so", DN:"dn", RET:"ret", DPR:"dpr", DPI:"dpi", INV:"inv", CM:"cm" };
      nav(pageMap[target] || "sq");
      setTimeout(() => {
        const form = document.getElementById("sales-form");
        if (!form) return toast("Open target document screen first");
        form.style.display = "block";
        const winId = openAppWindow((meta.title||target) + " — from " + src.docNo, "", { w: 980, h: 560 });
        const body = document.querySelector("#" + winId + " .win-body");
        if (body) { body.innerHTML = ""; body.appendChild(form); form.style.display = "block"; }
        const set = (id, val) => { const el = document.getElementById(id); if (el && val!=null) el.value = val; };
        set("s-bp", src.bpCode);
        if (typeof onSalesCustomerChange === "function") onSalesCustomerChange();
        set("s-branch", src.branchCode||"");
        set("s-wh", src.warehouseCode||"");
        set("s-remarks", "Base: " + src.docNo + (src.remarks ? " — " + src.remarks : ""));
        const dt = document.getElementById("s-date"); if (dt) dt.valueAsDate = new Date();
        renderSalesLines();
        recalcSalesTotal();
        toast("Draft from " + src.docNo + " — Post to close base document", true);
      }, 200);
    }

            isActive: true, createdAt: new Date().toISOString()
          };

          let fullName = g("fullName");
          const employeeCode = g("employeeCode");

          return {

          };
        },
        exists(data) { return employees.some(e => e.companyId===data.companyId && e.employeeCode===data.employeeCode); },

      },
      partners: {

          { key: "name", labels: ["name","CardName","Name","BP Name"] },

    function downloadDocTemplate(kind) {
      let headers = [], sample = [], sheet = "Template";
      if (kind.startsWith("sales_")) {
        headers = ["docGroup","docDate","bpCode","warehouseCode","branchCode","itemCode","name","qty","uom","price","discPct","remarks"];
        sample = ["1", new Date().toISOString().slice(0,10), "C00001", "WH01", "HQ", "ITM001", "Sample item", "10", "pcs", "1000", "0", "Import sample"];
        sheet = kind;
      } else if (kind === "stock_IO") {
        headers = ["docGroup","docDate","docType","warehouseCode","itemCode","name","qty","uom","remarks"];
        sample = ["1", new Date().toISOString().slice(0,10), "IN", "WH01", "ITM001", "Sample", "5", "pcs", ""];
      } else if (kind === "stock_TR") {
        headers = ["docGroup","docDate","fromWh","toWh","itemCode","name","qty","uom","remarks"];
        sample = ["1", new Date().toISOString().slice(0,10), "WH01", "WH02", "ITM001", "Sample", "5", "pcs", ""];
      } else if (kind === "stock_OB") {
        headers = ["docGroup","docDate","warehouseCode","itemCode","name","qty","uom","unitCost","remarks"];
        sample = ["1", new Date().toISOString().slice(0,10), "WH01", "ITM001", "Sample", "100", "pcs", "500", "Opening"];
      } else if (kind === "payments") {
        headers = ["docDate","bpCode","amount","method","reference","invoiceNo"];
        sample = [new Date().toISOString().slice(0,10), "C00001", "100000", "Cash", "RCP1", ""];
      } else if (kind === "pricelists") {
        headers = ["listName","itemCode","price","currencyCode"];
        sample = ["Base", "ITM001", "1500", "TZS"];
      } else if (kind === "warehouses") {
        headers = ["code","name","branchCode"];
        sample = ["WH01", "Main Warehouse", "HQ"];
      } else {
        toast("No template for " + kind);
        return;
      }
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([headers, sample]), sheet);
      XLSX.writeFile(wb, "KESHASHA_Template_" + kind + ".xlsx");
      toast("Template downloaded", true);
    }

    async function openImportMapper(kind, input) {
      try {
        const file = input.files && input.files[0];
        if (!file) return;
        let schema = IMPORT_SCHEMAS[kind];
        if (!schema && kind.startsWith("sales_")) {
          schema = buildSalesImportSchema(kind.replace("sales_", ""));
        }
        if (!schema && kind.startsWith("stock_")) {
          schema = buildStockImportSchema(kind.replace("stock_", ""));
        }
        if (!schema) {
          toast("Import not configured for: " + kind);
          input.value = "";
          return;
        }
        const cid = activeCompanyId || companyFilterId();
        if (!cid) {
          toast("Select company at login first");
          input.value = "";
          return;
        }
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        if (!rows.length) {
          toast("Excel has no data rows");
          input.value = "";
          return;
        }
        const headers = Object.keys(rows[0]);
        // auto-map
        const map = {};
        schema.fields.forEach(f => {
          const found = headers.find(h => f.labels.some(l => String(h).toLowerCase() === String(l).toLowerCase()));
          map[f.key] = found || "";
        });
        const stateKind = kind.startsWith("sales_") ? "sales_doc" : (kind.startsWith("stock_") ? "stock_doc" : kind);
        __importState = { kind: stateKind, rawKind: kind, schema, rows, headers, map, cid };
        const body = `
          <div style="padding:8px">
            <p style="margin:0 0 8px;font-size:13px"><b>${rows.length}</b> rows · Company session active · Map columns then Import</p>
            <div style="display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:12px">
              ${schema.fields.map(f => `
                <label style="font-weight:600;align-self:center">${esc(f.key)}${schema.required.includes(f.key)?" *":""}</label>
                <select data-field="${f.key}" class="imp-map" style="padding:4px;margin:0">
                  <option value="">— skip —</option>
                  ${headers.map(h => `<option value="${esc(h)}" ${map[f.key]===h?"selected":""}>${esc(h)}</option>`).join("")}
                </select>`).join("")}
            </div>
            <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
              <button class="btn btn-sm btn-primary" id="imp-run-btn" onclick="runImportMapper()">Import</button>
              <button class="btn btn-sm" onclick="closeImportMapperUi()">Cancel</button>
            </div>
          </div>`;
        if (typeof openAppWindow === "function") {

    async function importSalesDocumentRows(docType, rows, map, cid) {
      const g = (row, k) => { const col = map[k]; return col ? String(row[col]??"").trim() : ""; };
      const groups = {};
      showProgress(5, "Grouping sales rows…");
      rows.forEach((row, idx) => {
        const key = g(row, "docGroup") || (g(row, "bpCode") + "|" + g(row, "docDate") + "|g" + idx);
        if (!groups[key]) groups[key] = [];
        groups[key].push(row);
      });
      let added = 0, skipped = 0;
      const keys = Object.keys(groups);
      for (let gi = 0; gi < keys.length; gi++) {
        const key = keys[gi];
        showProgress(10 + Math.round((gi / Math.max(keys.length,1)) * 85), "Posting sales " + (gi+1) + "/" + keys.length);
        const gRows = groups[key];
        const first = gRows[0];
        const bpCode = g(first, "bpCode");
        if (!bpCode) { skipped += gRows.length; continue; }
        const docDate = g(first, "docDate") || new Date().toISOString().slice(0,10);
        const warehouseCode = g(first, "warehouseCode") || null;
        const branchCode = g(first, "branchCode") || null;
        const remarks = g(first, "remarks") || null;
        const bp = partners.find(p => p.companyId === cid && p.bpCode === bpCode);
        const lines = [];
        gRows.forEach(row => {
          const itemCode = g(row, "itemCode");
          const qty = parseFloat(g(row, "qty"));
          if (!itemCode || !(qty > 0)) { skipped++; return; }
          const price = parseFloat(g(row, "price")) || 0;
          const discPct = parseFloat(g(row, "discPct")) || 0;
          const name = g(row, "name") || (items.find(it => it.itemCode === itemCode) || {}).name || itemCode;
          const uom = g(row, "uom") || "pcs";
          const line = { lineNum: lines.length + 1, lineType: "I", itemCode, name, qty, uom, price, priceBefDi: price, discPct, vatPrcnt: 0 };
          if (typeof syncLinePrices === "function") syncLinePrices(line);
          line.lineTotal = typeof lineTotal === "function" ? lineTotal(line) : (qty * price * (1 - discPct/100));
          lines.push(line);
        });
        if (!lines.length) continue;
        const grandTotal = lines.reduce((s, l) => s + (parseFloat(l.lineTotal) || 0), 0);
        const docNo = await nextSalesDocNo(cid, docType);
        const data = {
          companyId: cid, docType, docNo, docDate, bpCode, bpName: bp ? bp.name : "",
          warehouseCode, branchCode, remarks, slpCode, owner, lines, grandTotal, status: "open", paidAmount: 0,
          createdBy: currentUser.email, createdAt: new Date().toISOString()
        };
        const ref = await db.collection("sales_docs").add(data);
        salesDocs.unshift({ id: ref.id, ...data });
        added++;
      }
      return { added, skipped };
    }

    async function importStockDocumentRows(kind, rows, map, cid) {
      const g = (row, k) => { const col = map[k]; return col ? String(row[col]??"").trim() : ""; };
      const groups = {};
      showProgress(5, "Grouping stock rows…");
      rows.forEach((row, idx) => {
        const key = g(row, "docGroup") || ("row" + idx);
        if (!groups[key]) groups[key] = [];
        groups[key].push(row);
      });
      let added = 0, skipped = 0;
      for (const key of Object.keys(groups)) {
        const gRows = groups[key];
        const first = gRows[0];
        const docDate = g(first, "docDate") || new Date().toISOString().slice(0,10);
        const remarks = g(first, "remarks") || null;
        let docType, warehouseCode, fromWh, toWh;
        if (kind === "TR") {
          docType = "TR"; fromWh = g(first, "fromWh"); toWh = g(first, "toWh");
          warehouseCode = fromWh;
          if (!fromWh || !toWh) { skipped += gRows.length; continue; }
        } else if (kind === "OB") {
          docType = "OB"; warehouseCode = g(first, "warehouseCode");
          if (!warehouseCode) { skipped += gRows.length; continue; }
        } else {
          docType = (g(first, "docType") || "IN").toUpperCase();
          if (docType !== "OUT") docType = "IN";
          warehouseCode = g(first, "warehouseCode");
          if (!warehouseCode) { skipped += gRows.length; continue; }
        }
        const lines = [];
        gRows.forEach(row => {
          const itemCode = g(row, "itemCode");
          const qty = parseFloat(g(row, "qty"));
          if (!itemCode || !(qty > 0)) { skipped++; return; }
          lines.push({
            lineNum: lines.length + 1, itemCode,
            name: g(row, "name") || (items.find(i => i.itemCode === itemCode) || {}).name || "",
            qty, uom: g(row, "uom") || "pcs",
            unitCost: parseFloat(g(row, "unitCost")) || 0
          });
        });
        if (!lines.length) continue;
        const seriesType = docType === "TR" ? "TR" : (docType === "OB" ? "OB" : docType);
        const docNo = await nextStockDocNo(cid, seriesType);
        const data = {
          companyId: cid, docNo, docType, docDate, warehouseCode,
          fromWh: fromWh || null, toWh: toWh || null,
          remarks, lines, status: "posted", createdBy: currentUser.email, createdAt: new Date().toISOString()
        };
        const ref = await db.collection("stock_docs").add(data);
        stockDocs.unshift({ id: ref.id, ...data });
        added++;
      }
      return { added, skipped };
    }

    async function runImportMapper() {
      if (__busy) return toast("Another operation is running");
      if (!__importState) return toast("No import loaded");
      __busy = true;
      showProgress(0, "Starting import…");
      const btn = document.getElementById("imp-run-btn");
      if (btn) { btn.disabled = true; btn.textContent = "Importing…"; }
      const { schema, rows, cid, kind } = __importState;
      const total = rows.length || 1;
      const map = {};
      document.querySelectorAll("select.imp-map").forEach(s => {
        map[s.dataset.field] = s.value || "";
      });
      for (const r of schema.required) {
        if (!map[r]) return toast("Map required field: " + r);
      }
      let added = 0, skipped = 0;
      try {
        // Document imports (per-type)
        if (kind === "sales_doc" && schema.docType) {
          const res = await importSalesDocumentRows(schema.docType, rows, map, cid);
          toast("Sales imported: " + res.added + " docs · skipped lines: " + res.skipped, true);
          __importState = null;
          if (schema.refresh) schema.refresh();
          Object.keys(openWins || {}).forEach(id => { try { closeWin(id); } catch(_){} });
          return;
        }
        if (kind === "stock_doc" && schema.stockKind) {
          const res = await importStockDocumentRows(schema.stockKind, rows, map, cid);
          toast("Stock imported: " + res.added + " docs · skipped: " + res.skipped, true);
          __importState = null;
          if (schema.refresh) schema.refresh();
          Object.keys(openWins || {}).forEach(id => { try { closeWin(id); } catch(_){} });
          return;
        }
        // Special: stock lines → group into stock_docs
        if (kind === "stock") {
          const groups = {};
          for (const row of rows) {
            const line = schema.build(row, map, cid);
            if (!line) { skipped++; continue; }
            const key = [line.docType, line.docDate, line.warehouseCode].join("|");
            if (!groups[key]) groups[key] = { header: line, lines: [] };
            groups[key].lines.push({
              lineNum: groups[key].lines.length + 1,
              itemCode: line.itemCode, name: line.name, qty: line.qty, uom: line.uom
            });
          }
          for (const key of Object.keys(groups)) {
            const g = groups[key];
            const docNo = await nextStockDocNo(cid, g.header.docType);
            const data = {
              companyId: cid, docNo, docType: g.header.docType, docDate: g.header.docDate,
              warehouseCode: g.header.warehouseCode, remarks: g.header.remarks,
              lines: g.lines, status: "posted",
              createdBy: currentUser.email, createdAt: new Date().toISOString()
            };
            const ref = await db.collection("stock_docs").add(data);
            stockDocs.unshift({ id: ref.id, ...data });
            added++;
          }
          toast("Stock docs imported: " + added + " · Skipped lines: " + skipped, true);
          __importState = null;
          if (schema.refresh) schema.refresh();
          Object.keys(openWins || {}).forEach(id => { try { closeWin(id); } catch(_){} });
          return;
        }
        // Special: sales lines → one document per (docType, date, bpCode)
        if (kind === "sales") {
          const groups = {};
          for (const row of rows) {
            const line = schema.build(row, map, cid);
            if (!line) { skipped++; continue; }
            const key = [line.docType, line.docDate, line.bpCode].join("|");
            if (!groups[key]) groups[key] = { header: line, lines: [] };
            groups[key].lines.push({
              lineNum: groups[key].lines.length + 1,
              lineType: "I", itemCode: line.itemCode, name: line.name,
              qty: line.qty, uom: line.uom, price: line.price, discPct: line.discPct,
              lineTotal: line.lineTotal, priceBefDi: line.price
            });
          }
          for (const key of Object.keys(groups)) {
            const g = groups[key];
            const bp = partners.find(p => p.companyId === cid && p.bpCode === g.header.bpCode);
            const grandTotal = g.lines.reduce((s, l) => s + (parseFloat(l.lineTotal)||0), 0);
            const docNo = await nextSalesDocNo(cid, g.header.docType);
            const data = {
              companyId: cid, docType: g.header.docType, docNo,
              docDate: g.header.docDate, bpCode: g.header.bpCode,
              bpName: bp ? bp.name : "", warehouseCode: g.header.warehouseCode,
              lines: g.lines, grandTotal, status: "open", paidAmount: 0,
              createdBy: currentUser.email, createdAt: new Date().toISOString()
            };
            const ref = await db.collection("sales_docs").add(data);
            salesDocs.unshift({ id: ref.id, ...data });
            added++;
          }
          toast("Sales docs imported: " + added + " · Skipped lines: " + skipped, true);
          __importState = null;
          if (schema.refresh) schema.refresh();
          Object.keys(openWins || {}).forEach(id => { try { closeWin(id); } catch(_){} });
          return;
        }
        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          showProgress(Math.round((i / total) * 100), "Importing " + (i+1) + " / " + total);
          const data = schema.build(row, map, cid);
          if (!data) { skipped++; continue; }
          if (schema.exists(data)) { skipped++; continue; }
          const ref = await db.collection(schema.collection).add(data);
          if (schema.collection === "items") items.push({ id: ref.id, ...data });
          else if (schema.collection === "employees") employees.push({ id: ref.id, ...data });
          else if (schema.collection === "partners") partners.push({ id: ref.id, ...data });
          else if (schema.collection === "branches") branches.push({ id: ref.id, ...data });
          else if (schema.collection === "dimensions") dimensions.push({ id: ref.id, ...data });
          else if (schema.collection === "accounts") accounts.push({ id: ref.id, ...data });
          else if (schema.collection === "warehouses") warehouses.push({ id: ref.id, ...data });
          else if (schema.collection === "price_lists") priceLists.push({ id: ref.id, ...data });
          else if (schema.collection === "users") users.push({ id: ref.id, ...data });
          else if (schema.collection === "currencies") currencies.push({ id: ref.id, ...data });
          else if (schema.collection === "partner_groups") partnerGroups.push({ id: ref.id, ...data });
          added++;
        }
        showProgress(100, "Done");
        toast("Imported " + added + " · Skipped " + skipped, true);
        __importState = null;
        if (schema.refresh) schema.refresh();
        Object.keys(openWins || {}).forEach(id => { try { closeWin(id); } catch(_){} });
      } catch (e) {
        console.error(e);
        toast("Import error: " + e.message);
      } finally {
        __busy = false;
        hideProgress();
      }
    }

    function onPayTypeChange() {

      if (!sel) return;
      const cid = companyFilterId();
      let opts = `<option value="">—</option>`;

        opts += partners.filter(p => p.companyId === cid && (p.bpType === "C" || !p.bpType)).map(p => `<option value="${esc(p.bpCode)}">${esc(p.bpCode)} — ${esc(p.name)}</option>`).join("");

      } else {
        opts += scoped(accounts, cid).filter(a => a.postable !== false).map(a => `<option value="${esc(a.acctCode)}">${esc(a.acctCode)} — ${esc(a.acctName)}</option>`).join("");
      }
      sel.innerHTML = opts;
      sel.onchange = () => {
        const code = sel.value;
        const nameEl = document.getElementById("pay-name");
        if (!nameEl) return;
        if (type === "A") {
          const a = accounts.find(x => x.acctCode === code && x.companyId === cid);
          nameEl.value = a ? a.acctName : "";
        } else {
          const p = partners.find(x => x.bpCode === code && x.companyId === cid);
          nameEl.value = p ? p.name : "";
        }
      };
    }

    async function postPayment() {
      const companyId = activeCompanyId || (currentUser.isSuperAdmin ? document.getElementById("pay-co").value : currentUser.companyId);
      const docType = document.getElementById("pay-type").value;
      const cardCode = document.getElementById("pay-bp").value;
      const cardName = document.getElementById("pay-name").value;
      const docDate = document.getElementById("pay-date").value;
      const cashSum = parseFloat(document.getElementById("pay-cashsum").value) || 0;
      const checkSum = parseFloat(document.getElementById("pay-checksum").value) || 0;
      const trsfrSum = parseFloat(document.getElementById("pay-trsfrsum").value) || 0;
      const docTotal = cashSum + checkSum + trsfrSum;
      if (!companyId || !cardCode || !docDate || !(docTotal > 0)) return toast("Code, date and amount required");
      const docNo = await nextSalesDocNo(companyId, "RC");
      const comments = document.getElementById("pay-remarks").value.trim() || null;
      const isDeposit = document.getElementById("pay-deposit") && document.getElementById("pay-deposit").checked;
      const jrnlMemo = document.getElementById("pay-jrnlmemo").value.trim() || null;
      const branchCode = document.getElementById("pay-branch").value || null;
      // applied invoices
      const applied = [];
      document.querySelectorAll(".pay-applied").forEach(inp => {
        const amt = parseFloat(inp.value) || 0;
        if (amt > 0) applied.push({ docNo: inp.dataset.docno, sumApplied: amt });
      });
      const data = {
        companyId, docNo, docType, cardCode, cardName, bpCode: cardCode,
        docDate, taxDate: docDate, cashSum, checkSum, trsfrSum, docTotal, amount: docTotal,
        comments, jrnlMemo, branchCode, applied, isDeposit: !!isDeposit, status: "posted",
        cashAcct: document.getElementById("pay-cashacct").value || null,
        checkAcct: document.getElementById("pay-checkacct").value || null,
        trsfrAcct: document.getElementById("pay-trsfracct").value || null,
        trsfrDate: document.getElementById("pay-trsfrdate").value || null,
        trsfrRef: document.getElementById("pay-trsfrref").value || null,
        createdBy: currentUser.email, createdAt: new Date().toISOString()
      };
      // GL
      const cashAcct = data.cashAcct || getMap(companyId, "CASH") || getMap(companyId, "BANK");
      const arAcct = getMap(companyId, "AR_CONTROL");
      if (cashAcct && arAcct && docType === "C") {
        try {
          const je = await postJournalEntry(companyId, {
            refDate: docDate, memo: "Payment " + docNo,
            lines: [
              { acctCode: cashAcct, debit: docTotal, credit: 0, lineMemo: "Receipt" },
              { acctCode: arAcct, debit: 0, credit: docTotal, lineMemo: "AR " + cardCode },
            ],
            sourceType: "RC", sourceDoc: docNo
          });
          data.journalNo = je.transId;
        } catch (ge) { toast("Payment saved but GL failed: " + ge.message); }
      }
      const ref = await db.collection("payments").add(data);
      payments.unshift({ id: ref.id, ...data });
      // Update invoices
      for (const app of applied) {
        const inv = salesDocs.find(d => d.companyId === companyId && d.docType === "INV" && d.docNo === app.docNo);
        if (inv) {
          const paid = (parseFloat(inv.paidAmount) || 0) + app.sumApplied;
          const total = parseFloat(inv.grandTotal) || 0;
          const fullyPaid = paid + 0.0001 >= total;
          const payload = { paidAmount: paid, status: fullyPaid ? "closed" : "open", paidAt: fullyPaid ? new Date().toISOString() : null };
          await db.collection("sales_docs").doc(inv.id).update(payload);
          Object.assign(inv, payload);
        }
      }
      toast("Posted " + docNo, true);
      renderPayments(document.getElementById("main"));
    }

          levels,
          isActive: true,
          createdAt: new Date().toISOString()
        };
        const ref = await db.collection("accounts").add(data);

    async function saveAccount() {
      const companyId = currentUser.isSuperAdmin ? document.getElementById("a-co").value : currentUser.companyId;
      const data = {
        companyId,
        acctCode: document.getElementById("a-code").value.trim(),
        acctName: document.getElementById("a-name").value.trim(),
        category: document.getElementById("a-cat").value,
        postable: document.getElementById("a-post").value,
        level: parseInt(document.getElementById("a-level").value,10)||1,
        fatherNum: document.getElementById("a-parent").value || null,
        currency: document.getElementById("a-cur").value.trim()||"TZS",
        externalCode: document.getElementById("a-ext").value.trim()||null,
        cashAccount: document.getElementById("a-cash").value,
        controlAccount: document.getElementById("a-ctrl").value,
        status: document.getElementById("a-status").value,
        isActive: true,
      };
      if (!companyId || !data.acctCode || !data.acctName) return toast("Code and Name are required");
      try {
        if (editingAcctId) {
          await db.collection("accounts").doc(editingAcctId).update({ ...data, updatedAt: new Date().toISOString() });
          const idx = accounts.findIndex(a=>a.id===editingAcctId);
          if (idx>=0) accounts[idx] = { ...accounts[idx], ...data };
          toast("Updated", true);
        } else {
          if (accounts.some(a=>a.companyId===companyId && a.acctCode===data.acctCode)) return toast("Account code exists");
          data.createdAt = new Date().toISOString();
          const ref = await db.collection("accounts").add(data);
          accounts.push({ id: ref.id, ...data });
          toast("Saved", true);
        }
        editingAcctId = null;
        renderCOA(document.getElementById("main"));
      } catch(e) { toast(e.message); }
    }

    async function deleteAccount(id) {
      if (!canDelete() && !currentUser.isSuperAdmin) return toast("Not authorized to delete");
      const a = accounts.find(x => x.id === id); if (!a) return;
      if (!confirm("Delete account " + a.acctCode + "?")) return;
      await db.collection("accounts").doc(id).delete();
      accounts = accounts.filter(x => x.id !== id);
      toast("Deleted", true);
      renderCOA(document.getElementById("main"));
    }
    async function deleteSelectedAccounts() {
      if (!canDelete()) return toast("Not authorized to delete");
      const ids = [...document.querySelectorAll(".acct-check:checked")].map(c=>c.dataset.id);
      if (!ids.length) return toast("Select rows first");
      if (!confirm("Delete " + ids.length + " account(s)?")) return;
      for (const id of ids) {
        await db.collection("accounts").doc(id).delete();
        accounts = accounts.filter(a=>a.id!==id);
      }
      toast("Deleted " + ids.length, true);
      renderCOA(document.getElementById("main"));
    }

    function getRate(currency, date) {
      const cid = companyFilterId();
      const list = scoped(exchangeRates, cid).filter(r => r.currency === currency);
      if (!list.length) return null;
      const onDate = list.filter(r => r.rateDate <= (date || "9999"));
      const best = (onDate.length ? onDate : list).sort((a,b)=>(b.rateDate||"").localeCompare(a.rateDate||""))[0];
      return best ? parseFloat(best.rate) : null;
    }
    function promptRate(currency, date) {

      if (existing) return existing;
      const input = prompt("Enter rate for 1 " + currency + " in local currency:", "1");

      return rate > 0 ? rate : 1;
    }

    async function postJournalEntry(companyId, { refDate, memo, lines, sourceType, sourceDoc }) {
      const balanced = Math.abs(
        lines.reduce((s,l)=>s+(parseFloat(l.debit)||0),0) -
        lines.reduce((s,l)=>s+(parseFloat(l.credit)||0),0)
      ) < 0.01;
      if (!balanced) throw new Error("Journal not balanced");
      const postableLines = lines.filter(l => l.acctCode && ((parseFloat(l.debit)||0) > 0 || (parseFloat(l.credit)||0) > 0));
      for (const l of postableLines) {
        const acct = accounts.find(a => a.companyId === companyId && a.acctCode === l.acctCode);
        if (!acct) throw new Error("Account not found: " + l.acctCode);
        if (acct.postable === "Title") throw new Error("Cannot post to title account: " + l.acctCode);
      }
      const transId = await nextJournalNo(companyId);
      const data = {
        companyId, transId, refDate, memo: memo||null, lines: postableLines,
        sourceType: sourceType||"Manual", sourceDoc: sourceDoc||null,
        status: "posted", createdBy: currentUser.email, createdAt: new Date().toISOString(),
        locTotal: postableLines.reduce((s,l)=>s+(parseFloat(l.debit)||0),0),
      };
      const ref = await db.collection("journals").add(data);
      journals.unshift({ id: ref.id, ...data });
      return data;
    }

    async function saveItemSeriesDef() {

    async function seedDefaultItemSeries() {
      const cid = companyFilterId() || (companies[0]&&companies[0].id);
      if (!cid) return toast("Company required");
      const seeds = [["FG","Finished Goods","FG"],["RM","Raw Materials","RM"],["ITM","General Items","ITM"]];
      let n=0;
      for (const [code,name,prefix] of seeds) {
        if (itemSeriesDefs.some(d=>d.companyId===cid && d.code===code)) continue;
        const data = { companyId: cid, code, name, prefix, padLength: 5, isActive: true };
        const ref = await db.collection("item_series").add(data);
        itemSeriesDefs.push({ id: ref.id, ...data });
        n++;
      }
      toast("Added " + n, true);
      renderItemSeriesDefs(document.getElementById("main"));
    }

    // ---- Authorizations (SAP-style: Full / Read Only / None) ----
    // Levels: 0 = No Authorization, 1 = Read Only, 2 = Full Authorization
    const AUTH_SUBJECTS = [
      { mod: "Administration", items: [
        ["admin.companies","Companies"],["admin.branches","Branches"],["admin.users","Users"],
        ["admin.employees","Employees"],["admin.docseries","Document Numbering"],["admin.itemseries","Item Series"],
        ["admin.authz","Authorizations"],["admin.dimensions","Dimensions"],["admin.uitemplate","UI Templates"],
      ]},
      { mod: "Business Partners", items: [
        ["bp.master","BP Master Data"],["bp.groups","BP Groups"],["bp.recon","Reconciliation"],
      ]},
      { mod: "Inventory", items: [
        ["inv.items","Item Master"],["inv.warehouses","Warehouses"],["inv.pricelists","Price Lists"],
        ["inv.stock","Goods Receipt / Issue"],["inv.transfer","Inventory Transfer"],["inv.opening","Opening Balance"],
        ["inv.balance","Stock Balance"],["inv.reports","Inventory Reports"],
      ]},
      { mod: "Sales A/R", items: [
        ["ar.sq","Sales Quotation"],["ar.so","Sales Order"],["ar.dn","Delivery"],["ar.ret","Return"],
        ["ar.inv","A/R Invoice"],["ar.cm","A/R Credit Memo"],["ar.pay","Incoming Payment"],["ar.reports","Sales Reports"],
      ]},
      { mod: "Financials", items: [
        ["fin.coa","Chart of Accounts"],["fin.je","Journal Entry"],["fin.map","Account Determination"],
        ["fin.tb","Trial Balance"],["fin.currencies","Currencies"],
      ]},
      { mod: "Document Actions", items: [
        ["act.delete","Delete master data"],["act.cancel","Cancel documents"],["act.close","Close documents"],
      ]},
    ];
    let authSelectedUserId = null;

    function authLevelLabel(n) {
      if (n === 2 || n === "2") return "Full Authorization";
      if (n === 1 || n === "1") return "Read Only";
      return "No Authorization";
    }
    function getUserAuthMap(u) {
      return (u && u.authMap) ? u.authMap : {};
    }
    function subjectAuth(u, key) {
      if (!u) return 0;
      if (u.isSuperAdmin) return 2;
      const m = getUserAuthMap(u);
      const v = m[key];
      return v === undefined || v === null ? 0 : parseInt(v, 10) || 0;
    }
    /** required: 1=read, 2=full */
    function hasAuth(key, required) {
      if (!currentUser) return false;
      if (currentUser.isSuperAdmin) return true;
      return subjectAuth(currentUser, key) >= (required || 1);
    }
    function pageAuthKey(page) {
      const map = {
        companies:"admin.companies", branches:"admin.branches", users:"admin.users", employees:"admin.employees", salesemp:"admin.employees",
        docseries:"admin.docseries", itemseries:"admin.itemseries", authz:"admin.authz", dimensions:"admin.dimensions", dimtypes:"admin.dimensions",
        uitemplate:"admin.uitemplate",
        partners:"bp.master", bpgroups:"bp.groups", bprecon:"bp.recon",
        items:"inv.items", warehouses:"inv.warehouses", pricelists:"inv.pricelists", stock:"inv.stock",
        transfer:"inv.transfer", opening:"inv.opening", stockbal:"inv.balance", invreports:"inv.reports",
        sq:"ar.sq", so:"ar.so", dn:"ar.dn", ret:"ar.ret", inv:"ar.inv", cm:"ar.cm", pay:"ar.pay", salesrep:"ar.reports",
        coa:"fin.coa", je:"fin.je", acctmap:"fin.map", tb:"fin.tb", currencies:"fin.currencies",
        sysinfo:"admin.companies",
      };
      return map[page] || null;
    }
    function canDelete() {
      return hasAuth("act.delete", 2) || !!(currentUser && currentUser.isSuperAdmin);
    }
    function canCancel() {
      return hasAuth("act.cancel", 2) || !!(currentUser && currentUser.isSuperAdmin);
    }
    function canClose() {
      return hasAuth("act.close", 2) || !!(currentUser && currentUser.isSuperAdmin);
    }

    function renderAuthorizations(el) {
      if (!currentUser.isSuperAdmin && !hasAuth("admin.authz", 2)) {
        el.innerHTML = `<div class="toolbar"><h2>Authorizations</h2></div><p style="padding:12px">No Authorization</p>`;
        return;
      }
      const list = users.filter(u => !u.isSuperAdmin && u.companyId === activeCompanyId);
      if (!authSelectedUserId && list.length) authSelectedUserId = list[0].id;
      const sel = users.find(u => u.id === authSelectedUserId);
      el.innerHTML = `
        <div class="toolbar">
          <h2>Authorizations</h2>
          <button class="btn btn-sm" onclick="setAllAuthForUser(2)">Full Authorization (all)</button>
          <button class="btn btn-sm" onclick="setAllAuthForUser(1)">Read Only (all)</button>
          <button class="btn btn-sm" onclick="setAllAuthForUser(0)">No Authorization (all)</button>
        </div>
        <div style="display:flex;gap:0;border:1px solid var(--border);background:#fff;min-height:420px">
          <div style="width:200px;border-right:1px solid var(--border);overflow:auto;background:#f8fafc">
            <div style="padding:8px;font-weight:700;border-bottom:1px solid var(--border)">Users</div>
            ${list.map(u => `<div onclick="authSelectedUserId='${u.id}';renderAuthorizations(document.getElementById('main'))"
              style="padding:8px 10px;cursor:pointer;border-bottom:1px solid #e5e7eb;${u.id===authSelectedUserId?'background:#dbeafe;font-weight:600':''}">
              ${esc(u.fullName)}<div style="font-size:11px;color:#667085">${esc(u.email)}</div>
            </div>`).join("") || `<div style="padding:10px">No users</div>`}
          </div>
          <div style="flex:1;overflow:auto">
            ${!sel ? `<div style="padding:16px">Select a user</div>` : `
            <div style="padding:8px 12px;border-bottom:1px solid var(--border);background:#e8eef7;font-weight:600">
              ${esc(sel.fullName)} — ${esc(sel.email)}
            </div>
            <table class="grid" style="border:0">
              <thead><tr><th>Subject</th><th style="width:180px">Authorization</th><th style="width:160px">Effective</th></tr></thead>
              <tbody>
                ${AUTH_SUBJECTS.map(mod => {
                  let rows = `<tr style="background:#f1f5f9"><td colspan="3"><b>▶ ${esc(mod.mod)}</b>
                    <select onchange="setModuleAuth('${sel.id}','${mod.mod}',this.value)" style="margin-left:12px;padding:2px 6px">
                      <option value="">— Module —</option>
                      <option value="2">Full Authorization</option>
                      <option value="1">Various / Read Only</option>
                      <option value="0">No Authorization</option>
                    </select>
                  </td></tr>`;
                  mod.items.forEach(([key, label]) => {
                    const lv = subjectAuth(sel, key);
                    rows += `<tr>
                      <td style="padding-left:24px">${esc(label)}</td>
                      <td>
                        <select onchange="setSubjectAuth('${sel.id}','${key}',this.value)" style="width:100%;margin:0;padding:4px;border:1px solid var(--border)">
                          <option value="0" ${lv===0?"selected":""}>No Authorization</option>
                          <option value="1" ${lv===1?"selected":""}>Read Only</option>
                          <option value="2" ${lv===2?"selected":""}>Full Authorization</option>
                        </select>
                      </td>
                      <td>${authLevelLabel(lv)}</td>
                    </tr>`;
                  });
                  return rows;
                }).join("")}
              </tbody>
            </table>`}
          </div>
        </div>`;
    }
    async function setSubjectAuth(userId, key, val) {
      const u = users.find(x => x.id === userId);
      if (!u) return;
      const authMap = { ...(u.authMap || {}) };
      authMap[key] = parseInt(val, 10) || 0;
      // derive action flags
      const canDelete = (authMap["act.delete"] || 0) >= 2;
      const canCancel = (authMap["act.cancel"] || 0) >= 2;
      const canClose = (authMap["act.close"] || 0) >= 2;
      await db.collection("users").doc(userId).update({ authMap, canDelete, canCancel, canClose });
      u.authMap = authMap;
      u.canDelete = canDelete;
      u.canCancel = canCancel;
      u.canClose = canClose;
      toast("Updated", true);
      renderAuthorizations(document.getElementById("main"));
    }
    async function setModuleAuth(userId, modName, val) {
      if (val === "") return;
      const mod = AUTH_SUBJECTS.find(m => m.mod === modName);
      if (!mod) return;
      const u = users.find(x => x.id === userId);
      if (!u) return;
      const authMap = { ...(u.authMap || {}) };
      const level = parseInt(val, 10) || 0;
      mod.items.forEach(([key]) => { authMap[key] = level; });
      const canDelete = (authMap["act.delete"] || 0) >= 2;
      const canCancel = (authMap["act.cancel"] || 0) >= 2;
      const canClose = (authMap["act.close"] || 0) >= 2;
      await db.collection("users").doc(userId).update({ authMap, canDelete, canCancel, canClose });
      u.authMap = authMap;
      u.canDelete = canDelete; u.canCancel = canCancel; u.canClose = canClose;
      toast(modName + " → " + authLevelLabel(level), true);
      renderAuthorizations(document.getElementById("main"));
    }
    async function setAllAuthForUser(level) {
      if (!authSelectedUserId) return;
      const u = users.find(x => x.id === authSelectedUserId);
      if (!u) return;
      const authMap = {};
      AUTH_SUBJECTS.forEach(mod => mod.items.forEach(([key]) => { authMap[key] = level; }));
      const canDelete = level >= 2;
      await db.collection("users").doc(u.id).update({
        authMap, canDelete: canDelete, canCancel: canDelete, canClose: canDelete
      });
      u.authMap = authMap;
      u.canDelete = canDelete; u.canCancel = canDelete; u.canClose = canDelete;
      toast(authLevelLabel(level) + " applied", true);
      renderAuthorizations(document.getElementById("main"));
    }


    // ---- System Information (tables / fields) ----

    function renderUiTemplates(el) {

    async function saveUiTemplate() {
      if (window.__keshashaReadOnly) return toast("Read Only");
      if (!hasAuth("admin.uitemplate", 2) && !currentUser.isSuperAdmin) return toast("No Authorization");
