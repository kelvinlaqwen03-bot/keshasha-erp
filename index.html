    function onSalesCurrencyChange() { onDocCurrencyChange("s"); }
    // ---- Document currency helpers ----
    function docCurrencyOptions(cid) {
      let list = scoped(currencies, cid).filter(c => c.isActive !== false);
      if (!list.length) list = [{ code: "TZS", name: "Tanzanian Shilling" }, { code: "USD", name: "US Dollar" }, { code: "EUR", name: "Euro" }];
      const def = defaultCurrencyCode();
      return list.map(c => `<option value="${esc(c.code)}" ${c.code===def?"selected":""}>${esc(c.code)}${c.name?" — "+esc(c.name):""}</option>`).join("");
    }
    /** Read currency + rate of a document form (prefix "s" or "p"). Local currency => rate 1. */
    function docCurrencyInfo(prefix) {
      const local = defaultCurrencyCode();
      const curEl = document.getElementById(prefix + "-currency");
      const rateEl = document.getElementById(prefix + "-rate");
      const cur = (curEl && curEl.value) || local;
      let rate = parseFloat(rateEl && rateEl.value) || 1;
      if (cur === local) rate = 1;
      return { cur, rate, local, isForeign: cur !== local };
    }
    /** Called when the document currency changes: fills the rate from Exchange Rates (asks if missing). */
    function onDocCurrencyChange(prefix) {
      const info = docCurrencyInfo(prefix);
      const rateEl = document.getElementById(prefix + "-rate");
      if (rateEl) {
        if (!info.isForeign) { rateEl.value = 1; rateEl.readOnly = true; rateEl.style.background = "#f3f3f3"; }
        else {
          const dEl = document.getElementById(prefix + "-date");
          rateEl.value = promptRate(info.cur, dEl && dEl.value);
          rateEl.readOnly = false; rateEl.style.background = "";
        }
      }
      docRecalc(prefix);
    }
    function docRecalc(prefix) {
      if (prefix === "s") recalcSalesTotal(); else if (prefix === "p") renderPurchaseLines(); else recalcPay(prefix);
    }
    /** Update rate when the posting date changes (only when a stored rate exists) */
    function onDocDateRate(prefix) {
      const info = docCurrencyInfo(prefix);
      if (!info.isForeign) return;
      const dEl = document.getElementById(prefix + "-date");
      const r = getRate(info.cur, dEl && dEl.value);
      const rateEl = document.getElementById(prefix + "-rate");
      if (r && rateEl) { rateEl.value = r; docRecalc(prefix); }
    }
    /** Pick the business partner's currency on the document */
    function applyPartnerCurrency(prefix, partner) {
      const sel = document.getElementById(prefix + "-currency");
      if (!sel || !partner || !partner.currencyCode) return;
      if (sel.value === partner.currencyCode) return;
      if (!Array.from(sel.options).some(o => o.value === partner.currencyCode)) return;
      sel.value = partner.currencyCode;
      onDocCurrencyChange(prefix);
    }
    function setLocalTotal(prefix, total) {
      const info = docCurrencyInfo(prefix);
      const el = document.getElementById(prefix + "-total-lc");
      if (el) el.textContent = info.isForeign ? (total * info.rate).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) + " " + info.local : "—";
      const lab = document.getElementById(prefix + "-total-cur");
      if (lab) lab.textContent = info.cur;
    }
    /** Convert document-currency GL lines into local currency, keeping the entry balanced */
    function fxLines(lines, rate) {
      if (!rate || rate === 1) return lines;
      const out = lines.map(g => ({ ...g, debit: round2((g.debit||0) * rate), credit: round2((g.credit||0) * rate) }));
      const dr = out.reduce((a, g) => a + g.debit, 0), cr = out.reduce((a, g) => a + g.credit, 0);
      const diff = round2(dr - cr);
      if (diff !== 0) {
        const t = out.slice().reverse().find(g => g.credit > 0) || out[out.length - 1];
        if (diff > 0) t.credit = round2(t.credit + diff); else t.debit = round2(t.debit - diff);
      }
      return out;
    }
    // ---- VAT helpers ----
    function round2(n) { return Math.round(((parseFloat(n)||0) + Number.EPSILON) * 100) / 100; }
    function taxRateFor(companyId, code) {
      if (!code) return 0;
      const tc = taxCodes.find(t => t.companyId === companyId && t.code === code);
      if (!tc || (tc.taxType||"").toUpperCase() === "EXEMPT") return 0;
      return parseFloat(tc.rate) || 0;
    }
    /** Sum VAT per G/L account: tax code's own account, else Account Determination (mapKey) */
    function vatByAccount(companyId, lines, mapKey) {
      const out = {};
      (lines || []).forEach(l => {
        const amt = round2(l.vatSum);
        if (!(amt > 0)) return;
        const tc = taxCodes.find(t => t.companyId === companyId && t.code === l.taxCode);
        const acct = (tc && tc.acctCode) || getMap(companyId, mapKey) || "";
        out[acct] = round2((out[acct] || 0) + amt);
      });
      return out;
    }
    function salesCompanyId() {
      const el = document.getElementById("s-co");
      return (currentUser.isSuperAdmin && el && el.value) ? el.value : companyFilterId();
    }
    function onSalesTaxChange(idx, code) {
      const cid = salesCompanyId();
      const l = salesLines[idx];
      l.taxCode = code;
      l.vatPrcnt = taxRateFor(cid, code);
      syncLinePrices(l);
      renderSalesLines();
    }
    function recalcSalesTotal() {
      const cid = salesCompanyId();
      let before = 0, disc = 0, net = 0, tax = 0;
      salesLines.forEach(l => {
        // keep rate in sync with the selected tax code (unless user typed a rate and no code)
        if (l.taxCode) l.vatPrcnt = taxRateFor(cid, l.taxCode);
        syncLinePrices(l);
        const qty = effectiveQty(l);
        const unit = unitPriceBeforeDisc(l);
        before += qty * unit;
        disc += qty * unit * ((parseFloat(l.discPct)||0)/100);
        net += parseFloat(l.lineTotal) || 0;
        tax += parseFloat(l.vatSum) || 0;
      });
      const freight = parseFloat(document.getElementById("s-freight") && document.getElementById("s-freight").value) || 0;
      const fmt = n => Number(n||0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = fmt(v); };
      set("s-total-bef", before);
      set("s-total-disc", disc);
      set("s-total-tax", tax);
      set("s-total", round2(net) + round2(tax) + freight);
      setLocalTotal("s", round2(net) + round2(tax) + freight);
    }

    async function postSalesDoc(docType, mode) {
      mode = mode || 'view';
      if (!requireAuth(docAuthKey(docType), 2)) return;
      const companyId = currentUser.isSuperAdmin ? document.getElementById("s-co").value : currentUser.companyId;
      const bpCode = document.getElementById("s-bp").value;
      const docDate = document.getElementById("s-date").value;
      const dueDate = document.getElementById("s-due").value || null;
      const warehouseCode = document.getElementById("s-wh").value || null;
      const branchCode = (document.getElementById("s-branch") && document.getElementById("s-branch").value) || null;
      const remarks = document.getElementById("s-remarks").value.trim() || null;
      const slpCode = (document.getElementById("s-slp") && document.getElementById("s-slp").value) || null;
      const owner = (document.getElementById("s-owner") && document.getElementById("s-owner").value) || null;
      const meta = SALES_META[docType];
      if (!companyId) return toast("Company required");
      if (!bpCode) return toast("Customer is required");
      if (!docDate) return toast("Posting Date is required");
      if (!branchCode) return toast("Branch is required");
      if ((docType === "DN" || docType === "RET" || docType === "INV") && !warehouseCode && salesLines.some(l => (l.lineType||"I")==="I" && l.itemCode)) return toast("Warehouse is required for " + docType);
      salesLines.forEach(l => { if ((l.lineType||"I")==="S") { l.qty = 1; l.whsCode = ""; } });
      const bp = partners.find(p => p.companyId === companyId && p.bpCode === bpCode);
      const lines = salesLines.filter(l => (l.itemCode || l.name) && parseFloat(l.qty) > 0).map((l, i) => {
        if (l.taxCode) l.vatPrcnt = taxRateFor(companyId, l.taxCode);
        syncLinePrices(l);
        return {
          lineNum: i + 1,
          lineType: l.lineType || "I",
          itemCode: l.itemCode,
          name: l.name,
          qty: parseFloat(l.qty),
          numPerMsr: parseFloat(l.numPerMsr) || null,
          uom: l.uom || "pcs",
          priceBefDi: parseFloat(l.priceBefDi) || 0,
          price: parseFloat(l.price) || 0,
          discPct: parseFloat(l.discPct) || 0,
          lineTotal: round2(l.lineTotal),
          whsCode: l.whsCode || null,
          acctCode: l.acctCode || null,
          taxCode: l.taxCode || null,
          vatPrcnt: parseFloat(l.vatPrcnt) || 0,
          vatSum: round2(l.vatSum),
          gTotal: round2(l.lineTotal) + round2(l.vatSum),
          project: l.project || null,
        };
      });
      if (!lines.length) return toast("At least one line with item and qty is required");
      const netTotal = round2(lines.reduce((s, l) => s + l.lineTotal, 0));
      const taxTotal = round2(lines.reduce((s, l) => s + l.vatSum, 0));
      const freight = parseFloat(document.getElementById("s-freight") && document.getElementById("s-freight").value) || 0;
      const grandTotal = round2(netTotal + taxTotal + freight);
      const fxi = docCurrencyInfo("s");
      const docCurrency = fxi.cur, docRate = fxi.rate;
      const grandTotalLC = round2(grandTotal * docRate);
      let docNo;
      try { docNo = await nextSalesDocNo(companyId, docType); }
      catch (e) { return toast(e.message); }
      const baseDoc = salesCopyFromId ? salesDocs.find(x => x.id === salesCopyFromId) : null;
      const data = {
        companyId, docType, docNo, docDate, dueDate, bpCode,
        bpName: bp ? bp.name : "",
        warehouseCode, branchCode, remarks, slpCode, owner, lines, grandTotal, netTotal, taxTotal, freight, docCurrency, docRate, grandTotalLC,
        status: "open",
        paidAmount: 0,
        baseDocId: baseDoc ? baseDoc.id : null,
        baseDocType: baseDoc ? baseDoc.docType : null,
        baseDocNo: baseDoc ? baseDoc.docNo : null,
        createdBy: currentUser.email,
        createdAt: new Date().toISOString(),
      };
      try {
        // Stock effect for Delivery / Return
        if (meta.stock && warehouseCode && lines.some(l => l.lineType !== "S" && l.itemCode)) {
          const stockType = meta.stock; // OUT or IN
          const sDocNo = await nextStockDocNo(companyId, stockType);
          const sData = {
            companyId, docNo: sDocNo, docType: stockType, docDate, warehouseCode,
            remarks: (docType + " " + docNo) + (remarks ? " — " + remarks : ""),
            lines: lines.filter(l => l.lineType !== "S" && l.itemCode).map((l, i) => ({ lineNum: i+1, itemCode: l.itemCode, name: l.name, qty: l.qty, uom: l.uom })),
            status: "posted",
            createdBy: currentUser.email,
            createdAt: new Date().toISOString(),
            sourceDoc: docNo,
          };
          const sRef = await db.collection("stock_docs").add(sData);
          stockDocs.unshift({ id: sRef.id, ...sData });
          data.stockDocNo = sDocNo;
        }
        // Mandatory GL for Delivery / Invoice / Credit Memo
        if (docType === "DN" || docType === "INV" || docType === "DPI" || docType === "CM") {
          const ar = getMap(companyId, "AR_CONTROL");
          const rev = getMap(companyId, "REVENUE");
          const cogs = getMap(companyId, "COGS");
          const invAcct = getMap(companyId, "INVENTORY");
          if ((docType === "INV" || docType === "DPI" || docType === "CM") && (!ar || !rev)) {
            toast("GL Account Determination is mandatory: set AR Control and Revenue before posting " + docType);
            return;
          }
          if (docType === "DN" && (!cogs || !invAcct)) {
            toast("GL Account Determination is mandatory: set COGS and Inventory before posting Delivery");
            return;
          }
          let glLines = [];
          const vatAcc = vatByAccount(companyId, lines, "VAT_OUTPUT");
          if (vatAcc[""]) {
            toast("VAT selected but no G/L account: set Output VAT in Account Determination (VAT_OUTPUT) or on the Tax Code");
            return;
          }
          const vatCr = Object.keys(vatAcc).map(a => ({ acctCode: a, debit: 0, credit: vatAcc[a], lineMemo: "Output VAT " + docNo }));
          const vatDr = Object.keys(vatAcc).map(a => ({ acctCode: a, debit: vatAcc[a], credit: 0, lineMemo: "Reverse VAT " + docNo }));
          // The G/L account typed on the document line wins; Account Determination (REVENUE) is only the fallback
          const revByAcct = {};
          lines.forEach(l => { const a = l.acctCode || rev; revByAcct[a] = round2((revByAcct[a] || 0) + (parseFloat(l.lineTotal) || 0)); });
          if (freight) revByAcct[rev] = round2((revByAcct[rev] || 0) + freight);
          const revCr = Object.keys(revByAcct).map(a => ({ acctCode: a, debit: 0, credit: revByAcct[a], lineMemo: "Revenue " + docNo }));
          const revDr = Object.keys(revByAcct).map(a => ({ acctCode: a, debit: revByAcct[a], credit: 0, lineMemo: "CM reverse revenue " + docNo }));
          if (docType === "INV" || docType === "DPI") {
            glLines = [
              { acctCode: ar, debit: grandTotal, credit: 0, lineMemo: "AR " + docNo },
              ...revCr,
              ...vatCr,
            ];
          } else if (docType === "CM") {
            // Reverse: Dr Revenue (+VAT), Cr AR (reduces customer balance)
            glLines = [
              ...revDr,
              ...vatDr,
              { acctCode: ar, debit: 0, credit: grandTotal, lineMemo: "CM reverse AR " + docNo },
            ];
          } else if (docType === "DN") {
            // Delivery: Dr COGS, Cr Inventory
            const cost = (lines || []).reduce((s, l) => s + ((parseFloat(l.qty)||0) * (parseFloat(l.price)||0) * 0.7), 0) || grandTotal * 0.7;
            glLines = [
              { acctCode: cogs, debit: cost, credit: 0, lineMemo: "COGS " + docNo },
              { acctCode: invAcct, debit: 0, credit: cost, lineMemo: "Inventory " + docNo },
            ];
          }
          try {
            const je = await postJournalEntry(companyId, {
              refDate: docDate, memo: docType + " " + docNo + (docRate !== 1 ? " (" + docCurrency + " @" + docRate + ")" : ""), lines: fxLines(glLines, docRate),
              sourceType: docType, sourceDoc: docNo
            });
            data.journalNo = je.transId;
          } catch (ge) {
            toast("Document saved but GL failed: " + ge.message);
          }
        }
        const ref = await db.collection("sales_docs").add(data);
        salesDocs.unshift({ id: ref.id, ...data });

        // Relationship map: close base document (but NOT if copying to Down Payment)
        if (salesCopyFromId) {
          const base = salesDocs.find(x => x.id === salesCopyFromId);
          const isDownPay = docType === "DPR" || docType === "DPI";
          if (base && base.status !== "cancelled" && (!isDownPay || (base.docType === "DPR" && docType === "DPI"))) {
            const closePayload = {
              status: "closed",
              closedAt: new Date().toISOString(),
              closedBy: currentUser.email,
              closedReason: "Copied to " + docType + " " + docNo,
              targetDocId: ref.id,
              targetDocType: docType,
              targetDocNo: docNo,
            };
            await db.collection("sales_docs").doc(base.id).update(closePayload);
            Object.assign(base, closePayload);
          }
          salesCopyFromId = null;
        }
        if (!(docType === "INV" || docType === "CM")) toast("Posted " + docNo, true);
        else if (data.journalNo) toast("Posted " + docNo + " / JE " + data.journalNo, true);
        else toast("Posted " + docNo, true);
        salesEditId = null;
        // return form node to main if it was moved into a window
        const main = document.getElementById("main");
        renderSalesDoc(main, docType);
        // close topmost draft windows optionally left to user

      } catch (e) {
        toast(e.message);
      }
    }

    let winZ = 90, winSeq = 0;
    const openWins = {};
    function openAppWindow(title, htmlBody, opts) {
      opts = opts || {};
      const id = "w" + (++winSeq);
      const layer = document.getElementById("win-layer");
      const tb = document.getElementById("taskbar-wins");
      if (!layer) {
        console.error("win-layer missing");
        toast("Window layer missing");
        return null;
      }
      if (tb) tb.style.display = "flex";
      const win = document.createElement("div");
      win.className = "win";
      win.id = id;
      win.style.left = (40 + (winSeq % 6) * 28) + "px";
      win.style.top = (40 + (winSeq % 6) * 28) + "px";
      win.style.width = (opts.w || 720) + "px";
      win.style.height = (opts.h || 480) + "px";
      win.style.zIndex = ++winZ;
      win.innerHTML = `<div class="win-title"><span></span><span class="win-btns">
        <button type="button" onclick="minimizeWin('${id}')">_</button>
        <button type="button" onclick="maximizeWin('${id}')">□</button>
        <button type="button" onclick="closeWin('${id}')">✕</button>
      </span></div><div class="win-body"></div>`;
      win.querySelector(".win-title span").textContent = title;
      win.querySelector(".win-body").innerHTML = htmlBody;
      layer.appendChild(win);
      openWins[id] = { el: win, title, minimized: false };
      const hd = win.querySelector(".win-title");
      let dragging=false, ox=0, oy=0;
      hd.addEventListener("mousedown", e => {
        if (e.target.closest("button") || win.classList.contains("maximized")) return;
        dragging = true; ox = e.clientX - win.offsetLeft; oy = e.clientY - win.offsetTop; e.preventDefault();
      });
      document.addEventListener("mousemove", e => {
        if (!dragging) return;
        win.style.left = Math.max(0, e.clientX - ox) + "px";
        win.style.top = Math.max(0, e.clientY - oy) + "px";
      });
      document.addEventListener("mouseup", () => { dragging = false; });
      win.addEventListener("mousedown", () => { win.style.zIndex = ++winZ; refreshTaskbar(); });
      refreshTaskbar();
      return id;
    }
    function minimizeWin(id) { const w=openWins[id]; if(!w)return; w.el.classList.add("minimized"); w.minimized=true; refreshTaskbar(); }
    function maximizeWin(id) { const w=openWins[id]; if(!w)return; w.el.classList.toggle("maximized"); w.el.classList.remove("minimized"); w.minimized=false; refreshTaskbar(); }
    function closeWin(id) { const w=openWins[id]; if(!w)return; w.el.remove(); delete openWins[id]; refreshTaskbar(); }
    function focusWin(id) { const w=openWins[id]; if(!w)return; w.el.classList.remove("minimized"); w.minimized=false; w.el.style.zIndex=++winZ; refreshTaskbar(); }
    function refreshTaskbar() {
      const tb = document.getElementById("taskbar-wins"); if (!tb) return;
      const ids = Object.keys(openWins);
      if (!ids.length) { tb.style.display="none"; tb.innerHTML=""; return; }
      tb.style.display="flex";
      tb.innerHTML = ids.map(id => `<button type="button" class="${openWins[id].minimized?"":"active"}" onclick="focusWin('${id}')">${esc(openWins[id].title)}</button>`).join("");
    }

    async function doCopyTo(docId) {
      const src = salesDocs.find(x => x.id === docId);
      if (!src) return;
      const targetEl = document.getElementById("copy-target");
      const target = targetEl ? targetEl.value : null;
      if (!target) return toast("Select target document");
      const meta = SALES_META[target];
      if (!meta) return;
      if (!canSeeDoc(src.docType) || !requireAuth(docAuthKey(target), 2, "No Authorization to create " + (meta.title||target))) return;
      // Flow rules
      const allowed = {
        SQ: ["SO"],
        SO: ["DN", "DPR", "DPI"],
        DPR: ["DPI"],
        DN: ["INV", "RET"],
        DPI: ["CM"],
        INV: ["CM", "RET"],
        RET: ["CM"],
        CM: []
      };
      if (allowed[src.docType] && !allowed[src.docType].includes(target)) {
        if (!confirm("Non-standard flow " + src.docType + " → " + target + ". Continue?")) return;
      }
      salesLines = (src.lines || []).map(l => ({ ...l }));
      salesEditId = null;
      salesCopyFromId = src.id;
      const pageMap = { SQ:"sq", SO:"so", DN:"dn", RET:"ret", DPR:"dpr", DPI:"dpi", INV:"inv", CM:"cm" };
      nav(pageMap[target] || "sq");
      setTimeout(() => {
        const form = document.getElementById("sales-form");
        if (!form) return toast("Open target document screen first");
        form.style.display = "block";
        const winId = openAppWindow((meta.title||target) + " — from " + src.docNo, "", { w: 980, h: 560 });
        const body = document.querySelector("#" + winId + " .win-body");
        if (body) { body.innerHTML = ""; body.appendChild(form); form.style.display = "block"; }
        const set = (id, val) => { const el = document.getElementById(id); if (el && val!=null) el.value = val; };
        set("s-bp", src.bpCode);
        if (typeof onSalesCustomerChange === "function") onSalesCustomerChange();
        set("s-branch", src.branchCode||"");
        set("s-wh", src.warehouseCode||"");

        renderSalesLines();

      }, 200);
    }

    async function openImportMapper(kind, input) {
      try {
        const file = input.files && input.files[0];
        if (!file) return;
        let schema = IMPORT_SCHEMAS[kind];
        if (!schema && kind.startsWith("sales_")) {
          schema = buildSalesImportSchema(kind.replace("sales_", ""));
        }
        if (!schema && kind.startsWith("stock_")) {
          schema = buildStockImportSchema(kind.replace("stock_", ""));
        }
        if (!schema && kind.startsWith("purch_")) {
          schema = buildPurchImportSchema(kind.replace("purch_", ""));
        }
        if (!schema) {
          toast("Import not configured for: " + kind);
          input.value = "";
          return;
        }
        const cid = activeCompanyId || companyFilterId();
        if (!cid) {
          toast("Select company at login first");
          input.value = "";
          return;
        }
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        if (!rows.length) {
          toast("Excel has no data rows");
          input.value = "";
          return;
        }
        const headers = Object.keys(rows[0]);
        // auto-map
        const map = {};
        schema.fields.forEach(f => {
          const found = headers.find(h => f.labels.some(l => String(h).toLowerCase() === String(l).toLowerCase()));
          map[f.key] = found || "";
        });
        const stateKind = kind.startsWith("sales_") ? "sales_doc" : (kind.startsWith("stock_") ? "stock_doc" : (kind.startsWith("purch_") ? "purch_doc" : kind));
        __importState = { kind: stateKind, rawKind: kind, schema, rows, headers, map, cid };
        const body = `
          <div style="padding:8px">
            <p style="margin:0 0 8px;font-size:13px"><b>${rows.length}</b> rows · Company session active · Map columns then Import</p>
            <div style="display:grid;grid-template-columns:140px 1fr;gap:6px 10px;font-size:12px">
              ${schema.fields.map(f => `
                <label style="font-weight:600;align-self:center">${esc(f.key)}${schema.required.includes(f.key)?" *":""}</label>
                <select data-field="${f.key}" class="imp-map" style="padding:4px;margin:0">
                  <option value="">— skip —</option>
                  ${headers.map(h => `<option value="${esc(h)}" ${map[f.key]===h?"selected":""}>${esc(h)}</option>`).join("")}
                </select>`).join("")}
            </div>
            <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
              <button class="btn btn-sm btn-primary" id="imp-run-btn" onclick="runImportMapper()">Import</button>
              <button class="btn btn-sm" onclick="closeImportMapperUi()">Cancel</button>
            </div>
          </div>`;
        if (typeof openAppWindow === "function") {
          openAppWindow("Import Excel — " + kind, body, { w: 520, h: 480 });
        } else {
          alert("Import mapper ready — use window UI");
        }
      } catch (e) {
        console.error(e);
        toast("Import failed: " + e.message);
      }
      input.value = "";
    }
    function closeImportMapperUi() {
      __importState = null;
      // close top-most window if any
      const ids = Object.keys(openWins || {});

    }

    async function importSalesDocumentRows(docType, rows, map, cid) {
      const g = (row, k) => { const col = map[k]; return col ? String(row[col]??"").trim() : ""; };
      const groups = {};
      showProgress(5, "Grouping sales rows…");
      rows.forEach((row, idx) => {
        const key = g(row, "docGroup") || (g(row, "bpCode") + "|" + g(row, "docDate") + "|g" + idx);
        if (!groups[key]) groups[key] = [];
        groups[key].push(row);
      });
      let added = 0, skipped = 0;
      const keys = Object.keys(groups);
      for (let gi = 0; gi < keys.length; gi++) {
        const key = keys[gi];
        showProgress(10 + Math.round((gi / Math.max(keys.length,1)) * 85), "Posting sales " + (gi+1) + "/" + keys.length);
        const gRows = groups[key];
        const first = gRows[0];
        const bpCode = g(first, "bpCode");
        if (!bpCode) { skipped += gRows.length; continue; }
        const docDate = g(first, "docDate") || new Date().toISOString().slice(0,10);
        const warehouseCode = g(first, "warehouseCode") || null;
        const branchCode = g(first, "branchCode") || null;
        const remarks = g(first, "remarks") || null;
        const bp = partners.find(p => p.companyId === cid && p.bpCode === bpCode);
        const lines = [];
        gRows.forEach(row => {
          const itemCode = g(row, "itemCode");
          const qty = parseFloat(g(row, "qty"));
          if (!itemCode || !(qty > 0)) { skipped++; return; }
          const price = parseFloat(g(row, "price")) || 0;
          const discPct = parseFloat(g(row, "discPct")) || 0;
          const name = g(row, "name") || (items.find(it => it.itemCode === itemCode) || {}).name || itemCode;
          const uom = g(row, "uom") || "pcs";
          const line = { lineNum: lines.length + 1, lineType: "I", itemCode, name, qty, uom, price, priceBefDi: price, discPct, vatPrcnt: 0 };
          if (typeof syncLinePrices === "function") syncLinePrices(line);
          line.lineTotal = typeof lineTotal === "function" ? lineTotal(line) : (qty * price * (1 - discPct/100));
          lines.push(line);
        });
        if (!lines.length) continue;
        const grandTotal = lines.reduce((s, l) => s + (parseFloat(l.lineTotal) || 0), 0);
        const docNo = await nextSalesDocNo(cid, docType);
        const data = {
          companyId: cid, docType, docNo, docDate, bpCode, bpName: bp ? bp.name : "",
          warehouseCode, branchCode, remarks, slpCode, owner, lines, grandTotal, status: "open", paidAmount: 0,
          createdBy: currentUser.email, createdAt: new Date().toISOString()
        };
        const ref = await db.collection("sales_docs").add(data);
        salesDocs.unshift({ id: ref.id, ...data });
        added++;
      }
      return { added, skipped };
    }

    async function importStockDocumentRows(kind, rows, map, cid) {
      const g = (row, k) => { const col = map[k]; return col ? String(row[col]??"").trim() : ""; };
      const groups = {};
      showProgress(5, "Grouping stock rows…");
      rows.forEach((row, idx) => {
        const key = g(row, "docGroup") || ("row" + idx);
        if (!groups[key]) groups[key] = [];
        groups[key].push(row);
      });
      let added = 0, skipped = 0;
      for (const key of Object.keys(groups)) {
        const gRows = groups[key];
        const first = gRows[0];
        const docDate = g(first, "docDate") || new Date().toISOString().slice(0,10);
        const remarks = g(first, "remarks") || null;
        let docType, warehouseCode, fromWh, toWh;
        if (kind === "TR") {
          docType = "TR"; fromWh = g(first, "fromWh"); toWh = g(first, "toWh");
          warehouseCode = fromWh;
          if (!fromWh || !toWh) { skipped += gRows.length; continue; }
        } else if (kind === "OB") {
          docType = "OB"; warehouseCode = g(first, "warehouseCode");
          if (!warehouseCode) { skipped += gRows.length; continue; }
        } else {
          docType = (g(first, "docType") || "IN").toUpperCase();
          if (docType !== "OUT") docType = "IN";
          warehouseCode = g(first, "warehouseCode");
          if (!warehouseCode) { skipped += gRows.length; continue; }
        }
        const lines = [];
        gRows.forEach(row => {
          const itemCode = g(row, "itemCode");
          const qty = parseFloat(g(row, "qty"));
          if (!itemCode || !(qty > 0)) { skipped++; return; }
          lines.push({
            lineNum: lines.length + 1, itemCode,
            name: g(row, "name") || (items.find(i => i.itemCode === itemCode) || {}).name || "",
            qty, uom: g(row, "uom") || "pcs",
            unitCost: parseFloat(g(row, "unitCost")) || 0
          });
        });
        if (!lines.length) continue;
        const seriesType = docType === "TR" ? "TR" : (docType === "OB" ? "OB" : docType);
        const docNo = await nextStockDocNo(cid, seriesType);
        const data = {
          companyId: cid, docNo, docType, docDate, warehouseCode,
          fromWh: fromWh || null, toWh: toWh || null,
          remarks, lines, status: "posted", createdBy: currentUser.email, createdAt: new Date().toISOString()
        };
        const ref = await db.collection("stock_docs").add(data);
        stockDocs.unshift({ id: ref.id, ...data });
        added++;
      }
      return { added, skipped };
    }

    async function runImportMapper() {
      if (__busy) return toast("Another operation is running");
      if (!__importState) return toast("No import loaded");
      __busy = true;
      showProgress(0, "Starting import…");
      const btn = document.getElementById("imp-run-btn");
      if (btn) { btn.disabled = true; btn.textContent = "Importing…"; }
      const { schema, rows, cid, kind } = __importState;
      const total = rows.length || 1;
      const map = {};
      document.querySelectorAll("select.imp-map").forEach(s => {
        map[s.dataset.field] = s.value || "";
      });
      for (const r of schema.required) {
        if (!map[r]) { __busy = false; hideProgress(); if (btn) { btn.disabled = false; btn.textContent = "Import"; } return toast("Map required field: " + r); }
      }
      let added = 0, skipped = 0;
      try {
        // Document imports (per-type)
        if (kind === "sales_doc" && schema.docType) {
          const res = await importSalesDocumentRows(schema.docType, rows, map, cid);
          toast("Sales imported: " + res.added + " docs · skipped lines: " + res.skipped, true);
          __importState = null;
          if (schema.refresh) schema.refresh();
          Object.keys(openWins || {}).forEach(id => { try { closeWin(id); } catch(_){} });
          return;
        }
        if (kind === "purch_doc" && schema.docType) {
          const res = await importPurchaseDocumentRows(schema.docType, rows, map, cid);
          toast("Purchasing imported: " + res.added + " docs · skipped lines: " + res.skipped, true);
          __importState = null;
          if (schema.refresh) schema.refresh();
          Object.keys(openWins || {}).forEach(id => { try { closeWin(id); } catch(_){} });
          return;
        }
        if (kind === "stock_doc" && schema.stockKind) {
          const res = await importStockDocumentRows(schema.stockKind, rows, map, cid);
          toast("Stock imported: " + res.added + " docs · skipped: " + res.skipped, true);
          __importState = null;
          if (schema.refresh) schema.refresh();
          Object.keys(openWins || {}).forEach(id => { try { closeWin(id); } catch(_){} });
          return;
        }
        // Special: stock lines → group into stock_docs
        if (kind === "stock") {
          const groups = {};
          for (const row of rows) {
            const line = schema.build(row, map, cid);
            if (!line) { skipped++; continue; }
            const key = [line.docType, line.docDate, line.warehouseCode].join("|");
            if (!groups[key]) groups[key] = { header: line, lines: [] };
            groups[key].lines.push({
              lineNum: groups[key].lines.length + 1,
              itemCode: line.itemCode, name: line.name, qty: line.qty, uom: line.uom
            });
          }
          for (const key of Object.keys(groups)) {
            const g = groups[key];
            const docNo = await nextStockDocNo(cid, g.header.docType);
            const data = {
              companyId: cid, docNo, docType: g.header.docType, docDate: g.header.docDate,
              warehouseCode: g.header.warehouseCode, remarks: g.header.remarks,
              lines: g.lines, status: "posted",
              createdBy: currentUser.email, createdAt: new Date().toISOString()
            };
            const ref = await db.collection("stock_docs").add(data);
            stockDocs.unshift({ id: ref.id, ...data });
            added++;
          }
          toast("Stock docs imported: " + added + " · Skipped lines: " + skipped, true);
          __importState = null;
          if (schema.refresh) schema.refresh();
          Object.keys(openWins || {}).forEach(id => { try { closeWin(id); } catch(_){} });
          return;
        }
        // Special: sales lines → one document per (docType, date, bpCode)
        if (kind === "sales") {
          const groups = {};
          for (const row of rows) {
            const line = schema.build(row, map, cid);
            if (!line) { skipped++; continue; }
            const key = [line.docType, line.docDate, line.bpCode].join("|");
            if (!groups[key]) groups[key] = { header: line, lines: [] };
            groups[key].lines.push({
              lineNum: groups[key].lines.length + 1,
              lineType: "I", itemCode: line.itemCode, name: line.name,
              qty: line.qty, uom: line.uom, price: line.price, discPct: line.discPct,
              lineTotal: line.lineTotal, priceBefDi: line.price
            });
          }
          for (const key of Object.keys(groups)) {
            const g = groups[key];
            const bp = partners.find(p => p.companyId === cid && p.bpCode === g.header.bpCode);
            const grandTotal = g.lines.reduce((s, l) => s + (parseFloat(l.lineTotal)||0), 0);
            const docNo = await nextSalesDocNo(cid, g.header.docType);
            const data = {
              companyId: cid, docType: g.header.docType, docNo,
              docDate: g.header.docDate, bpCode: g.header.bpCode,
              bpName: bp ? bp.name : "", warehouseCode: g.header.warehouseCode,
              lines: g.lines, grandTotal, status: "open", paidAmount: 0,
              createdBy: currentUser.email, createdAt: new Date().toISOString()
            };
            const ref = await db.collection("sales_docs").add(data);
            salesDocs.unshift({ id: ref.id, ...data });
            added++;
          }
          toast("Sales docs imported: " + added + " · Skipped lines: " + skipped, true);
          __importState = null;
          if (schema.refresh) schema.refresh();
          Object.keys(openWins || {}).forEach(id => { try { closeWin(id); } catch(_){} });
          return;
        }
        if (schema.begin) schema.begin(rows, map, cid);
        for (let i = 0; i < rows.length; i++) {
          const row = rows[i];
          showProgress(Math.round((i / total) * 100), "Importing " + (i+1) + " / " + total);
          const data = schema.build(row, map, cid);
          if (!data) { skipped++; continue; }
          if (schema.exists(data)) { skipped++; continue; }
          const ref = await db.collection(schema.collection).add(data);
          if (schema.push) schema.push({ id: ref.id, ...data });
          else if (schema.collection === "items") items.push({ id: ref.id, ...data });
          else if (schema.collection === "employees") employees.push({ id: ref.id, ...data });
          else if (schema.collection === "partners") partners.push({ id: ref.id, ...data });
          else if (schema.collection === "branches") branches.push({ id: ref.id, ...data });
          else if (schema.collection === "dimensions") dimensions.push({ id: ref.id, ...data });
          else if (schema.collection === "accounts") accounts.push({ id: ref.id, ...data });
          else if (schema.collection === "warehouses") warehouses.push({ id: ref.id, ...data });
          else if (schema.collection === "price_lists") priceLists.push({ id: ref.id, ...data });
          else if (schema.collection === "users") users.push({ id: ref.id, ...data });
          else if (schema.collection === "currencies") currencies.push({ id: ref.id, ...data });
          else if (schema.collection === "partner_groups") partnerGroups.push({ id: ref.id, ...data });
          added++;
        }
        showProgress(100, "Done");
        toast("Imported " + added + " · Skipped " + skipped, true);
        __importState = null;
        if (schema.refresh) schema.refresh();
        Object.keys(openWins || {}).forEach(id => { try { closeWin(id); } catch(_){} });
      } catch (e) {
        console.error(e);
        toast("Import error: " + e.message);
      } finally {
        __busy = false;
        hideProgress();
      }
    }

    function makeSearchable(selectId, options, valueKey, labelFn) {
      const sel = document.getElementById(selectId);
      if (!sel) return;
      const wrap = document.createElement("div");
      wrap.style.cssText = "position:relative;display:inline-block;width:100%";
      const search = document.createElement("input");
      search.placeholder = "Type to search (*meal)";
      search.style.cssText = "width:100%;margin:0;padding:3px 6px;font-size:12px;border:1px solid #999";
      search.oninput = () => {
        const q = search.value;
        const filtered = options.filter(o => matchSearch(labelFn(o), q) || matchSearch(o[valueKey], q));
        sel.innerHTML = `<option value="">—</option>` + filtered.map(o => `<option value="${esc(o[valueKey])}">${esc(labelFn(o))}</option>`).join("");
      };
      sel.parentNode.insertBefore(wrap, sel);
      wrap.appendChild(search);
      wrap.appendChild(sel);
    }
    function initGlSearch(selectId, accounts) {
      const sorted = [...accounts].sort((a,b)=>(a.acctName||"").localeCompare(b.acctName||""));
      makeSearchable(selectId, sorted, "acctCode", a => a.acctCode + " — " + (a.acctName||""));
    }

    function matchSearch(text, query) {
      if (!query) return true;
      const t = String(text||"").toLowerCase();
      const q = String(query||"").toLowerCase().replace(/\*/g, ".*");
      try { return new RegExp(q).test(t); } catch(e) { return t.includes(q.replace(/\.\*/g,"")); }
    }
    // ===== Incoming / Outgoing Payments (SAP B1 style) =====
    // dir: "in" = Incoming Payment, "out" = Outgoing Payment
    let isPosting = false;
    const PAY_CFG = {
      in:  { title: "Incoming Payment", series: "RC", defType: "C", types: [["C","Customer"],["S","Vendor"],["A","Account"]] },
      out: { title: "Outgoing Payment", series: "OP", defType: "S", types: [["S","Vendor"],["C","Customer"],["A","Account"]] },
    };
    const PAY_DOC_LABEL = {
      DPR: "A/R Down Payment Request", DPI: "A/R Down Payment Invoice", INV: "A/R Invoice", CM: "A/R Credit Memo",
      PDPR: "A/P Down Payment Request", PDPI: "A/P Down Payment Invoice", APINV: "A/P Invoice", APCM: "A/P Credit Memo",
    };
    let payAcctLines = { in: [], out: [] };

    /** Which documents can be settled for (direction, partner type) */
    function payDocSource(dir, type) {
      if (dir === "in"  && type === "C") return { src: "sales", types: ["DPR","DPI","INV"] };
      if (dir === "out" && type === "S") return { src: "purch", types: ["PDPR","PDPI","APINV"] };
      if (dir === "in"  && type === "S") return { src: "purch", types: ["APCM"] };
      if (dir === "out" && type === "C") return { src: "sales", types: ["CM"] };
      return null;
    }
    /** Only G/L accounts flagged as Cash Account (falls back to cash/bank by name when none is flagged) */
    function payCashAccounts(cid) {
      const all = scoped(accounts, cid).filter(a => a.postable !== false && a.postable !== "Title");
      const byCode = {}; scoped(accounts, cid).forEach(a => byCode[a.acctCode] = a);
      const underCashBank = (a) => {            // any ancestor that is a Cash / Bank title account
        let p = a.fatherNum, guard = 0;
        while (p && byCode[p] && guard++ < 12) { if (/cash|bank|petty|m-?pesa|mobile money/i.test(byCode[p].acctName || "")) return true; p = byCode[p].fatherNum; }
        return false;
      };
      let list = all.filter(a => a.cashAccount === "Y" || a.cashAccount === true || a.isCash === true || a.isCash === "Y" || underCashBank(a));
      if (!list.length) list = all.filter(a => /cash|bank|petty|mpesa|m-pesa|tigo|airtel|halo/i.test(a.acctName || ""));
      return list.sort((a,b) => (a.acctCode||"").localeCompare(b.acctCode||""));
    }

      return `<option value="">—</option>` + out.map(d => `<option value="${esc(d.code)}">${esc(d.code)}${d.name?" — "+esc(d.name):""}</option>`).join("");

        </div>
        <div class="grid-wrap"><table class="grid">
          <thead><tr><th>Doc No</th><th>Date</th><th>Type</th><th>Code</th><th>Name</th><th>Currency</th><th>Total</th><th>Total (Local)</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${list.map(x => `<tr>
              <td>${esc(x.docNo)}</td><td>${esc(x.docDate||"")}</td>
              <td>${esc(x.docType||"")}</td>
              <td>${esc(x.cardCode||x.bpCode||"")}</td><td>${esc(x.cardName||"")}</td>
              <td>${esc(x.docCurrency||"")}</td>
              <td style="text-align:right">${payFmt(x.docTotal||x.amount)}</td>
              <td style="text-align:right">${payFmt(x.docTotalLC!=null ? x.docTotalLC : (x.docTotal||x.amount))}</td>
              <td>${esc(x.status||"posted")}</td>
              <td><button class="btn btn-sm" onclick="viewPayment('${x.id}')">View</button></td>
            </tr>`).join("") || `<tr><td colspan="10">No payments</td></tr>`}
          </tbody>
        </table></div>`;
    }

    function startNewPay(p) {
      const f = document.getElementById(p + "-form");
      if (!f) return;
      f.style.display = "block";
      const d = payEl(p, "date"); if (d && !d.value) d.valueAsDate = new Date();
      const dd = payEl(p, "docdate"); if (dd && !dd.value) dd.valueAsDate = new Date();
      payAcctLines[p] = [{ acctCode: "", amount: "", project: "", department: "", branch: "" }];
      try {
        const cid0 = companyFilterId();
        const dc = getMap(cid0, "CASH"), db0 = getMap(cid0, "BANK");
        const sc = payEl(p, "cashacct"), sb = payEl(p, "trsfracct"), sk = payEl(p, "checkacct");
        if (sc && dc && !sc.value && Array.from(sc.options).some(o => o.value === dc)) sc.value = dc;
        if (sb && db0 && !sb.value && Array.from(sb.options).some(o => o.value === db0)) sb.value = db0;
        if (sk && db0 && !sk.value && Array.from(sk.options).some(o => o.value === db0)) sk.value = db0;
      } catch (e) {}
      onPayTypeChange(p);
      onDocCurrencyChange(p);
    }
    function switchPayTab(p, btn, tab) {
      btn.parentElement.querySelectorAll("button").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      ["content","means","remarks"].forEach(t => { const el = payEl(p, "tab-" + t); if (el) el.style.display = t === tab ? "block" : "none"; });
    }

    function onPayTypeChange(p) {
      const type = payEl(p, "type").value;
      const cid = companyFilterId();
      const bp = payEl(p, "bp"), ns = payEl(p, "name-sel");
      const isA = type === "A";
      if (isA) {
        bp.innerHTML = `<option value="">(not required)</option>`;
        ns.innerHTML = `<option value="">(not required)</option>`;

        const l = payBpList(cid, type);
        bp.innerHTML = `<option value="">—</option>` + l.map(x => `<option value="${esc(x.bpCode)}">${esc(x.bpCode)}${x.name?" — "+esc(x.name):""}</option>`).join("");
        ns.innerHTML = `<option value="">— Name —</option>` + l.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||"")).map(x => `<option value="${esc(x.bpCode)}">${esc(x.name||"")} — ${esc(x.bpCode)}</option>`).join("");
      }
      bp.disabled = isA; ns.disabled = isA;
      payEl(p, "name").value = "";
      payRenderContent(p);
    }
    function onPayBpChange(p) {
      const type = payEl(p, "type").value, cid = companyFilterId();
      const code = payEl(p, "bp").value;
      const bp = partners.find(x => x.bpCode === code && x.companyId === cid);
      payEl(p, "name").value = bp ? (bp.name || "") : "";
      const ns = payEl(p, "name-sel"); if (ns && ns.value !== code) ns.value = code;
      if (bp) applyPartnerCurrency(p, bp);

    function onPayNameChange(p) {

      const bs = payEl(p, "bp");
      if (bs && bs.value !== code) bs.value = code;
      onPayBpChange(p);
    }

    /** Build the Content tab: open documents of the partner, or G/L account lines */
    function payRenderContent(p) {
      const box = payEl(p, "content");
      if (!box) return;
      const type = payEl(p, "type").value, cid = companyFilterId();
      if (type === "A") { payRenderAcctLines(p); return; }
      const bpCode = payEl(p, "bp").value;
      const srcDef = payDocSource(p, type);
      if (!bpCode) {
        box.innerHTML = `<div style="padding:12px;color:#64748b">Select a ${type === "S" ? "Vendor" : "Customer"} to see its open documents.</div>`;
        payEl(p, "doctotal").textContent = "0.00"; return;
      }
      const local = defaultCurrencyCode();
      const docs = scoped(srcDef.src === "sales" ? salesDocs : purchaseDocs, cid)
        .filter(d => srcDef.types.indexOf(d.docType) >= 0 && d.bpCode === bpCode && d.status !== "closed" && d.status !== "cancelled")
        .map(d => ({ d, bal: round2((parseFloat(d.grandTotal)||0) - (parseFloat(d.paidAmount)||0)) }))
        .filter(x => x.bal > 0.004)
        .sort((a,b) => (a.d.docDate||"").localeCompare(b.d.docDate||""));
      box.innerHTML = `<table class="grid">
        <thead><tr><th style="width:26px"><input type="checkbox" onchange="payCheckAll('${p}',this.checked)"></th>
          <th>Document</th><th>Doc No.</th><th>Date</th><th>Due Date</th><th>Currency</th><th>Total</th><th>Balance Due</th><th>Total Payment</th></tr></thead>
        <tbody>${docs.map(({d, bal}) => `<tr>
          <td><input type="checkbox" class="${p}-chk" onchange="payCheckRow('${p}',this)"></td>
          <td>${esc(PAY_DOC_LABEL[d.docType] || d.docType)}</td>
          <td>${esc(d.docNo)}</td><td>${esc(d.docDate||"")}</td><td>${esc(d.dueDate||"")}</td>
          <td>${esc(d.docCurrency || local)}</td>
          <td style="text-align:right">${payFmt(d.grandTotal)}</td>
          <td style="text-align:right">${payFmt(bal)}</td>
          <td><input type="number" step="any" class="${p}-app" value="0" style="width:110px;margin:0;padding:2px;text-align:right"
              data-id="${esc(d.id)}" data-src="${srcDef.src}" data-type="${esc(d.docType)}" data-docno="${esc(d.docNo)}" data-bal="${bal}" data-rate="${parseFloat(d.docRate)||1}"
              onchange="payClampRow(this);recalcPay('${p}')"></td>
        </tr>`).join("") || `<tr><td colspan="9" style="color:#64748b;padding:10px">No open ${srcDef.types.map(t => PAY_DOC_LABEL[t]).join(" / ")} for this partner.</td></tr>`}</tbody>
        <tfoot><tr><td colspan="8" style="text-align:right"><b>On Account (advance, not applied to a document)</b></td>
          <td><input type="number" step="any" id="${p}-onacct" value="0" style="width:110px;margin:0;padding:2px;text-align:right" onchange="recalcPay('${p}')"></td></tr></tfoot>
      </table>`;
      recalcPay(p);
    }
    function payClampRow(inp) {
      let v = parseFloat(inp.value) || 0; const bal = parseFloat(inp.dataset.bal) || 0;
      if (v < 0) v = 0; if (v > bal) v = bal; inp.value = v;
      const cb = inp.closest("tr").querySelector("input[type=checkbox]"); if (cb) cb.checked = v > 0;
    }
    function payCheckRow(p, cb) {
      const inp = cb.closest("tr").querySelector("." + p + "-app");
      inp.value = cb.checked ? inp.dataset.bal : 0;
      recalcPay(p);
    }
    function payCheckAll(p, on) {
      document.querySelectorAll("." + p + "-chk").forEach(cb => { cb.checked = on; payCheckRow(p, cb); });
    }

    /** G/L account lines (type Account) */
    function payRenderAcctLines(p) {
      const box = payEl(p, "content"), cid = companyFilterId();
      const accts = scoped(accounts, cid).filter(a => a.postable !== false && a.postable !== "Title").sort((a,b)=>(a.acctCode||"").localeCompare(b.acctCode||""));
      const byName = accts.slice().sort((a,b)=>(a.acctName||"").localeCompare(b.acctName||""));
      const proj = payDimOptions(cid, "PROJECT"), dept = payDimOptions(cid, "DEPARTMENT"), br = payDimOptions(cid, "BRANCH");
      const L = payAcctLines[p];
      const sel = (opts, v) => opts.replace(`value="${esc(v)}"`, `value="${esc(v)}" selected`);
      box.innerHTML = `<table class="grid">
        <thead><tr><th>#</th><th>G/L Account Code</th><th>G/L Account Name</th><th>Amount</th><th>Project</th><th>Department</th><th>Branch</th><th></th></tr></thead>
        <tbody>${L.map((l, i) => `<tr>
          <td>${i+1}</td>
          <td><select style="width:210px;margin:0;padding:2px" onchange="payAcctPick('${p}',${i},this.value)"><option value="">—</option>${accts.map(a => `<option value="${esc(a.acctCode)}" ${a.acctCode===l.acctCode?"selected":""}>${esc(a.acctCode)}${a.acctName?" — "+esc(a.acctName):""}</option>`).join("")}</select></td>
          <td><select style="width:230px;margin:0;padding:2px" onchange="payAcctPick('${p}',${i},this.value)"><option value="">—</option>${byName.map(a => `<option value="${esc(a.acctCode)}" ${a.acctCode===l.acctCode?"selected":""}>${esc(a.acctName||"")} — ${esc(a.acctCode)}</option>`).join("")}</select></td>
          <td><input type="number" step="any" value="${esc(l.amount)}" style="width:110px;margin:0;padding:2px;text-align:right" onchange="payAcctLines['${p}'][${i}].amount=this.value;recalcPay('${p}')"></td>
          <td><select style="width:110px;margin:0;padding:2px" onchange="payAcctLines['${p}'][${i}].project=this.value">${sel(proj, l.project)}</select></td>
          <td><select style="width:110px;margin:0;padding:2px" onchange="payAcctLines['${p}'][${i}].department=this.value">${sel(dept, l.department)}</select></td>
          <td><select style="width:110px;margin:0;padding:2px" onchange="payAcctLines['${p}'][${i}].branch=this.value">${sel(br, l.branch)}</select></td>
          <td><button class="btn btn-sm btn-danger" onclick="payAcctDel('${p}',${i})">✕</button></td>
        </tr>`).join("")}</tbody>
        <tfoot><tr><td colspan="8"><button class="btn btn-sm" onclick="payAcctAdd('${p}')">+ Row</button></td></tr></tfoot>
      </table>`;
      recalcPay(p);
    }
    function payAcctPick(p, i, code) { payAcctLines[p][i].acctCode = code; payRenderAcctLines(p); }
    function payAcctAdd(p) { payAcctLines[p].push({ acctCode: "", amount: "", project: "", department: "", branch: "" }); payRenderAcctLines(p); }
    function payAcctDel(p, i) { payAcctLines[p].splice(i, 1); if (!payAcctLines[p].length) payAcctLines[p].push({ acctCode: "", amount: "", project: "", department: "", branch: "" }); payRenderAcctLines(p); }

    /** Collect content totals: payment-currency total + local total */
    function payContentTotals(p) {
      const type = payEl(p, "type").value;
      const fx = docCurrencyInfo(p);
      if (type === "A") {
        const sum = payAcctLines[p].reduce((s, l) => s + payNum(l.amount), 0);
        return { pay: round2(sum), local: round2(sum * fx.rate), fx };
      }
      let appliedLocal = 0;
      document.querySelectorAll("." + p + "-app").forEach(i => { appliedLocal += payNum(i.value) * (parseFloat(i.dataset.rate) || 1); });
      const onAcct = payNum(payEl(p, "onacct") && payEl(p, "onacct").value);
      const local = round2(appliedLocal + onAcct * fx.rate);
      return { pay: round2(local / fx.rate), local, appliedLocal: round2(appliedLocal), onAcct, fx };
    }
    function recalcPay(p) {
      if (!payEl(p, "type")) return;
      const t = payContentTotals(p);
      payEl(p, "doctotal").textContent = payFmt(t.pay);
      setLocalTotal(p, t.pay);
      // Auto-distribute to Cash unless user typed it manually
      const cs = payEl(p, "cashsum");
      if (cs && !cs.dataset.touched) cs.value = Math.max(0, round2(t.pay - payNum(payEl(p, "checksum").value) - payNum(payEl(p, "trsfrsum").value)));
      const means = round2(payNum(cs.value) + payNum(payEl(p, "checksum").value) + payNum(payEl(p, "trsfrsum").value));
      payEl(p, "meanstotal").textContent = payFmt(means);
      const fl = payEl(p, "meansflag");
      if (fl) { const ok = Math.abs(means - t.pay) < 0.01; fl.textContent = ok ? "✓ matches" : "≠ Total Payment " + payFmt(t.pay); fl.style.color = ok ? "#059669" : "#b91c1c"; }
    }

    async function payEnsureSeries(companyId, series) {
      const yy = String(new Date().getFullYear()).slice(-2);
      if (!docSeries.some(s => s.companyId === companyId && s.docType === series && (s.prefix||"").includes("-" + yy + "-"))) {
        const data = { companyId, docType: series, prefix: series + "-" + yy + "-", nextNumber: 1, padLength: 4, yearReset: true, isActive: true };
        const ref = await db.collection("doc_series").add(data);
        docSeries.push({ id: ref.id, ...data });
      }
      return nextSalesDocNo(companyId, series);
    }

    async function postPay(p, andNew) {
      if (!requireAuth(p === "in" ? "bank.incoming" : "bank.outgoing", 2)) return;
      if (isPosting) return toast("Please wait...");
      isPosting = true;
      try {
        const cfg = PAY_CFG[p];
        const cidView = companyFilterId();
        const companyId = activeCompanyId || (currentUser.isSuperAdmin ? payEl(p, "co").value : currentUser.companyId);
        const type = payEl(p, "type").value;
        const cardCode = type === "A" ? null : payEl(p, "bp").value;
        const cardName = type === "A" ? null : payEl(p, "name").value;
        const docDate = payEl(p, "date").value;
        if (!companyId || !docDate) throw new Error("Company and posting date are required");
        if (type !== "A" && !cardCode) throw new Error("Select a " + (type === "S" ? "Vendor" : "Customer"));
        const fx = docCurrencyInfo(p);
        const tot = payContentTotals(p);
        if (!(tot.pay > 0)) throw new Error("Nothing to pay: select documents / enter amounts in Content");
        // Means
        const cashOk = {}; payCashAccounts(cidView || companyId).forEach(a => cashOk[a.acctCode] = 1);
        const means = [];
        [["cash","Cash"],["check","Check"],["trsfr","Bank Transfer"]].forEach(([k, label]) => {
          const amt = round2(payNum(payEl(p, k + "sum").value));
          const acct = payEl(p, k + "acct").value;
          if (amt > 0) {
            if (!acct) throw new Error(label + ": select a cash / bank account");
            if (!cashOk[acct]) throw new Error(label + ": only cash / bank accounts are allowed");
            means.push({ kind: k, acctCode: acct, amount: amt });
          }
        });
        const meansTotal = round2(means.reduce((s, m) => s + m.amount, 0));
        if (Math.abs(meansTotal - tot.pay) >= 0.01) throw new Error("Payment Means total (" + payFmt(meansTotal) + ") must equal Total Payment (" + payFmt(tot.pay) + ")");
        // Content
        const applied = [];
        document.querySelectorAll("." + p + "-app").forEach(i => {
          const amt = payNum(i.value);
          if (amt > 0) applied.push({ docId: i.dataset.id, src: i.dataset.src, docType: i.dataset.type, docNo: i.dataset.docno, sumApplied: amt, docRate: parseFloat(i.dataset.rate) || 1 });
        });
        const accLines = type === "A" ? payAcctLines[p].filter(l => l.acctCode && payNum(l.amount) > 0).map(l => {
          const a = accounts.find(x => x.companyId === companyId && x.acctCode === l.acctCode);
          return { acctCode: l.acctCode, acctName: a ? a.acctName : "", amount: payNum(l.amount), project: l.project || null, department: l.department || null, branch: l.branch || null };
        }) : [];
        if (type === "A" && payAcctLines[p].some(l => (l.acctCode && !(payNum(l.amount) > 0)) || (!l.acctCode && payNum(l.amount) > 0))) throw new Error("Each G/L line needs an account and an amount");
        if (type === "A" && !accLines.length) throw new Error("Add at least one G/L account line");

        // Journal (always in local currency)
        const r = fx.rate;
        const ctlKey = type === "S" ? "AP_CONTROL" : "AR_CONTROL";
        const jl = [];
        const meansLines = means.map(m => ({ acctCode: m.acctCode, amt: round2(m.amount * r), memo: (m.kind === "cash" ? "Cash" : m.kind === "check" ? "Check" : "Transfer") + " " + (cardCode || "") }));
        const sideMeans = p === "in" ? "debit" : "credit", sideOther = p === "in" ? "credit" : "debit";
        meansLines.forEach(m => jl.push({ acctCode: m.acctCode, debit: 0, credit: 0, [sideMeans]: m.amt, lineMemo: m.memo }));
        if (type === "A") {
          accLines.forEach(l => jl.push({ acctCode: l.acctCode, debit: 0, credit: 0, [sideOther]: round2(l.amount * r), lineMemo: "Payment G/L", project: l.project, department: l.department, branch: l.branch }));
        } else {
          const ctl = getMap(companyId, ctlKey);
          if (!ctl) throw new Error("Map " + ctlKey + " in Account Determination first");
          jl.push({ acctCode: ctl, debit: 0, credit: 0, [sideOther]: tot.local, lineMemo: (type === "S" ? "AP " : "AR ") + cardCode });
        }
        const dr = round2(jl.reduce((s, l) => s + l.debit, 0)), cr = round2(jl.reduce((s, l) => s + l.credit, 0));
        const plug = round2(dr - cr);
        if (Math.abs(plug) > 0.01) {
          // plug>0 means credits are short => gain; otherwise loss
          const fxAcct = (plug > 0 ? getMap(companyId, "FX_GAIN") : getMap(companyId, "FX_LOSS")) || getMap(companyId, "FX_DIFF");
          if (!fxAcct) throw new Error("Exchange-rate difference of " + payFmt(Math.abs(plug)) + ". Map FX_GAIN / FX_LOSS (Exchange Rate Gain/Loss) in Account Determination, or adjust the rate");
          jl.push({ acctCode: fxAcct, debit: plug < 0 ? -plug : 0, credit: plug > 0 ? plug : 0, lineMemo: "Exchange rate difference" });
        }
        const docNo = await payEnsureSeries(companyId, cfg.series);
        const data = {
          companyId, docNo, direction: p, docType: type, cardCode, cardName, bpCode: cardCode,
          docDate, taxDate: payEl(p, "docdate").value || docDate,
          docCurrency: fx.cur, docRate: fx.rate,
          cashSum: payNum(payEl(p, "cashsum").value), checkSum: payNum(payEl(p, "checksum").value), trsfrSum: payNum(payEl(p, "trsfrsum").value),
          docTotal: tot.pay, docTotalLC: tot.local, amount: tot.pay,
          means, applied, accLines, onAccount: tot.onAcct || 0,
          cashAcct: payEl(p, "cashacct").value || null, checkAcct: payEl(p, "checkacct").value || null, trsfrAcct: payEl(p, "trsfracct").value || null,
          checkNo: payEl(p, "checkno").value || null, checkDate: payEl(p, "checkdate").value || null,
          trsfrDate: payEl(p, "trsfrdate").value || null, trsfrRef: payEl(p, "trsfrref").value || null,
          branchCode: payEl(p, "branch").value || null, project: payEl(p, "project").value || null,
          comments: payEl(p, "remarks").value.trim() || null, jrnlMemo: payEl(p, "jrnl").value.trim() || null,
          status: "posted", createdBy: currentUser.email, createdAt: new Date().toISOString()
        };
        const je = await postJournalEntry(companyId, {
          refDate: docDate, memo: data.jrnlMemo || (cfg.title + " " + docNo + (r !== 1 ? " (" + fx.cur + " @" + r + ")" : "")),
          lines: jl, sourceType: cfg.series, sourceDoc: docNo
        });
        data.journalNo = je.transId;
        const ref = await db.collection("payments").add(data);
        payments.unshift({ id: ref.id, ...data });

        // Update settled documents: paid amount; CLOSE when fully paid
        for (const a of applied) {
          const arr = a.src === "sales" ? salesDocs : purchaseDocs, coll = a.src === "sales" ? "sales_docs" : "purchase_docs";
          const doc = arr.find(x => x.id === a.docId);
          if (!doc) continue;
          const paid = round2((parseFloat(doc.paidAmount) || 0) + a.sumApplied);
          const fullyPaid = paid + 0.005 >= (parseFloat(doc.grandTotal) || 0);
          const payload = { paidAmount: paid, status: fullyPaid ? "closed" : "open", paidAt: fullyPaid ? new Date().toISOString() : null };
          if (fullyPaid) { payload.closedAt = new Date().toISOString(); payload.closedReason = "Fully paid by " + docNo; }
          await db.collection(coll).doc(doc.id).update(payload);
          Object.assign(doc, payload);
          // a fully paid Down Payment Invoice also closes its Down Payment Request
          if (fullyPaid && (doc.docType === "DPI" || doc.docType === "PDPI") && doc.baseDocId) {
            const base = arr.find(x => x.id === doc.baseDocId);
            if (base && (base.docType === "DPR" || base.docType === "PDPR") && base.status !== "closed" && base.status !== "cancelled") {
              await db.collection(coll).doc(base.id).update({ status: "closed", closedAt: new Date().toISOString(), closedReason: "Down payment paid " + docNo });
              base.status = "closed";
            }
          }
        }
        toast("Posted " + docNo + " / JE " + data.journalNo, true);
        isPosting = false;
        const page = document.getElementById("main");
        if (p === "in") renderPayments(page); else renderOutgoing(page);
        if (andNew) startNewPay(p);
      } catch (e) {
        isPosting = false;
        toast(e.message || String(e));
      }
    }

    function viewPayment(id) {
      const x = payments.find(y => y.id === id);
      if (!x) return toast("Not found");
      const dirLbl = x.direction === "out" || x.docType === "OUT" ? "Outgoing Payment" : "Incoming Payment";
      const rows = (x.applied || []).map(a => `<tr><td>${esc(PAY_DOC_LABEL[a.docType] || a.docType || "")}</td><td>${esc(a.docNo)}</td><td style="text-align:right">${payFmt(a.sumApplied)}</td></tr>`).join("")
        + (x.accLines || []).map(a => `<tr><td>${esc(a.acctCode)}</td><td>${esc(a.acctName||"")} ${esc([a.project,a.department,a.branch].filter(Boolean).join(" / "))}</td><td style="text-align:right">${payFmt(a.amount)}</td></tr>`).join("");
      const body = `<div style="padding:12px;font-size:13px;line-height:1.6">
        <div><b>${dirLbl} ${esc(x.docNo)}</b> — ${esc(x.docDate||"")}</div>
        <div>${esc(x.cardCode||"")} ${esc(x.cardName||"")}</div>
        <div>Currency: <b>${esc(x.docCurrency||"")}</b> &nbsp; Rate: <b>${x.docRate||1}</b></div>

    async function saveAccount() {
      const companyId = currentUser.isSuperAdmin ? document.getElementById("a-co").value : currentUser.companyId;
      const data = {
        companyId,
        acctCode: document.getElementById("a-code").value.trim(),
        acctName: document.getElementById("a-name").value.trim(),
        category: document.getElementById("a-cat").value,
        postable: document.getElementById("a-post").value,
        level: parseInt(document.getElementById("a-level").value,10)||1,
        fatherNum: document.getElementById("a-parent").value || null,
        currency: document.getElementById("a-cur").value.trim()||"TZS",
        externalCode: document.getElementById("a-ext").value.trim()||null,
        cashAccount: document.getElementById("a-cash").value,
        controlAccount: document.getElementById("a-ctrl").value,
        status: document.getElementById("a-status").value,
        isActive: true,
      };
      if (!companyId || !data.acctCode || !data.acctName) return toast("Code and Name are required");
      try {
        if (editingAcctId) {
          await db.collection("accounts").doc(editingAcctId).update({ ...data, updatedAt: new Date().toISOString() });
          const idx = accounts.findIndex(a=>a.id===editingAcctId);
          if (idx>=0) accounts[idx] = { ...accounts[idx], ...data };
          toast("Updated", true);
        } else {
          if (accounts.some(a=>a.companyId===companyId && a.acctCode===data.acctCode)) return toast("Account code exists");
          data.createdAt = new Date().toISOString();
          const ref = await db.collection("accounts").add(data);
          accounts.push({ id: ref.id, ...data });
          toast("Saved", true);
        }
        editingAcctId = null;
        renderCOA(document.getElementById("main"));
      } catch(e) { toast(e.message); }
    }

      await db.collection("accounts").doc(id).delete();

    async function deleteSelectedAccounts() {
      if (!canDelete()) return toast("Not authorized to delete");
      const ids = [...document.querySelectorAll(".acct-check:checked")].map(c=>c.dataset.id);

    async function saveExchangeRate() {

    function getRate(currency, date) {
      const cid = companyFilterId();
      const list = scoped(exchangeRates, cid).filter(r => r.currency === currency);
      if (!list.length) return null;
      const onDate = list.filter(r => r.rateDate <= (date || "9999"));
      const best = (onDate.length ? onDate : list).sort((a,b)=>(b.rateDate||"").localeCompare(a.rateDate||""))[0];
      return best ? parseFloat(best.rate) : null;
    }
    function promptRate(currency, date) {
      const existing = getRate(currency, date);
      if (existing) return existing;
      const input = prompt("Enter rate for 1 " + currency + " in local currency:", "1");
      const rate = parseFloat(input);
      return rate > 0 ? rate : 1;
    }

    async function seedDefaultTaxCodes() {
      const cid = activeCompanyId || companyFilterId();
      if (!cid) return toast("Company required");
      const defs = [
        { code: "X1", name: "Standard Output VAT", rate: 18, taxType: "OUTPUT" },
        { code: "X0", name: "Exempt", rate: 0, taxType: "EXEMPT" },
        { code: "I1", name: "Standard Input VAT", rate: 18, taxType: "INPUT" },
      ];
      let added = 0;
      for (const d of defs) {
        if (taxCodes.some(x => x.companyId === cid && x.code === d.code)) continue;
        const data = { companyId: cid, ...d, acctCode: null, isActive: true, createdAt: new Date().toISOString() };
        const ref = await db.collection("tax_codes").add(data);
        taxCodes.push({ id: ref.id, ...data });
        added++;
      }
      // Auto-map VAT G/L accounts (only when missing and the account exists)
      const findVat = (cands, nameRe) => {
        const mine = accounts.filter(a => a.companyId === cid && a.postable !== "Title");
        for (const c of cands) if (mine.some(a => a.acctCode === c)) return c;
        const hit = mine.find(a => nameRe.test(a.acctName || ""));
        return hit ? hit.acctCode : null;
      };
      const vatOut = findVat(["207000", "222100"], /vat.*(payable|output)|output.*vat/i);
      const vatIn = findVat(["143030", "122400"], /vat.*(receivable|input)|input.*vat/i);
      const vatMaps = [["VAT_OUTPUT", vatOut], ["VAT_INPUT", vatIn]];
      let mapped = 0;
      for (const [mapKey, acctCode] of vatMaps) {
        const ex = accountMaps.find(m => m.companyId === cid && m.mapKey === mapKey);
        if (ex && ex.acctCode) continue;
        if (!acctCode) continue;
        if (ex) { await db.collection("account_maps").doc(ex.id).update({ acctCode }); ex.acctCode = acctCode; }
        else {
          const data = { companyId: cid, mapKey, acctCode };
          const ref = await db.collection("account_maps").add(data);
          accountMaps.push({ id: ref.id, ...data });
        }
        mapped++;
      }
      // Link tax codes to their VAT accounts when empty
      for (const t of taxCodes.filter(x => x.companyId === cid && !x.acctCode && x.id)) {
        const ty = (t.taxType || "").toUpperCase();
        const ac = ty === "OUTPUT" ? vatOut : ty === "INPUT" ? vatIn : null;
        if (ac && accounts.some(a => a.companyId === cid && a.acctCode === ac)) {
          await db.collection("tax_codes").doc(t.id).update({ acctCode: ac });
          t.acctCode = ac;
        }
      }
      toast("Seeded " + added + " tax codes" + (mapped ? ", mapped " + mapped + " VAT accounts" : ""), true);
      renderTaxCodes(document.getElementById("main"));
    }

    async function postJournalEntry(companyId, { refDate, memo, lines, sourceType, sourceDoc }) {
      const balanced = Math.abs(
        lines.reduce((s,l)=>s+(parseFloat(l.debit)||0),0) -
        lines.reduce((s,l)=>s+(parseFloat(l.credit)||0),0)
      ) < 0.01;
      if (!balanced) throw new Error("Journal not balanced");
      const postableLines = lines.filter(l => l.acctCode && ((parseFloat(l.debit)||0) > 0 || (parseFloat(l.credit)||0) > 0));
      for (const l of postableLines) {
        const acct = accounts.find(a => a.companyId === companyId && a.acctCode === l.acctCode);
        if (!acct) throw new Error("Account not found: " + l.acctCode);
        if (acct.postable === "Title") throw new Error("Cannot post to title account: " + l.acctCode);
      }
      const transId = await nextJournalNo(companyId);
      const data = {
        companyId, transId, refDate, memo: memo||null, lines: postableLines,
        sourceType: sourceType||"Manual", sourceDoc: sourceDoc||null,
        status: "posted", createdBy: currentUser.email, createdAt: new Date().toISOString(),
        locTotal: postableLines.reduce((s,l)=>s+(parseFloat(l.debit)||0),0),
      };
      const ref = await db.collection("journals").add(data);
      journals.unshift({ id: ref.id, ...data });
      return data;
    }

      if (!companyId || !code || !name) return toast("Code and Name are required");

      if (currencies.some(c => c.companyId===companyId && c.code===code)) return toast("Currency exists");

        for (const c of currencies.filter(x => x.companyId===companyId && x.isDefault)) {

          c.isDefault = false;

    async function saveProdOrder() {
      const cid = companyFilterId();
      const itemCode = document.getElementById("po-item").value;
      const qty = parseFloat(document.getElementById("po-qty").value) || 1;
      const whsCode = document.getElementById("po-wh").value;
      const dueDate = document.getElementById("po-due").value;
      if (!cid || !itemCode) return toast("Item required");
      const orderNo = "PO-" + Date.now().toString().slice(-6);
      // Collect components
      let components = [];
      if (document.getElementById("po-type").value === "special") {
        document.querySelectorAll("#po-special-rows tr").forEach(tr => {
          const code = tr.querySelector(".po-comp-code") && tr.querySelector(".po-comp-code").value;
          const q = parseFloat(tr.querySelector(".po-comp-qty") && tr.querySelector(".po-comp-qty").value) || 1;
          if (code) components.push({ compCode: code, qty: q });
        });
      } else {
        components = prodComponents;
      }
      const data = { companyId: cid, orderNo, itemCode, qty, whsCode, dueDate, prodType: document.getElementById("po-type").value, components, status: "planned", createdAt: new Date().toISOString() };
      const ref = await db.collection("prod_orders").add(data);
      prodOrders.push({ id: ref.id, ...data });
      toast("Production Order " + orderNo + " created", true);
      renderProdOrder(document.getElementById("main"));
    }
    async function completeProdOrder(id) {
      const po = prodOrders.find(x => x.id === id);
      if (!po) return;
      const cid = po.companyId;
      const wh = po.whsCode || "MAIN";
      // Issue components (stock out)
      const components = po.components || [];
      for (const c of components) {
        const outDoc = { companyId: cid, docType: "OUT", docDate: new Date().toISOString().slice(0,10), warehouseCode: c.whsCode || wh, lines: [{ itemCode: c.compCode, qty: c.qty, name: "" }], remarks: "Production " + po.orderNo, status: "posted", createdAt: new Date().toISOString() };
        const ref = await db.collection("stock_docs").add(outDoc);
        stockDocs.unshift({ id: ref.id, ...outDoc });
      }
      // Receive finished goods (stock in)
      const inDoc = { companyId: cid, docType: "IN", docDate: new Date().toISOString().slice(0,10), warehouseCode: wh, lines: [{ itemCode: po.itemCode, qty: po.qty, name: "" }], remarks: "Production " + po.orderNo, status: "posted", createdAt: new Date().toISOString() };
      const refIn = await db.collection("stock_docs").add(inDoc);
      stockDocs.unshift({ id: refIn.id, ...inDoc });
      // Update order status
      await db.collection("prod_orders").doc(id).update({ status: "closed", completedAt: new Date().toISOString() });
      po.status = "closed";
      toast("Completed — stock updated", true);
      renderProdOrder(document.getElementById("main"));
    }

    }

    async function saveAsset() {

      const assetCode = document.getElementById("asset-code").value.trim().toUpperCase();

      const cost = parseFloat(document.getElementById("asset-cost").value) || 0;
      if (!cid || !assetCode || !name) return toast("Code and Name required");

      if (editId) {
        await db.collection("assets").doc(editId).update(data);
        const idx = assets.findIndex(x => x.id === editId);
        if (idx >= 0) assets[idx] = { ...assets[idx], ...data };
        delete document.getElementById("asset-code").dataset.editId;

        assets.push({ id: ref.id, ...data });

      const period = (document.getElementById("pay-period")||{}).value || "";
      const payDate = (document.getElementById("pay-date")||{}).value || "";
      const lines = emps.map(e=>{
        const basic = parseFloat(e.basicPay||e.salary||0) || 0;
        const allow = parseFloat(e.allowances||0) || 0;
        const ded = parseFloat(e.deductions||0) || 0;
        return { code:e.employeeCode, name:e.fullName||e.employeeCode, basic, allow, ded, net: basic+allow-ded };
      });
      const totalNet = lines.reduce((s,l)=>s+l.net,0);
      const run = { companyId:cid, period, payDate, lines, totalNet, createdAt:new Date().toISOString() };
      window.payrollRuns = window.payrollRuns||[];
      window.payrollRuns.unshift(run);
      toast("Payroll calculated for "+lines.length+" employees", true);
      renderPayroll(document.getElementById("main"));
      viewPayrollRun(0);

      partners = keep(partners); items = keep(items); branches = keep(branches); employees = keep(employees);
      accounts = keep(accounts); accountMaps = keep(accountMaps); warehouses = keep(warehouses);

      const canUsers = hasAuth("admin.users", 2);

    async function setSubjectAuth(userId, key, val) {
      const u = users.find(x => x.id === userId);
      if (!u) return;
      const authMap = { ...(u.authMap || {}) };
      authMap[key] = parseInt(val, 10) || 0;
      // derive action flags
      const canDelete = (authMap["act.delete"] || 0) >= 2;
      const canCancel = (authMap["act.cancel"] || 0) >= 2;
      const canClose = (authMap["act.close"] || 0) >= 2;
      await db.collection("users").doc(userId).update({ authMap, canDelete, canCancel, canClose });
      u.authMap = authMap;
      u.canDelete = canDelete;
      u.canCancel = canCancel;
      u.canClose = canClose;
      toast("Updated", true);
      renderAuthorizations(document.getElementById("main"));
    }
    async function setModuleAuth(userId, modName, val) {
      if (val === "") return;
      const mod = AUTH_SUBJECTS.find(m => m.mod === modName);
      if (!mod) return;
      const u = users.find(x => x.id === userId);
      if (!u) return;
      const authMap = { ...(u.authMap || {}) };
      const level = parseInt(val, 10) || 0;
      mod.items.forEach(([key]) => { authMap[key] = level; });
      const canDelete = (authMap["act.delete"] || 0) >= 2;
      const canCancel = (authMap["act.cancel"] || 0) >= 2;
      const canClose = (authMap["act.close"] || 0) >= 2;
      await db.collection("users").doc(userId).update({ authMap, canDelete, canCancel, canClose });
      u.authMap = authMap;
      u.canDelete = canDelete; u.canCancel = canCancel; u.canClose = canClose;
      toast(modName + " → " + authLevelLabel(level), true);
      renderAuthorizations(document.getElementById("main"));
    }
    async function setAllAuthForUser(level) {
      if (!authSelectedUserId) return;
      const u = users.find(x => x.id === authSelectedUserId);
      if (!u) return;
      const authMap = {};
      AUTH_SUBJECTS.forEach(mod => mod.items.forEach(([key]) => { authMap[key] = level; }));
      const canDelete = level >= 2;
      await db.collection("users").doc(u.id).update({
        authMap, canDelete: canDelete, canCancel: canDelete, canClose: canDelete
      });

      u.canDelete = canDelete; u.canCancel = canDelete; u.canClose = canDelete;
      toast(authLevelLabel(level) + " applied", true);
      renderAuthorizations(document.getElementById("main"));
    }

      ];

      const report = [];
      try {
        for (const col of cols) {
          let docs = [];
          try {
            const snap = await db.collection(col).where("companyId", "==", id).get();
            docs = snap.docs;
          } catch (qe) {
            // Fallback: full scan (no index / type mismatch)
            const all = await db.collection(col).get();

            docs = all.docs.filter(d => {
              const cid = d.data().companyId;
