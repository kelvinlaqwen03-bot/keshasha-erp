<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KESHASHA ERP</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #eef1f6; --panel: #fff; --border: #c5cdd8; --primary: #0b3d91;
      --primary-d: #072a66; --text: #1a1a2e; --muted: #667085; --hover: #eef3fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
    #login-view {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
    }
    .login-box {
      background: var(--panel); border: 1px solid var(--border); width: 380px; padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(11,61,145,.12);
    }
    .login-box h1 { color: var(--primary); font-size: 1.5rem; letter-spacing: 1px; }
    .login-box .sub { color: var(--muted); font-size: 12px; margin: 4px 0 18px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    input, select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); margin-bottom: 10px; font-size: 13px;
    }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 12px; border: 1px solid var(--border); background: #fff; cursor: pointer;
      font-size: 12.5px; font-weight: 600;
    }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-d); }
    .btn-sm { padding: 4px 9px; font-size: 12px; }
    .btn-danger { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .err { color: #b91c1c; font-size: 12px; margin-top: 6px; }
    .hint { color: var(--muted); font-size: 11px; margin-top: 8px; line-height: 1.4; }

    #app-view { display: none; min-height: 100vh; }
    .topbar {
      background: var(--primary); color: #fff; padding: 8px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .topbar strong { font-size: 15px; letter-spacing: .6px; }
    .badge { background: rgba(255,255,255,.2); padding: 2px 7px; font-size: 11px; margin-left: 6px; }
    .layout { display: flex; min-height: calc(100vh - 42px); }
    .sidebar { width: 168px; background: #1e293b; flex-shrink: 0; padding: 6px 0; }
    .sidebar button {
      display: block; width: 100%; text-align: left; border: 0; background: none;
      color: #cbd5e1; padding: 9px 14px; cursor: pointer; font-size: 13px;
    }
    .sidebar button:hover, .sidebar button.active { background: var(--primary); color: #fff; }
    .main { flex: 1; padding: 10px 14px; overflow: auto; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .toolbar h2 { font-size: 15px; color: var(--primary); margin-right: auto; }

    /* Dense SAP/Excel-style grid */
    .grid-wrap { border: 1px solid var(--border); background: var(--panel); overflow: auto; max-height: calc(100vh - 160px); }
    table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.grid th {
      background: #e8eef7; border: 1px solid var(--border); padding: 5px 8px;
      text-align: left; font-weight: 700; position: sticky; top: 0; z-index: 1; white-space: nowrap;
    }
    table.grid td { border: 1px solid var(--border); padding: 3px 8px; }
    table.grid tr:hover td { background: var(--hover); }
    .form-bar {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 10px;
      background: var(--panel); border: 1px solid var(--border); padding: 8px 10px; margin-bottom: 8px;
    }
    .form-bar .fg label { margin-bottom: 2px; }
    .form-bar .fg input, .form-bar .fg select { margin-bottom: 0; padding: 6px 8px; }
    .toast {
      position: fixed; bottom: 16px; right: 16px; background: #0f172a; color: #fff;
      padding: 10px 14px; font-size: 13px; display: none; z-index: 99; max-width: 320px;
    }
    .toast.show { display: block; }
    .toast.ok { background: #166534; }
    .toast.err { background: #991b1b; }
    table.grid th { position: relative; }
    table.grid th .col-resizer {
      position: absolute; right: 0; top: 0; width: 5px; height: 100%; cursor: col-resize;
      user-select: none; z-index: 2;
    }
    table.grid th .col-resizer:hover { background: rgba(11,61,145,.35); }
    .mkt-hd {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 48px;
      padding: 12px 14px;
      background: #f5f5f5;
      border: 1px solid #b0b0b0;
      margin-bottom: 0;
    }
    .mkt-hd .mkt-col {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 6px 10px;
      align-items: center;
    }
    .mkt-hd .mkt-col label {
      font-size: 12px;
      font-weight: 600;
      color: #333;
      text-transform: none;
      margin: 0;
    }
    .mkt-hd .mkt-col input,
    .mkt-hd .mkt-col select {
      margin: 0;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #999;
      background: #fffef0;
      width: 100%;
      max-width: 280px;
    }
    .mkt-hd .mkt-col input[readonly] {
      background: #e8e8e8;
      color: #333;
    }
    .mkt-spacer {
      height: 2.25in;
      min-height: 120px;
      max-height: 2.5in;
      border-bottom: 1px dashed #ccc;
      margin: 0 0 8px 0;
      background: linear-gradient(180deg, #fafafa 0%, #fff 100%);
    }
    .mkt-tabs {
      display: flex; gap: 0; background: #dcdcdc; border-bottom: 1px solid #aaa;
      padding: 0 8px; margin: 0;
    }
    .mkt-tabs button {
      border: 1px solid transparent; border-bottom: 0; background: transparent;
      padding: 7px 16px; font-size: 12px; cursor: pointer; margin-bottom: -1px;
    }
    .mkt-tabs button.on {
      background: #f5f5f5; border-color: #aaa; border-bottom-color: #f5f5f5; font-weight: 600;
    }
    .mkt-ft {
      display: grid; grid-template-columns: 1fr 260px; gap: 16px;
      padding: 10px 14px; background: #f5f5f5; border-top: 1px solid #ccc;
    }
    .mkt-ft .mkt-col { display: grid; grid-template-columns: 110px 1fr; gap: 4px 8px; align-items: center; }
    .mkt-ft label { font-size: 12px; font-weight: 600; margin: 0; text-transform: none; }
    .mkt-ft input, .mkt-ft select { margin: 0; padding: 3px 6px; font-size: 12px; border: 1px solid #999; background: #fffef0; }
    .mkt-ft .totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12px; align-items: center; }
    .mkt-ft .totals b { text-align: right; min-width: 100px; }
    .mkt-lines-label {
      font-size: 12px;
      font-weight: 700;
      color: #0b3d91;
      padding: 4px 8px 6px;
      border-bottom: 2px solid #0b3d91;
      margin-bottom: 4px;
    }

    label.sc-lab {
      display: flex !important; align-items: center; gap: 8px; margin: 4px 0 !important;
      font-size: 12px; font-weight: 500; text-transform: none; line-height: 1.2;
    }
    label.sc-lab input[type="checkbox"] {
      margin: 0; width: 14px; height: 14px; flex-shrink: 0; vertical-align: middle;
      position: relative; top: 0;
    }



    .win-layer { position:fixed; inset:0; pointer-events:none; z-index:80; }
    .doc-win {
      pointer-events:auto; position:absolute; background:#fff; border:1px solid #94a3b8;
      box-shadow:0 12px 40px rgba(0,0,0,.25); display:flex; flex-direction:column;
      min-width:480px; min-height:280px;
    }
    .doc-win.maximized { left:8px !important; top:8px !important; right:8px; bottom:8px; width:auto !important; height:auto !important; }
    .doc-win.minimized { height:36px !important; min-height:36px; width:280px !important; overflow:hidden; }
    .doc-win-hd {
      background:linear-gradient(180deg,#4a6fa5,#3d5a80); color:#fff; padding:6px 8px;
      display:flex; align-items:center; justify-content:space-between; cursor:move; font-size:13px; font-weight:600;
    }
    .doc-win-hd .win-btns button {
      background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff;
      width:26px; height:22px; margin-left:4px; cursor:pointer; font-size:12px; line-height:1;
    }
    .doc-win-bd { flex:1; overflow:auto; padding:8px; background:#f0f0f0; }
    .sap-form { background:#e8e8e8; border:1px solid #b0b0b0; }
    .sap-form .sap-hd {
      display:grid; grid-template-columns:1fr 1fr; gap:8px 24px; padding:10px 12px; background:#f5f5f5; border-bottom:1px solid #ccc;
    }
    .sap-form .sap-hd .col { display:grid; grid-template-columns:120px 1fr; gap:4px 8px; align-items:center; }
    .sap-form .sap-hd label { font-size:12px; color:#333; text-transform:none; font-weight:500; }
    .sap-form .sap-hd input, .sap-form .sap-hd select { margin:0; padding:3px 6px; font-size:12px; border:1px solid #999; background:#fffef0; }
    .sap-tabs { display:flex; gap:0; background:#dcdcdc; border-bottom:1px solid #aaa; padding:0 8px; }
    .sap-tabs button {
      border:1px solid transparent; border-bottom:0; background:transparent; padding:6px 14px;
      font-size:12px; cursor:pointer; margin-bottom:-1px;
    }
    .sap-tabs button.on { background:#f5f5f5; border-color:#aaa; border-bottom-color:#f5f5f5; font-weight:600; }
    .sap-grid-wrap { overflow:auto; max-height:280px; background:#fff; border:1px solid #aaa; margin:6px; }
    .sap-grid-wrap table { font-size:11.5px; }
    .sap-grid-wrap th { background:#d4d0c8; position:sticky; top:0; white-space:nowrap; }
    .sap-ft {
      display:grid; grid-template-columns:1fr 280px; gap:12px; padding:8px 12px; background:#f5f5f5; border-top:1px solid #ccc;
    }
    .sap-ft .totals { display:grid; grid-template-columns:1fr auto; gap:4px 8px; font-size:12px; align-items:center; }
    .sap-ft .totals input { margin:0; padding:2px 6px; text-align:right; width:110px; }


    .win-layer { position:fixed; inset:0; pointer-events:none; z-index:80; }
    .win {
      pointer-events:auto; position:absolute; background:#fff; border:1px solid #94a3b8;
      box-shadow:0 12px 40px rgba(0,0,0,.25); display:flex; flex-direction:column;
      min-width:420px; min-height:280px; border-radius:4px 4px 0 0;
    }
    .win-title {
      background:#0b3d91; color:#fff; padding:6px 8px; font-size:12px; font-weight:600;
      display:flex; align-items:center; justify-content:space-between; cursor:move; user-select:none;
    }
    .win-title .win-btns { display:flex; gap:4px; }
    .win-title .win-btns button {
      border:0; background:rgba(255,255,255,.15); color:#fff; width:22px; height:20px;
      border-radius:2px; cursor:pointer; font-size:11px; line-height:1;
    }
    .win-title .win-btns button:hover { background:rgba(255,255,255,.3); }
    .win-body { flex:1; overflow:auto; padding:8px; background:#f4f6f9; }
    .win.minimized { height:32px !important; min-height:32px; width:220px !important; }
    .win.minimized .win-body { display:none; }
    .win.maximized { left:0 !important; top:0 !important; width:100% !important; height:100% !important; }
    .taskbar-wins {
      position:fixed; bottom:0; left:0; right:0; height:28px; background:#1e293b; z-index:90;
      display:flex; gap:4px; align-items:center; padding:0 8px; overflow-x:auto;
    }
    .taskbar-wins button {
      background:#334155; color:#e2e8f0; border:0; padding:2px 10px; font-size:11px;
      border-radius:3px 3px 0 0; cursor:pointer; white-space:nowrap;
    }
    .taskbar-wins button.active { background:#0b3d91; }


    .win-stack { position: fixed; inset: 0; pointer-events: none; z-index: 80; }
    .win {
      pointer-events: auto; position: absolute; background: #fff; border: 1px solid #94a3b8;
      box-shadow: 0 12px 40px rgba(0,0,0,.2); display: flex; flex-direction: column;
      min-width: 480px; min-height: 280px;
    }
    .win-hd {
      background: #0b3d91; color: #fff; padding: 6px 10px; display: flex; align-items: center;
      justify-content: space-between; cursor: move; user-select: none; font-size: 13px; font-weight: 600;
    }
    .win-hd .win-btns { display: flex; gap: 4px; }
    .win-hd .win-btns button {
      background: rgba(255,255,255,.15); border: 0; color: #fff; width: 28px; height: 22px;
      cursor: pointer; font-size: 12px; border-radius: 3px;
    }
    .win-hd .win-btns button:hover { background: rgba(255,255,255,.3); }
    .win-bd { flex: 1; overflow: auto; padding: 8px; background: #f8fafc; }
    .win.minimized { height: 36px !important; min-height: 36px; width: 260px !important; }
    .win.minimized .win-bd { display: none; }
    .win.maximized { left: 8px !important; top: 8px !important; right: 8px; bottom: 8px; width: auto !important; height: auto !important; }
    .menu .dropdown .sub {
      position: relative;
    }
    .menu .dropdown .sub > .subdrop {
      display: none; position: absolute; left: 100%; top: 0; min-width: 200px;
      background: #fff; border: 1px solid var(--border); box-shadow: 0 6px 16px rgba(0,0,0,.12);
    }
    .menu .dropdown .sub:hover > .subdrop { display: block; }
    .menu .dropdown .sub > button::after { content: " ▸"; float: right; opacity: .6; }



    .winbar {
      display:flex; gap:4px; padding:4px 8px; background:#e8eef7; border-bottom:1px solid var(--border);
      flex-wrap:wrap; min-height:32px; align-items:center;
    }
    .win-tab {
      display:inline-flex; align-items:center; gap:6px; padding:4px 10px; background:#fff;
      border:1px solid var(--border); border-radius:4px 4px 0 0; font-size:12px; cursor:pointer;
      max-width:200px;
    }
    .win-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .win-tab .x { opacity:.7; font-weight:700; padding:0 2px; }
    .win-tab .x:hover { opacity:1; }
    .workspace { position:relative; flex:1; overflow:auto; }
    .doc-window {
      position:absolute; background:#fff; border:1px solid #94a3b8; box-shadow:0 8px 28px rgba(0,0,0,.18);
      display:flex; flex-direction:column; min-width:320px; min-height:200px; z-index:20;
    }
    .doc-window.maximized { inset:0 !important; width:auto !important; height:auto !important; z-index:25; }
    .doc-window.minimized { display:none; }
    .doc-win-hd {
      background:#0b3d91; color:#fff; padding:6px 10px; display:flex; align-items:center; justify-content:space-between;
      cursor:move; user-select:none; font-size:13px; font-weight:600;
    }
    .doc-win-hd .btns button {
      background:transparent; border:1px solid rgba(255,255,255,.4); color:#fff; padding:0 8px;
      margin-left:4px; cursor:pointer; border-radius:3px; font-size:12px; line-height:20px;
    }
    .doc-win-bd { flex:1; overflow:auto; padding:0; background:var(--bg); }

    .modal-bg {
      display:none; position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:100;
      align-items:center; justify-content:center;
    }
    .modal-bg.show { display:flex; }
    .modal {
      background:#fff; border:1px solid var(--border); width:min(720px,94vw); max-height:90vh;
      overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,.2);
    }
    .modal-hd {
      background:#0b3d91; color:#fff; padding:10px 14px; font-weight:700; font-size:14px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .modal-bd { padding:12px 14px; }
    .modal-ft { padding:10px 14px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; }


    .menubar {
      background: #f3f4f6; border-bottom: 1px solid var(--border);
      display: flex; gap: 0; padding: 0 6px; font-size: 12.5px; user-select: none;
    }
    .menubar .menu {
      position: relative; padding: 6px 10px; cursor: pointer; color: #333;
    }
    .menubar .menu:hover { background: #e5e7eb; }
    .menubar .menu .dropdown {
      display: none; position: absolute; top: 100%; left: 0; min-width: 200px;
      background: #fff; border: 1px solid var(--border); box-shadow: 0 6px 16px rgba(0,0,0,.12); z-index: 50;
    }
    .menubar .menu:hover .dropdown { display: block; }
    .menubar .dropdown button {
      display: block; width: 100%; text-align: left; border: 0; background: none;
      padding: 7px 12px; font-size: 12.5px; cursor: pointer;
    }
    .menubar .dropdown button:hover { background: var(--hover); }

    .menubar .menu .dropdown .has-sub { position:relative; }
    .menubar .menu .dropdown .submenu {
      display:none; position:absolute; left:100%; top:0; min-width:200px;
      background:#fff; border:1px solid var(--border); box-shadow:0 6px 16px rgba(0,0,0,.12);
    }
    .menubar .menu .dropdown .has-sub:hover .submenu { display:block; }
    .menubar .menu .dropdown .has-sub > button::after { content:" ▸"; float:right; }

    .sidebar .mod-title {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; color: #94a3b8; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .4px; cursor: pointer;
    }
    .sidebar .mod-title:hover { color: #fff; }
    .sidebar .mod-children { display: none; }
    .sidebar .mod-children.open { display: block; }
    .sidebar .mod-children button { padding-left: 22px; font-size: 12.5px; }
    .sidebar .mod-title .chev { font-size: 10px; opacity: .7; }

  
    .progress-bar-wrap {
      position: fixed; bottom: 0; left: 0; right: 0; height: 28px;
      background: #1e293b; z-index: 9999; display: none; align-items: center;
      padding: 0 12px; gap: 10px; font-size: 12px; color: #fff;
    }
    .progress-bar-wrap.show { display: flex; }
    .progress-track {
      flex: 1; height: 8px; background: #334155; border-radius: 4px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: #22c55e; width: 0%; transition: width 0.15s;
    }
    .progress-text { min-width: 180px; white-space: nowrap; }
    </style>
</head>
<body>
  <div id="login-view">
    <div class="login-box">
      <div style="text-align:center;margin-bottom:12px">
        <img src="logo_full.jpg" alt="KESHASHA" style="max-width:220px;height:auto;display:block;margin:0 auto 8px" />
      </div>
      <div class="sub" style="text-align:center">Sign in to your company</div>
      <label>Company *</label>
      <select id="login-company" style="width:100%;margin:0 0 10px;padding:8px;border:1px solid var(--border);border-radius:6px">
        <option value="">— Select company —</option>
      </select>
      <label>Email</label>
      <input type="email" id="login-email" placeholder="user@company.com" />
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" />
      <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Sign in</button>
      <div class="err" id="login-err"></div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid #e5e7eb">
        <div style="font-size:11px;color:#64748b;margin-bottom:6px;text-align:center">Super Admin only</div>
        <button class="btn btn-sm" style="width:100%;margin-bottom:6px" onclick="loginCreateCompany()">+ Create company</button>
        <button class="btn btn-sm" style="width:100%;margin-bottom:6px" onclick="loginCreateUser()">+ Create company user</button>
        <button class="btn btn-sm" style="width:100%" onclick="firstSetup()">First setup (create Super Admin)</button>
      </div>
    </div>
  </div>

  <div id="app-view">
    <div id="setup-banner" style="display:none;background:#fef3c7;border-bottom:1px solid #f59e0b;padding:8px 14px;font-size:13px"></div>
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <img src="logo_icon.jpg" alt="" style="height:28px;width:auto;border-radius:4px;background:#fff;padding:2px" />
        <div>
          <strong>KESHASHA</strong><span class="badge" id="phase-badge">Phase 1</span>
          <span id="company-label" style="margin-left:10px;font-size:12px;opacity:.9"></span>
        </div>
      </div>
      <div style="font-size:12px">
        <span id="user-label"></span>
        <button class="btn btn-sm" style="margin-left:8px" onclick="doLogout()">Logout</button>
      </div>
    </div>
    <div class="menubar" id="menubar">
      <div class="menu">File
        <div class="dropdown">
          <button onclick="nav('companies')">Companies</button>
          <button onclick="doLogout()">Logout</button>
        </div>
      </div>
      <div class="menu">Modules
        <div class="dropdown">
          <div class="sub">
            <button type="button">Administration</button>
            <div class="subdrop">
              <button onclick="nav('companies')">Companies</button>
              <button onclick="nav('branches')">Branches</button>
              <button onclick="nav('users')">Users</button>
              <button onclick="nav('employees')">Employees</button>
              <button onclick="nav('salesemp')">Sales Employees</button>
              <button onclick="nav('dimtypes')">Dimension Types</button>
              <button onclick="nav('dimensions')">Dimension Values</button>
              <button onclick="nav('docseries')">Document Numbering</button>
              <button onclick="nav('itemseries')">Item Series</button>
              <button onclick="nav('authz')">Authorizations</button>

    function showProgress(pct, text) {
      const bar = document.getElementById("progress-bar");
      const fill = document.getElementById("progress-fill");
      const txt = document.getElementById("progress-text");
      const pctEl = document.getElementById("progress-pct");
      if (!bar) return;
      bar.classList.add("show");
      const p = Math.max(0, Math.min(100, pct || 0));
      if (fill) fill.style.width = p + "%";
      if (txt) txt.textContent = text || "Processing…";
      if (pctEl) pctEl.textContent = Math.round(p) + "%";
    }
    function hideProgress() {
      const bar = document.getElementById("progress-bar");
      if (bar) bar.classList.remove("show");
    }
    let __busy = false;
    function toast(msg, ok) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "toast show " + (ok ? "ok" : "err");
      setTimeout(() => t.className = "toast", 2800);
    }

    async function loadAll() {
      if (!db) throw new Error("Firebase config haijawekwa. Angalia index.html — firebaseConfig.");
      const [co, br, emp, se, us, dim, dimt, ds, it, wh, st, bp, pl, sd, pd, py, ac, jn, am, pg, cu, tc, er, isd] = await Promise.all([
        db.collection("companies").get(),
        db.collection("branches").get(),
        db.collection("employees").get(),
        db.collection("sales_employees").get(),
        db.collection("users").get(),
        db.collection("dimensions").get(),
        db.collection("dimension_types").get(),
        db.collection("doc_series").get(),
        db.collection("items").get(),
        db.collection("warehouses").get(),
        db.collection("stock_docs").get(),
        db.collection("partners").get(),
        db.collection("price_lists").get(),
        db.collection("sales_docs").get(),
        db.collection("purchase_docs").get(),
        db.collection("payments").get(),
        db.collection("accounts").get(),
        db.collection("journals").get(),
        db.collection("account_maps").get(),
        db.collection("partner_groups").get(),
        db.collection("currencies").get(),
        db.collection("exchange_rates").get(),
        db.collection("tax_codes").get(),
        db.collection("item_series").get(),
      ]);
      companies = co.docs.map(d => ({ id: d.id, ...d.data() }));
      branches = br.docs.map(d => ({ id: d.id, ...d.data() }));
      employees = emp.docs.map(d => ({ id: d.id, ...d.data() }));
      salesEmployees = se.docs.map(d => ({ id: d.id, ...d.data() }));
      users = us.docs.map(d => ({ id: d.id, ...d.data() }));
      dimensions = dim.docs.map(d => ({ id: d.id, ...d.data() }));
      dimensionTypes = dimt.docs.map(d => ({ id: d.id, ...d.data() }));
      docSeries = ds.docs.map(d => ({ id: d.id, ...d.data() }));
      items = it.docs.map(d => ({ id: d.id, ...d.data() }));
      warehouses = wh.docs.map(d => ({ id: d.id, ...d.data() }));
      stockDocs = st.docs.map(d => ({ id: d.id, ...d.data() }));
      partners = bp.docs.map(d => ({ id: d.id, ...d.data() }));
      priceLists = pl.docs.map(d => ({ id: d.id, ...d.data() }));
      salesDocs = sd.docs.map(d => ({ id: d.id, ...d.data() }));
      purchaseDocs = pd.docs.map(d => ({ id: d.id, ...d.data() }));
      payments = py.docs.map(d => ({ id: d.id, ...d.data() }));
      accounts = ac.docs.map(d => ({ id: d.id, ...d.data() }));
      journals = jn.docs.map(d => ({ id: d.id, ...d.data() }));
      accountMaps = am.docs.map(d => ({ id: d.id, ...d.data() }));
      partnerGroups = pg.docs.map(d => ({ id: d.id, ...d.data() }));
      currencies = cu.docs.map(d => ({ id: d.id, ...d.data() }));
      taxCodes = tc.docs.map(d => ({ id: d.id, ...d.data() }));
      exchangeRates = er.docs.map(d => ({ id: d.id, ...d.data() }));
      itemSeriesDefs = isd.docs.map(d => ({ id: d.id, ...d.data() }));
      try {
        const ut = await db.collection("ui_templates").get();
        uiTemplates = ut.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch(e) { uiTemplates = []; }
    }

    function scoped(list, companyId) {
      if (!companyId) return list;
      return list.filter(x => x.companyId === companyId);
    }

    // AUTH
    // ============================================================

    async function refreshLoginCompanies() {
      try {
        if (!CONFIG_READY) return;
        const snap = await db.collection("companies").get();
        companies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const sel = document.getElementById("login-company");
        if (!sel) return;
        const cur = sel.value;
        sel.innerHTML = `<option value="">— Select company —</option>` +
          companies.filter(c => c.isActive !== false)
            .map(c => `<option value="${c.id}">${esc(c.code)} — ${esc(c.name)}</option>`).join("");
        if (cur) sel.value = cur;
      } catch (e) { console.error(e); }
    }

    async function firstSetup() {
      if (!CONFIG_READY) {
        document.getElementById("login-err").textContent = "Set Firebase config in index.html first.";
        return;
      }
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const password = document.getElementById("login-password").value;
      const fullName = prompt("Super Admin full name:", "KESHASHA Admin") || "KESHASHA Admin";
      if (!email || !email.includes("@") || password.length < 4) {
        document.getElementById("login-err").textContent = "Valid email and password (min 4 characters)";
        return;
      }
      try {
        await loadAll();
        if (users.some(u => u.isSuperAdmin)) {
          document.getElementById("login-err").textContent = "Super Admin already exists. Please sign in.";
          return;
        }
        const ref = await db.collection("users").add({
          email, password, fullName, isSuperAdmin: true, companyId: null, isActive: true, createdAt: new Date().toISOString()
        });
        users.push({ id: ref.id, email, password, fullName, isSuperAdmin: true, companyId: null, isActive: true });
        toast("Super Admin created — create a company, then sign in", true);
        document.getElementById("login-err").textContent = "";
        await refreshLoginCompanies();
      } catch (e) {
        document.getElementById("login-err").textContent = e.message;
      }
    }

    async function loginCreateCompany() {
      document.getElementById("login-err").textContent = "";
      if (!CONFIG_READY) return;
      await loadAll();
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const password = document.getElementById("login-password").value;
      const admin = users.find(u => u.isSuperAdmin && u.email === email && u.password === password);
      if (!admin) {
        document.getElementById("login-err").textContent = "Enter Super Admin email & password first, then create company";
        return;
      }
      const code = (prompt("Company code:", "CO01") || "").trim().toUpperCase();
      const name = (prompt("Company name:", code) || "").trim();
      if (!code || !name) return;
      if (companies.some(c => c.code === code)) {
        document.getElementById("login-err").textContent = "Company code exists";
        return;
      }
      const data = { code, name, tin: null, currencyCode: "TZS", isActive: true, createdAt: new Date().toISOString() };
      const ref = await db.collection("companies").add(data);
      companies.push({ id: ref.id, ...data });
      // default HQ branch
      const br = { companyId: ref.id, code: "HQ", name: "Head Office", isHq: true, isActive: true };
      const bref = await db.collection("branches").add(br);
      branches.push({ id: bref.id, ...br });
      await refreshLoginCompanies();
      document.getElementById("login-company").value = ref.id;
      toast("Company " + code + " created — select it and sign in", true);
    }

    async function loginCreateUser() {
      document.getElementById("login-err").textContent = "";
      if (!CONFIG_READY) return;
      await loadAll();
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const password = document.getElementById("login-password").value;
      const admin = users.find(u => u.isSuperAdmin && u.email === email && u.password === password);
      if (!admin) {
        document.getElementById("login-err").textContent = "Enter Super Admin email & password first";
        return;
      }
      const companyId = document.getElementById("login-company").value;
      if (!companyId) {
        document.getElementById("login-err").textContent = "Select company for the new user";
        return;
      }
      const uEmail = (prompt("New user email:") || "").trim().toLowerCase();
      const uName = (prompt("Full name:") || "").trim();
      const uPass = (prompt("Password (min 4):") || "").trim();
      if (!uEmail.includes("@") || !uName || uPass.length < 4) {
        document.getElementById("login-err").textContent = "Valid email, name, password required";
        return;
      }
      if (users.some(u => u.email === uEmail)) {
        document.getElementById("login-err").textContent = "Email already exists";
        return;
      }
      const data = {
        email: uEmail, fullName: uName, password: uPass, companyId,
        isSuperAdmin: false, isActive: true, authMap: {},
        canDelete: false, canCancel: false, canClose: false,
        createdAt: new Date().toISOString()
      };
      const ref = await db.collection("users").add(data);
      users.push({ id: ref.id, ...data });
      toast("User created for selected company — they sign in with that company only", true);
    }

    async function doLogin() {
      document.getElementById("login-err").textContent = "";
      if (!CONFIG_READY) {
        document.getElementById("login-err").textContent = "Set Firebase config in index.html first.";
        return;
      }
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const password = document.getElementById("login-password").value;
      const companyId = document.getElementById("login-company").value;
      if (!companyId) {
        document.getElementById("login-err").textContent = "Select a company before signing in";
        return;
      }
      try {
        await loadAll();
        const co = companies.find(c => c.id === companyId);
        if (!co || co.isActive === false) {
          document.getElementById("login-err").textContent = "Invalid or inactive company";
          return;
        }
        const u = users.find(x => x.email === email && x.isActive !== false);
        if (!u || u.password !== password) {
          document.getElementById("login-err").textContent = "Incorrect email or password";
          return;
        }
        // Super Admin may enter any company; normal users only their company
        if (!u.isSuperAdmin) {
          if (u.companyId !== companyId) {
            document.getElementById("login-err").textContent = "This user cannot access the selected company";
            return;
          }
        }
        currentUser = u;
        activeCompanyId = companyId;
        localStorage.setItem(SESSION_KEY, JSON.stringify({ email, companyId }));
        showApp();
        toast("Welcome " + u.fullName + " · " + co.code, true);
      } catch (e) {
        document.getElementById("login-err").textContent = e.message;
      }
    }

    function doLogout() {
      currentUser = null;
      activeCompanyId = null;
      localStorage.removeItem(SESSION_KEY);
      document.getElementById("app-view").style.display = "none";
      document.getElementById("login-view").style.display = "flex";
      refreshLoginCompanies();
    }

    function checkAcctSetup() {
      const cid = activeCompanyId;
      if (!cid) return;
      const required = ["AR_CONTROL", "REVENUE", "COGS", "INVENTORY", "CASH"];
      const missing = required.filter(k => !getMap(cid, k));
      if (missing.length) {
        const el = document.getElementById("setup-banner");
        if (el) {
          el.style.display = "block";
          el.innerHTML = `<b>Setup required:</b> Account Determination missing for: ${missing.join(", ")}. 
            <button class="btn btn-sm" onclick="nav('acctmap')">Open Account Determination</button>`;
        }
      } else {
        const el = document.getElementById("setup-banner");
        if (el) el.style.display = "none";
      }
    }
    function showApp() {
      document.getElementById("login-view").style.display = "none";
      document.getElementById("app-view").style.display = "block";
      document.getElementById("user-label").textContent =
        currentUser.fullName + (currentUser.isSuperAdmin ? " · Super Admin" : "");
      const co = companies.find(c => c.id === currentUser.companyId);
      const ac = activeCompany();
      document.getElementById("company-label").textContent = ac
        ? ac.name + " (" + ac.code + ")"
        : (co ? co.name + " (" + co.code + ")" : "");
      // No in-app company switch — must logout and select another company at login
      const sw = document.getElementById("company-switch");
      if (sw) sw.remove();
      buildSidebar();
      checkAcctSetup();
      nav("companies");
    }

    async function importSalesEmployeesExcel(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const cid = activeCompanyId || companyFilterId();
      if (!cid) { toast("Company required"); input.value=""; return; }
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
        let added = 0, skipped = 0;
        showProgress(0, "Importing sales employees…");
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i];
          showProgress(Math.round(((i+1)/rows.length)*100), "Row " + (i+1));
          const code = String(r.code || r.Code || "").trim().toUpperCase();
          const name = String(r.name || r.Name || "").trim();
          if (!code || !name) { skipped++; continue; }
          if (salesEmployees.some(x => x.companyId === cid && x.code === code)) { skipped++; continue; }
          const data = { companyId: cid, code, name, isActive: true, createdAt: new Date().toISOString() };
          const ref = await db.collection("sales_employees").add(data);
          salesEmployees.push({ id: ref.id, ...data });
          added++;
        }
        hideProgress();
        toast("Imported " + added + " · Skipped " + skipped, true);
        renderSalesEmployees(document.getElementById("main"));
      } catch (e) { toast(e.message); hideProgress(); }
      input.value = "";
    }

      }

    }

    function filterEmp() {

          || (e.department||"").toLowerCase().includes(q) || (e.jobTitle||"").toLowerCase().includes(q)

    function openEmpForm(id) {
      editingEmpId = id || null;
      document.getElementById("emp-form").style.display = "block";
      document.getElementById("emp-edit-label").textContent = id ? "(edit)" : "(new)";
      const set = (i,v) => { const el = document.getElementById(i); if (el) el.value = v ?? ""; };
      if (!id) {
        ["emp-code","emp-first","emp-middle","emp-last","emp-name","emp-job","emp-position","emp-dept","emp-mobile","emp-office","emp-email","emp-govid","emp-manager","emp-remark"].forEach(i => set(i,""));
        set("emp-sex",""); set("emp-type","Permanent"); set("emp-status","active"); set("emp-branch","");
        set("emp-start",""); set("emp-birth","");
        return;
      }
      const e = employees.find(x => x.id === id); if (!e) return;
      set("emp-code", e.employeeCode); set("emp-first", e.firstName); set("emp-middle", e.middleName);
      set("emp-last", e.lastName); set("emp-name", e.fullName); set("emp-sex", e.sex||"");
      set("emp-job", e.jobTitle); set("emp-position", e.position); set("emp-dept", e.department);
      set("emp-branch", e.branchCode||""); set("emp-type", e.employeeType||"Permanent");
      set("emp-mobile", e.mobile); set("emp-office", e.officeTel); set("emp-email", e.email);
      set("emp-start", e.startDate||""); set("emp-birth", e.birthDate||"");
      set("emp-govid", e.govId); set("emp-manager", e.manager); set("emp-status", e.status||"active");
      set("emp-remark", e.remarks);
      if (currentUser.isSuperAdmin && document.getElementById("emp-co")) document.getElementById("emp-co").value = e.companyId;

    async function deleteSelectedEmployees() {
      if (__busy) return toast("Another operation is running");
      if (!canDelete() && !currentUser.isSuperAdmin) return toast("Not authorized to delete");
      const ids = [...document.querySelectorAll(".emp-check:checked")].map(c => c.dataset.id);
      if (!ids.length) return toast("Select rows first");
      if (!confirm("Delete " + ids.length + " employee(s)?")) return;
      __busy = true;
      showProgress(0, "Deleting…");
      try {
        for (let i = 0; i < ids.length; i++) {
          const id = ids[i];
          showProgress(Math.round(((i+1)/ids.length)*100), "Deleting " + (i+1) + "/" + ids.length);
          await db.collection("employees").doc(id).delete();
          employees = employees.filter(e => e.id !== id);
        }
        toast("Deleted " + ids.length, true);
        renderEmployees(document.getElementById("main"));
      } finally {
        __busy = false;
        hideProgress();
      }
    }
    async function deleteEmployee(id) {
      if (!canDelete() && !currentUser.isSuperAdmin) return toast("Not authorized to delete");
      const e = employees.find(x => x.id === id); if (!e) return;
      if (!confirm("Delete employee " + (e.employeeCode||"") + " — " + (e.fullName||"") + "?")) return;
      await db.collection("employees").doc(id).delete();
      employees = employees.filter(x => x.id !== id);
      toast("Deleted", true);
      renderEmployees(document.getElementById("main"));
    }
    function collectEmpForm() {
      const companyId = currentUser.isSuperAdmin ? document.getElementById("emp-co").value : currentUser.companyId;
      const firstName = document.getElementById("emp-first").value.trim();
      const middleName = document.getElementById("emp-middle").value.trim();
      const lastName = document.getElementById("emp-last").value.trim();
      let fullName = document.getElementById("emp-name").value.trim();
      if (!fullName) fullName = [firstName, middleName, lastName].filter(Boolean).join(" ");
      return {
        companyId,
        employeeCode: document.getElementById("emp-code").value.trim(),
        firstName: firstName || null,
        middleName: middleName || null,
        lastName: lastName || null,
        fullName,
        sex: document.getElementById("emp-sex").value || null,
        jobTitle: document.getElementById("emp-job").value.trim() || null,
        position: document.getElementById("emp-position").value.trim() || null,
        department: document.getElementById("emp-dept").value.trim() || null,
        branchCode: document.getElementById("emp-branch").value || null,
        employeeType: document.getElementById("emp-type").value || "Permanent",
        mobile: document.getElementById("emp-mobile").value.trim() || null,
        officeTel: document.getElementById("emp-office").value.trim() || null,
        email: document.getElementById("emp-email").value.trim() || null,
        startDate: document.getElementById("emp-start").value || null,
        birthDate: document.getElementById("emp-birth").value || null,
        govId: document.getElementById("emp-govid").value.trim() || null,
        manager: document.getElementById("emp-manager").value.trim() || null,
        status: document.getElementById("emp-status").value || "active",
        remarks: document.getElementById("emp-remark").value.trim() || null,
      };
    }
    async function saveEmployee() {
      const data = collectEmpForm();
      if (!data.companyId || !data.employeeCode || !data.fullName) return toast("Employee No. and Full Name are required");
      try {
        if (editingEmpId) {
          const other = employees.find(e => e.id !== editingEmpId && e.companyId===data.companyId && e.employeeCode===data.employeeCode);
          if (other) return toast("Employee No. exists");
          await db.collection("employees").doc(editingEmpId).update({ ...data, updatedAt: new Date().toISOString() });
          const idx = employees.findIndex(e => e.id === editingEmpId);
          if (idx >= 0) employees[idx] = { ...employees[idx], ...data };
          toast("Employee updated", true);
        } else {
          if (employees.some(e => e.companyId===data.companyId && e.employeeCode===data.employeeCode)) return toast("Employee No. exists");
          data.createdAt = new Date().toISOString();
          const ref = await db.collection("employees").add(data);
          employees.push({ id: ref.id, ...data });
          toast("Employee saved", true);
        }
        editingEmpId = null;
        renderEmployees(document.getElementById("main"));
      } catch (e) { toast(e.message); }
    }
    function downloadEmpTemplate() {
      const data = [[
        "empID","firstName","middleName","lastName","fullName","sex","jobTitle","position","dept","branch",
        "type","mobile","officeTel","email","startDate","birthDate","govID","manager","status","remark"
      ],[

      ]];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), "Employees");

      document.getElementById("u-form").style.display = "grid";
      document.getElementById("u-email").value = u.email || "";

    async function deleteUser(id) {
      if (!currentUser.isSuperAdmin && !canDelete()) return toast("Not authorized to delete");
      const u = users.find(x => x.id === id); if (!u || u.isSuperAdmin) return toast("Cannot delete this user");
      if (!confirm("Delete user " + u.email + "?")) return;
      await db.collection("users").doc(id).delete();
      users = users.filter(x => x.id !== id);
      toast("Deleted", true);
      renderUsers(document.getElementById("main"));
    }
    async function saveUser() {
      const email = document.getElementById("u-email").value.trim().toLowerCase();
      const fullName = document.getElementById("u-name").value.trim();
      const password = document.getElementById("u-pass").value.trim();
      if (!email || !fullName || password.length < 4) return toast("Email, name, password ≥4");
      let companyId = currentUser.companyId;
      if (currentUser.isSuperAdmin) {
        const sel = document.getElementById("u-co");
        companyId = sel.value || null;
      }
      const data = {
        email, fullName, password, companyId,
        isSuperAdmin: false, isActive: true,
        canDelete: !!(document.getElementById("u-del") && document.getElementById("u-del").value === "1"),
        canCancel: !!(document.getElementById("u-can") && document.getElementById("u-can").value === "1"),
        canClose: !!(document.getElementById("u-close") && document.getElementById("u-close").value === "1"),
      };
      if (editingUserId) {
        const other = users.find(u => u.email === email && u.id !== editingUserId);
        if (other) return toast("Email exists");
        await db.collection("users").doc(editingUserId).update(data);
        const idx = users.findIndex(x => x.id === editingUserId);
        if (idx >= 0) users[idx] = { ...users[idx], ...data };
        editingUserId = null;
        toast("Updated", true);
      } else {
        if (users.some(u => u.email === email)) return toast("Email exists");
        data.createdAt = new Date().toISOString();
        data.authMap = {};
        const ref = await db.collection("users").add(data);
        users.push({ id: ref.id, ...data });
        toast("User saved", true);
      }
      renderUsers(document.getElementById("main"));
    }

    async function updateUserPass(id, pass) {
      if (!pass || pass.length < 4) return toast("Password ≥4");
      await db.collection("users").doc(id).update({ password: pass });
      const u = users.find(x => x.id === id);
      if (u) u.password = pass;
      toast("Password updated", true);
    }

    async function deleteDimType(id) {
      if (!canDelete() && !currentUser.isSuperAdmin) return toast("Not authorized to delete");
      const d = dimensionTypes.find(x => x.id === id); if (!d) return;
      const used = dimensions.some(x => x.companyId === d.companyId && (x.dimType||"").toUpperCase() === (d.code||"").toUpperCase());
      if (used && !confirm("Type " + d.code + " still has values. Delete type only? Values remain but type list will not show it.")) return;

      if (!ids.length) return toast("Select rows first");

    async function saveDimType() {
      let companyId = currentUser.isSuperAdmin
        ? (document.getElementById("dt-co") && document.getElementById("dt-co").value)
        : currentUser.companyId;
      if (!companyId && currentUser.isSuperAdmin && companies[0]) companyId = companies[0].id;
      const code = document.getElementById("dt-code").value.trim().toUpperCase();
      const name = document.getElementById("dt-name").value.trim();
      const description = document.getElementById("dt-desc").value.trim() || null;
      if (!companyId || !code || !name) return toast("Company, Code and Name are required");
      const data = { companyId, code, name, description, isActive: true };
      if (editingDimTypeId) {
        await db.collection("dimension_types").doc(editingDimTypeId).update(data);
        const idx = dimensionTypes.findIndex(x => x.id === editingDimTypeId);
        if (idx >= 0) dimensionTypes[idx] = { ...dimensionTypes[idx], ...data };
        editingDimTypeId = null;
        toast("Updated", true);
      } else {
        if (dimensionTypes.some(t => t.companyId === companyId && t.code === code)) return toast("Type code exists");
        data.createdAt = new Date().toISOString();
        const ref = await db.collection("dimension_types").add(data);
        dimensionTypes.push({ id: ref.id, ...data });
        toast("Saved", true);
      }
      renderDimensionTypes(document.getElementById("main"));
    }
    async function seedDefaultDimTypes() {
      let cid = companyFilterId();
      if (!cid && currentUser.isSuperAdmin) {
        const sel = document.getElementById("dt-co");
        cid = (sel && sel.value) || (companies[0] && companies[0].id);
      }
      if (!cid && currentUser.isSuperAdmin && companies.length) {
        const code = prompt("Company code to seed dimensions for:", companies[0].code);
        const co = companies.find(c => c.code === (code||"").trim().toUpperCase() || c.id === code);
        cid = co ? co.id : companies[0].id;
      }
      if (!cid) return toast("Company required — Super Admin must pick a company");
      const seeds = [
        ["PROJECT", "Project", "Dim1 — Projects"],
        ["DEPARTMENT", "Department", "Dim2 — Departments"],
        ["BRANCH", "Branch", "Dim3 — Branches"],
        ["TEAM", "Team", "Dim4 — Teams"],
      ];
      let n = 0;
      for (const [code, name, description] of seeds) {
        if (dimensionTypes.some(t => t.companyId === cid && t.code === code)) continue;
        const data = { companyId: cid, code, name, description, isActive: true, createdAt: new Date().toISOString() };
        const ref = await db.collection("dimension_types").add(data);
        dimensionTypes.push({ id: ref.id, ...data });
        n++;
      }
      toast("Added " + n + " dimension type(s)", true);
      renderDimensionTypes(document.getElementById("main"));
    }

    async function deleteDimension(id) {
      if (!canDelete() && !currentUser.isSuperAdmin) return toast("Not authorized to delete");
      const d = dimensions.find(x => x.id === id); if (!d) return;
      if (!confirm("Delete value " + d.code + "? Type " + (d.dimType||"") + " remains.")) return;
      await db.collection("dimensions").doc(id).delete();
      dimensions = dimensions.filter(x => x.id !== id);
      toast("Deleted", true);
      renderDimensions(document.getElementById("main"));
    }
    async function deleteSelectedDimensions() {
      if (__busy) return toast("Another operation is running");
      if (!canDelete() && !currentUser.isSuperAdmin) return toast("Not authorized to delete");
      const ids = [...document.querySelectorAll(".dim-check:checked")].map(c => c.dataset.id);
      if (!ids.length) return toast("Select rows first");
      if (!confirm("Delete " + ids.length + " value(s)? Types are not deleted.")) return;
      __busy = true;
      showProgress(0, "Deleting…");
      try {
        for (let i = 0; i < ids.length; i++) {
          const id = ids[i];
          showProgress(Math.round(((i+1)/ids.length)*100), "Deleting " + (i+1) + "/" + ids.length);
          await db.collection("dimensions").doc(id).delete();
          dimensions = dimensions.filter(d => d.id !== id);
        }
        toast("Deleted " + ids.length, true);
        renderDimensions(document.getElementById("main"));
      } finally {
        __busy = false;
        hideProgress();
      }
    }
    async function saveDim() {
      let companyId = currentUser.isSuperAdmin
        ? (document.getElementById("dim-co") && document.getElementById("dim-co").value)
        : currentUser.companyId;
      if (!companyId && currentUser.isSuperAdmin && companies[0]) companyId = companies[0].id;
      const dimType = (document.getElementById("dim-type").value || "").trim().toUpperCase();
      const code = document.getElementById("dim-code").value.trim().toUpperCase();
      const name = document.getElementById("dim-name").value.trim();
      if (!companyId || !dimType || !code || !name) return toast("Company, Type, Code and Name are required");
      if (!dimensionTypes.some(t => t.companyId === companyId && t.code === dimType)) {
        return toast("Dimension type not found — create it under Dimension Types first (or Seed defaults)");
      }
      const data = { companyId, dimType, code, name, isActive: true };
      if (editingDimId) {
        await db.collection("dimensions").doc(editingDimId).update(data);
        const idx = dimensions.findIndex(x => x.id === editingDimId);
        if (idx >= 0) dimensions[idx] = { ...dimensions[idx], ...data };
        editingDimId = null;
        toast("Updated", true);
      } else {
        if (dimensions.some(d => d.companyId===companyId && d.dimType===dimType && d.code===code)) return toast("Code exists for this type");
        data.createdAt = new Date().toISOString();
        const ref = await db.collection("dimensions").add(data);
        dimensions.push({ id: ref.id, ...data });
        toast("Saved", true);
      }
      renderDimensions(document.getElementById("main"));
    }

    async function seedSalesDocSeries() {
      const cid = companyFilterId() || (companies[0]&&companies[0].id);
      if (!cid) return toast("Company required");
      const yy = String(new Date().getFullYear()).slice(-2);
      const seeds = [
        // Sales A/R
        ["SQ","SQ-"+yy+"-"],["SO","SO-"+yy+"-"],["DN","DN-"+yy+"-"],["RET","RE-"+yy+"-"],
        ["DPR","DR-"+yy+"-"],["DPI","DI-"+yy+"-"],["INV","IN-"+yy+"-"],["CM","CM-"+yy+"-"],
        // Purchasing A/P
        ["PR","PR-"+yy+"-"],["PQ","PQ-"+yy+"-"],["PO","PO-"+yy+"-"],["GRPO","GR-"+yy+"-"],
        ["APINV","PI-"+yy+"-"],["APCM","PC-"+yy+"-"],
        // Inventory
        ["IN","IN-"+yy+"-"],["OUT","OUT-"+yy+"-"],["TR","TR-"+yy+"-"],["OB","OB-"+yy+"-"],
        // Banking
        ["RC","RC-"+yy+"-"],["JE","JE-"+yy+"-"]
      ];
      let n = 0;
      for (const [docType, prefix] of seeds) {
        if (docSeries.some(s => s.companyId===cid && s.docType===docType)) continue;
        const data = { companyId: cid, docType, prefix, nextNumber: 1, padLength: 4, yearReset: true, isActive: true };
        const ref = await db.collection("doc_series").add(data);
        docSeries.push({ id: ref.id, ...data });
        n++;
      }
      toast("Added " + n + " series", true);
      renderDocSeries(document.getElementById("main"));
    }
    async function saveSeries() {

      renderDocSeries(document.getElementById("main"));
    }

    async function importEmployeesExcel(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const companyId = currentUser.isSuperAdmin
        ? (companies[0] && companies[0].id)
        : currentUser.companyId;
      if (!companyId) {
        toast("Create a company first kabla ya import");
        input.value = "";
        return;
      }
      // Super admin: ask which company if multiple
      let cid = companyId;
      if (currentUser.isSuperAdmin && companies.length > 1) {
        const codes = companies.map((c, i) => (i + 1) + ". " + c.code).join("\\n");
        const pick = prompt("Select company number:\\n" + codes, "1");
        const idx = (parseInt(pick, 10) || 1) - 1;
        if (!companies[idx]) { toast("Company invalid"); input.value = ""; return; }
        cid = companies[idx].id;
      }

      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        if (!rows.length) { toast("File has no data"); input.value = ""; return; }

        let added = 0, skipped = 0;
        for (const row of rows) {
          // flexible column names
          const employeeCode = String(row.employeeCode || row.EmployeeCode || row.Code || row.code || row["Employee Code"] || row["EMP CODE"] || "").trim();
          const fullName = String(row.fullName || row.FullName || row.Name || row.name || row["Employee Name"] || row["Full Name"] || "").trim();
          const department = String(row.department || row.Department || row.Dept || "").trim() || null;
          const jobTitle = String(row.jobTitle || row.JobTitle || row.Title || row["Job Title"] || row.Position || "").trim() || null;
          if (!employeeCode || !fullName) { skipped++; continue; }
          if (employees.some(e => e.companyId === cid && e.employeeCode === employeeCode)) { skipped++; continue; }
          const data = {
            companyId: cid, employeeCode, fullName, department, jobTitle,
            status: "active", createdAt: new Date().toISOString()
          };
          const ref = await db.collection("employees").add(data);
          employees.push({ id: ref.id, ...data });
          added++;
        }
        toast("Imported: " + added + " · Skipped: " + skipped, true);
        renderEmployees(document.getElementById("main"));
      } catch (e) {
        toast("Import error: " + e.message);
      }
      input.value = "";
    }

    async function importItemsExcel(input) {
      const file = input.files && input.files[0]; if (!file) return;
      let cid = pickCompanyId(); if (!cid) { input.value=""; return; }
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
        let added=0, skipped=0;
        for (const row of rows) {
          const itemCode = String(row.itemCode||row.ItemCode||row.Code||row.code||"").trim().toUpperCase();
          const name = String(row.name||row.Name||row.ItemName||row.Description||"").trim();
          if (!itemCode || !name) { skipped++; continue; }
          if (items.some(i => i.companyId===cid && i.itemCode===itemCode)) { skipped++; continue; }
          let manageBy = String(row.manageBy||row.ManageBy||row.ManBtchNum||"None").trim();
          if (/^(Y|Yes|true|1|Batch)$/i.test(manageBy) || String(row.ManBtchNum).toUpperCase()==="Y") manageBy = "Batch";
          else if (/^(Serial|SN|S)$/i.test(manageBy) || String(row.ManSerNum).toUpperCase()==="Y") manageBy = "Serial";
          else manageBy = "None";
          const yn = (v) => !/^(N|No|false|0)$/i.test(String(v||"Y"));
          const data = {
            companyId: cid, itemCode, name,
            foreignName: String(row.foreignName||row.FrgnName||"").trim()||null,
            itemGroup: String(row.itemGroup||row.Group||row.ItmsGrpCod||"").trim()||null,
            barcode: String(row.barcode||row.CodeBars||"").trim()||null,
            uom: String(row.uom||row.InvntryUom||row.UoM||"pcs").trim()||"pcs",
            salesUom: String(row.salesUom||row.SalUnitMsr||"").trim()||null,
            purchaseUom: String(row.purchaseUom||row.BuyUnitMsr||"").trim()||null,
            manageBy,
            valuationMethod: String(row.valuationMethod||row.EvalSystem||"MovingAverage").trim()||"MovingAverage",
            defaultWh: String(row.defaultWh||row.DfltWH||"").trim().toUpperCase()||null,
            minLevel: parseFloat(row.minLevel||row.MinLevel||0)||0,
            maxLevel: parseFloat(row.maxLevel||row.MaxLevel||0)||0,
            reorderQty: parseFloat(row.reorderQty||row.ReorderQty||0)||0,
            lastPurchasePrice: parseFloat(row.lastPurchasePrice||row.LastPurPrc||0)||0,
            isInventory: yn(row.isInventory||row.InvntItem||"Y"),
            isSales: yn(row.isSales||row.SellItem||"Y"),
            isPurchase: yn(row.isPurchase||row.PrchseItem||"Y"),
            status: /inactive|N/i.test(String(row.status||row.validFor||"active")) ? "inactive" : "active",
            remarks: String(row.remarks||row.UserText||"").trim()||null,
            isActive: true,
            createdAt: new Date().toISOString()
          };
          data.isActive = data.status === "active";
          const ref = await db.collection("items").add(data);
          items.push({ id: ref.id, ...data });
          added++;
        }
        toast("Items: "+added+" added, "+skipped+" skipped", true);
        renderItems(document.getElementById("main"));
      } catch(e) { toast(e.message); }
      input.value = "";
    }

    async function nextStockDocNo(companyId, docType) {
      const year = new Date().getFullYear();
      const yy = String(year).slice(-2);
      const prefixMap = { IN: "GR-", OUT: "GI-", TR: "TR-", OB: "OB-" };
      const seriesMap = { IN: "GRPO", OUT: "GI", TR: "TR", OB: "OB" };
      const prefix = (prefixMap[docType] || (docType + "-")) + yy + "-";
      const seriesType = seriesMap[docType] || docType;
      let series = docSeries.find(s => s.companyId === companyId && s.docType === seriesType);
      let num = 1;
      if (series) {
        num = series.nextNumber || 1;
        await db.collection("doc_series").doc(series.id).update({ nextNumber: num + 1 });
        series.nextNumber = num + 1;
      } else {
        const data = { companyId, docType: seriesType, prefix, nextNumber: 2, padLength: 4, yearReset: true, isActive: true };
        const ref = await db.collection("doc_series").add(data);
        docSeries.push({ id: ref.id, ...data });
      }
      return prefix + String(num).padStart(4, "0");
    }

    function computeStockBalances(companyId) {
      const map = {};
      const add = (itemCode, name, uom, wh, qty) => {
        const key = itemCode + "||" + wh;
        if (!map[key]) map[key] = { itemCode, name: name || "", uom: uom || "", warehouseCode: wh, qty: 0 };
        map[key].qty += qty;
        if (name) map[key].name = name;
      };
      scoped(stockDocs, companyId).forEach(doc => {
        if (doc.status === "cancelled") return;
        if (doc.docType === "TR") {
          (doc.lines || []).forEach(l => {
            const q = parseFloat(l.qty) || 0;
            add(l.itemCode, l.name, l.uom, doc.fromWh || "", -q);
            add(l.itemCode, l.name, l.uom, doc.toWh || "", q);
          });
          return;
        }
        const sign = (doc.docType === "IN" || doc.docType === "OB") ? 1 : -1;
        const wh = doc.warehouseCode || "";
        (doc.lines || []).forEach(l => {
          add(l.itemCode, l.name, l.uom, wh, sign * (parseFloat(l.qty) || 0));
        });
      });
      return Object.values(map).sort((a, b) => a.itemCode.localeCompare(b.itemCode) || a.warehouseCode.localeCompare(b.warehouseCode));
    }

      const obType = (document.getElementById("ob-type") && document.getElementById("ob-type").value) || "STOCK";
      const warehouseCode = document.getElementById("ob-wh").value || null;
      const docDate = document.getElementById("ob-date").value;
      const remarks = document.getElementById("ob-remarks").value.trim() || null;
      const offsetAcct = (document.getElementById("ob-acct") && document.getElementById("ob-acct").value) || null;
      let lines = [];
      if (obType === "STOCK") {
        lines = openingLines.filter(l => l.itemCode && parseFloat(l.qty) > 0).map((l, i) => ({
          lineNum: i + 1, itemCode: l.itemCode, qty: parseFloat(l.qty), unitCost: parseFloat(l.unitCost) || 0,
          uom: (items.find(x => x.itemCode === l.itemCode) || {}).uom || "pcs",
          name: (items.find(x => x.itemCode === l.itemCode) || {}).name || ""
        }));
        if (!warehouseCode) return toast("Warehouse required for Stock Opening Balance");
      } else if (obType === "BP") {
        lines = openingLines.filter(l => l.bpCode && parseFloat(l.amount) !== 0).map((l, i) => ({
          lineNum: i + 1, bpType: l.bpType || "C", bpCode: l.bpCode, amount: parseFloat(l.amount) || 0
        }));
      } else {
        lines = openingLines.filter(l => l.acctCode && (parseFloat(l.debit)||0) + (parseFloat(l.credit)||0) > 0).map((l, i) => ({
          lineNum: i + 1, acctCode: l.acctCode, debit: parseFloat(l.debit)||0, credit: parseFloat(l.credit)||0
        }));
      }
      if (!companyId || !docDate || !lines.length) return toast("Fill required fields and lines");
      const docNo = await nextStockDocNo(companyId, "OB");
      const data = {
        companyId, docNo, docType: "OB", obType, docDate, warehouseCode, remarks, lines, offsetAcct,
        status: "posted", createdBy: currentUser.email, createdAt: new Date().toISOString()
      };
      // GL posting
      const totalValue = lines.reduce((s, l) => {
        if (obType === "STOCK") return s + (l.qty * l.unitCost);
        if (obType === "BP") return s + (l.amount || 0);
        return s + ((l.debit||0) - (l.credit||0));
      }, 0);
      let glLines = [];
      if (obType === "STOCK") {
        const invAcct = offsetAcct || getMap(companyId, "INVENTORY");
        const equity = getMap(companyId, "OB_EQUITY") || getMap(companyId, "RETAINED");
        if (invAcct && equity) {
          glLines = [
            { acctCode: invAcct, debit: totalValue, credit: 0, lineMemo: "Stock OB " + docNo },
            { acctCode: equity, debit: 0, credit: totalValue, lineMemo: "OB Equity " + docNo },
          ];
        }
      } else if (obType === "BP" || obType === "GL") {
        const target = offsetAcct;
        const equity = getMap(companyId, "OB_EQUITY");
        if (target && equity) {
          // Positive = debit (asset / customer), negative handled by user putting positive
          glLines = [
            { acctCode: target, debit: totalValue, credit: 0, lineMemo: "OB " + docNo },
            { acctCode: equity, debit: 0, credit: totalValue, lineMemo: "OB Equity " + docNo },
          ];
        }
      }
      if (glLines.length) {
        try {
          const je = await postJournalEntry(companyId, {
            refDate: docDate, memo: "Opening Balance " + docNo, lines: glLines,
            sourceType: "OB", sourceDoc: docNo
          });
          data.journalNo = je.transId;
        } catch (ge) { toast("OB saved but GL failed: " + ge.message); }
      }
      const ref = await db.collection("stock_docs").add(data);
      stockDocs.unshift({ id: ref.id, ...data });
      toast("Posted " + docNo + (data.journalNo ? " / JE " + data.journalNo : ""), true);
      renderOpening(document.getElementById("main"));
    }

    function nextBpCode(companyId, series) {
      let prefix = series === "EMP" ? "EMP" : (series === "S" ? "S" : "C");
      const pad = 5;
      const re = series === "EMP" ? /^EMP(\d+)$/i : (series === "S" ? /^S(\d+)$/i : /^C(\d+)$/i);
      let max = 0;
      scoped(partners, companyId).forEach(p => {
        const m = String(p.bpCode || "").match(re);
        if (m) max = Math.max(max, parseInt(m[1], 10));
      });
      return prefix + String(max + 1).padStart(pad, "0");
    }

    async function savePartner() {
      const companyId = currentUser.isSuperAdmin ? document.getElementById("bp-co").value : currentUser.companyId;
      const series = document.getElementById("bp-series") ? document.getElementById("bp-series").value : "C";
      const data = {
        companyId,
        bpCode: document.getElementById("bp-code").value.trim().toUpperCase(),
        name: document.getElementById("bp-name").value.trim(),
        bpType: document.getElementById("bp-type").value,
        codeSeries: series,
        groupCode: document.getElementById("bp-group").value || null,
        tin: document.getElementById("bp-tin").value.trim() || null,
        phone: document.getElementById("bp-phone").value.trim() || null,
        email: document.getElementById("bp-email").value.trim() || null,
        creditLimit: parseFloat(document.getElementById("bp-credit").value) || 0,
        paymentTermsDays: parseInt(document.getElementById("bp-terms").value, 10) || 0,
        currencyCode: document.getElementById("bp-cur").value || "TZS",
        status: document.getElementById("bp-status").value || "active",
        address: document.getElementById("bp-address").value.trim() || null,
        remarks: document.getElementById("bp-remarks").value.trim() || null,
        isActive: true,
      };
      if (!data.companyId || !data.bpCode || !data.name) return toast("Code and Name are required");
      try {
        if (editingPartnerId) {
          await db.collection("partners").doc(editingPartnerId).update({ ...data, updatedAt: new Date().toISOString() });
          const idx = partners.findIndex(p => p.id === editingPartnerId);
          if (idx >= 0) partners[idx] = { ...partners[idx], ...data };
          toast("Updated", true);
        } else {
          if (partners.some(p => p.companyId === data.companyId && p.bpCode === data.bpCode)) return toast("BP code exists");
          data.createdAt = new Date().toISOString();
          const ref = await db.collection("partners").add(data);
          partners.push({ id: ref.id, ...data });
          toast("Saved", true);
        }
        editingPartnerId = null;
        renderPartners(document.getElementById("main"));
      } catch (e) { toast(e.message); }
    }

          <div class="mkt-hd">
            <div class="mkt-col">
              ${docType === "PR" ? `
              <label>Requester Code</label>
              <select id="p-requester" onchange="onRequesterChange()"><option value="">—</option>${scoped(employees, cid).map(e=>`<option value="${esc(e.employeeCode)}" data-dept="${esc(e.department||"")}" data-name="${esc(e.fullName||"")}">${esc(e.employeeCode)}</option>`).join("")}</select>
              <label>Requester Name</label>
              <select id="p-requester-name" onchange="onRequesterNameChange()"><option value="">—</option>${scoped(employees, cid).map(e=>`<option value="${esc(e.employeeCode)}" data-dept="${esc(e.department||"")}">${esc(e.fullName||"")}</option>`).join("")}</select>
              <label>Department</label>
              <input id="p-dept" readonly placeholder="From employee">
              ` : ""}
              <label style="font-weight:700">Vendor Code${docType==="PR"?"":" *"}</label>
              <select id="p-bp" onchange="onPurchVendorChange()" style="background:#fffef0"><option value="">— Code —</option>${vendorsFor(cid).map(p=>`<option value="${esc(p.bpCode)}" data-name="${esc(p.name||"")}">${esc(p.bpCode)}</option>`).join("")}</select>
              <label style="font-weight:700">Vendor Name</label>
              <select id="p-bp-name-sel" onchange="onPurchVendorNameChange()" style="background:#fffef0"><option value="">— Name —</option>${vendorsFor(cid).map(p=>`<option value="${esc(p.bpCode)}">${esc(p.name||"")}</option>`).join("")}</select>
              <input id="p-bp-name" type="hidden">
              <label>Branch *</label>
              <select id="p-branch"><option value="">—</option>${scoped(dimensions, cid).filter(d=>(d.dimType||"").toUpperCase()==="BRANCH").map(d=>`<option value="${esc(d.code)}">${esc(d.code)} — ${esc(d.name)}</option>`).join("") || branchOpts}</select>
              <label>Warehouse</label>
              <select id="p-wh"><option value="">—</option>${whOpts}</select>
              <label>Remarks</label>
              <input id="p-remarks">
            </div>
            <div class="mkt-col">
              <label>Series</label>
              <input readonly value="${esc(meta.prefix)}">
              <label>Document No.</label>
              <input id="p-docno" readonly placeholder="On Post">
              <label>Status</label>
              <input readonly value="Open">
              <label>Posting Date *</label>
              <input type="date" id="p-date">
              <label>Due Date</label>
              <input type="date" id="p-due">

          <div class="mkt-spacer" style="height:0.3in"></div>

              <label>Owner</label>
              <select id="p-owner"><option value="">—</option>${scoped(employees, cid).map(e=>`<option value="${esc(e.employeeCode)}">${esc(e.employeeCode)} — ${esc(e.fullName)}</option>`).join("")}</select>

          <thead><tr><th>Doc No</th><th>Date</th><th>Vendor</th><th>Total</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${list.map(d => `<tr>
              <td>${esc(d.docNo)}</td><td>${esc(d.docDate)}</td>
              <td><b>${esc(d.bpCode||"")}</b> ${esc(d.bpName||"")}</td>
              <td style="text-align:right">${Number(d.grandTotal||0).toLocaleString(undefined,{minimumFractionDigits:2})}</td>
              <td><b style="color:${d.status==="closed"?"#059669":"#0b3d91"}">${esc(d.status||"open")}</b></td>

                <button class="btn btn-sm" onclick="viewPurchaseDoc('${d.id}')">View</button>
