<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KESHASHA ERP</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #eef1f6; --panel: #fff; --border: #c5cdd8; --primary: #0b3d91;
      --primary-d: #072a66; --text: #1a1a2e; --muted: #667085; --hover: #eef3fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
    #login-view {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
    }
    .login-box {
      background: var(--panel); border: 1px solid var(--border); width: 380px; padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(11,61,145,.12);
    }
    .login-box h1 { color: var(--primary); font-size: 1.5rem; letter-spacing: 1px; }
    .login-box .sub { color: var(--muted); font-size: 12px; margin: 4px 0 18px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    input, select, textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); margin-bottom: 10px; font-size: 13px; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 12px; border: 1px solid var(--border); background: #fff; cursor: pointer;
      font-size: 12.5px; font-weight: 600; text-decoration: none; color: var(--text);
    }
    .btn:hover { background: #f8fafc; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-d); color: #fff; }
    .btn-sm { padding: 4px 9px; font-size: 12px; }
    .btn-danger { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .btn-danger:hover { background: #fee2e2; }
    .err { color: #b91c1c; font-size: 12px; margin-top: 6px; }

    #app-view { display: none; min-height: 100vh; }
    .topbar {
      background: var(--primary); color: #fff; padding: 8px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .topbar strong { font-size: 15px; letter-spacing: .6px; }
    .badge { background: rgba(255,255,255,.2); padding: 2px 7px; font-size: 11px; margin-left: 6px; }
    .layout { display: flex; min-height: calc(100vh - 42px); }
    .sidebar { width: 175px; background: #1e293b; flex-shrink: 0; padding: 6px 0; }
    .sidebar button {
      display: block; width: 100%; text-align: left; border: 0; background: none;
      color: #cbd5e1; padding: 8px 14px; cursor: pointer; font-size: 12.5px;
    }
    .sidebar button:hover, .sidebar button.active { background: var(--primary); color: #fff; }
    .main { flex: 1; padding: 10px 14px; overflow: auto; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .toolbar h2 { font-size: 15px; color: var(--primary); margin-right: auto; }

    /* Dense SAP/Excel-style grid */
    .grid-wrap { border: 1px solid var(--border); background: var(--panel); overflow: auto; max-height: calc(100vh - 160px); }
    table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.grid th {
      background: #e8eef7; border: 1px solid var(--border); padding: 5px 8px;
      text-align: left; font-weight: 700; position: sticky; top: 0; z-index: 1; white-space: nowrap;
    }
    table.grid td { border: 1px solid var(--border); padding: 4px 8px; }
    table.grid tr:hover td { background: var(--hover); }
    .form-bar {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 10px;
      background: var(--panel); border: 1px solid var(--border); padding: 8px 10px; margin-bottom: 8px;
    }
    .form-bar .fg label { margin-bottom: 2px; }
    .form-bar .fg input, .form-bar .fg select { margin-bottom: 0; padding: 6px 8px; }
    .toast {
      position: fixed; bottom: 16px; right: 16px; background: #0f172a; color: #fff;
      padding: 10px 14px; font-size: 13px; display: none; z-index: 999; max-width: 320px; border-radius: 4px;
    }
    .toast.show { display: block; }
    .toast.ok { background: #166534; }
    .toast.err { background: #991b1b; }

    .mkt-hd {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px 48px;
      padding: 12px 14px; background: #f5f5f5; border: 1px solid #b0b0b0; margin-bottom: 0;
    }
    .mkt-hd .mkt-col {
      display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; align-items: center;
    }
    .mkt-hd .mkt-col label {
      font-size: 12px; font-weight: 600; color: #333; text-transform: none; margin: 0;
    }
    .mkt-hd .mkt-col input, .mkt-hd .mkt-col select {
      margin: 0; padding: 4px 8px; font-size: 12px; border: 1px solid #999; background: #fffef0; width: 100%; max-width: 280px;
    }
    .mkt-hd .mkt-col input[readonly] { background: #e8e8e8; color: #333; }
    .mkt-spacer {
      height: 0.25in; min-height: 16px; border-bottom: 1px dashed #ccc; margin: 0 0 8px 0;
      background: linear-gradient(180deg, #fafafa 0%, #fff 100%);
    }
    .mkt-tabs { display: flex; gap: 0; background: #dcdcdc; border-bottom: 1px solid #aaa; padding: 0 8px; margin: 0; }
    .mkt-tabs button {
      border: 1px solid transparent; border-bottom: 0; background: transparent;
      padding: 7px 16px; font-size: 12px; cursor: pointer; margin-bottom: -1px;
    }
    .mkt-tabs button.on { background: #f5f5f5; border-color: #aaa; border-bottom-color: #f5f5f5; font-weight: 600; }
    .mkt-ft {
      display: grid; grid-template-columns: 1fr 280px; gap: 16px; padding: 10px 14px; background: #f5f5f5; border-top: 1px solid #ccc;
    }
    .mkt-ft .mkt-col { display: grid; grid-template-columns: 110px 1fr; gap: 4px 8px; align-items: center; }
    .mkt-ft label { font-size: 12px; font-weight: 600; margin: 0; text-transform: none; }
    .mkt-ft input, .mkt-ft select { margin: 0; padding: 3px 6px; font-size: 12px; border: 1px solid #999; background: #fffef0; }
    .mkt-ft .totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12px; align-items: center; }
    .mkt-ft .totals b { text-align: right; min-width: 100px; }
    .mkt-lines-label {
      font-size: 12px; font-weight: 700; color: #0b3d91; padding: 4px 8px 6px; border-bottom: 2px solid #0b3d91; margin-bottom: 4px;
    }

    .win-layer { position: fixed; inset: 0; pointer-events: none; z-index: 80; }
    .win {
      pointer-events: auto; position: absolute; background: #fff; border: 1px solid #94a3b8;
      box-shadow: 0 12px 40px rgba(0,0,0,.25); display: flex; flex-direction: column;
      min-width: 480px; min-height: 280px; border-radius: 4px 4px 0 0;
    }
    .win-title {
      background: #0b3d91; color: #fff; padding: 6px 8px; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; justify-content: space-between; cursor: move; user-select: none;
    }
    .win-title .win-btns { display: flex; gap: 4px; }
    .win-title .win-btns button {
      border: 0; background: rgba(255,255,255,.15); color: #fff; width: 22px; height: 20px;
      border-radius: 2px; cursor: pointer; font-size: 11px; line-height: 1;
    }
    .win-title .win-btns button:hover { background: rgba(255,255,255,.3); }
    .win-body { flex: 1; overflow: auto; padding: 8px; background: #f4f6f9; }
    .win.minimized { height: 32px !important; min-height: 32px; width: 240px !important; }
    .win.minimized .win-body { display: none; }
    .win.maximized { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; }

    .menubar {
      background: #f3f4f6; border-bottom: 1px solid var(--border); display: flex; gap: 0; padding: 0 6px; font-size: 12.5px; user-select: none;
    }
    .menubar .menu { position: relative; padding: 6px 10px; cursor: pointer; color: #333; }
    .menubar .menu:hover { background: #e5e7eb; }
    .menubar .menu .dropdown {
      display: none; position: absolute; top: 100%; left: 0; min-width: 200px;
      background: #fff; border: 1px solid var(--border); box-shadow: 0 6px 16px rgba(0,0,0,.12); z-index: 90;
    }
    .menubar .menu:hover .dropdown { display: block; }
    .menubar .dropdown button {
      display: block; width: 100%; text-align: left; border: 0; background: none;
      padding: 7px 12px; font-size: 12.5px; cursor: pointer;
    }
    .menubar .dropdown button:hover { background: var(--hover); }
    .menubar .dropdown .sub { position: relative; }
    .menubar .dropdown .sub > .subdrop {
      display: none; position: absolute; left: 100%; top: 0; min-width: 200px;
      background: #fff; border: 1px solid var(--border); box-shadow: 0 6px 16px rgba(0,0,0,.12);
    }
    .menubar .dropdown .sub:hover > .subdrop { display: block; }
    .menubar .dropdown .sub > button::after { content: " ▸"; float: right; opacity: .6; }

    .sidebar .mod-title {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; color: #94a3b8; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .4px; cursor: pointer;
    }
    .sidebar .mod-title:hover { color: #fff; }
    .sidebar .mod-children { display: none; }
    .sidebar .mod-children.open { display: block; }
    .sidebar .mod-children button { padding-left: 20px; font-size: 12px; }
    .sidebar .mod-title .chev { font-size: 10px; opacity: .7; }

    .progress-bar-wrap {
      position: fixed; bottom: 0; left: 0; right: 0; height: 28px; background: #1e293b;
      z-index: 9999; display: none; align-items: center; padding: 0 12px; gap: 10px; font-size: 12px; color: #fff;
    }
    .progress-bar-wrap.show { display: flex; }
    .progress-track { flex: 1; height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: #22c55e; width: 0%; transition: width 0.15s; }
  </style>
</head>
<body>

    <!-- Main Workspace Layout -->
    <div class="layout">
      <nav class="sidebar" id="sidebar"></nav>
      <div style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden">

  <!-- Multi-Window Floating Layer -->
  <div class="win-layer" id="win-layer"></div>
  <div class="toast" id="toast"></div>

  <!-- Progress Bar Wrap -->
  <div id="progress-bar" class="progress-bar-wrap">
    <span class="progress-text" id="progress-text">Processing…</span>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span id="progress-pct" style="min-width:35px;text-align:right">0%</span>
  </div>

  <script>
    // ============================================================
    // CONFIG & STATE INITIALIZATION
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBiGE_B8kv8zZZQ68kYUOC9ite-pelVbLc",
      authDomain: "keshasha-erp.firebaseapp.com",
      projectId: "keshasha-erp",
      storageBucket: "keshasha-erp.firebasestorage.app",
      messagingSenderId: "967244511867",
      appId: "1:967244511867:web:ac558966b64643156900de",
      measurementId: "G-1TK62JQTGM"
    };

    const CONFIG_READY = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("PASTE");
    let db = null;
    if (CONFIG_READY) {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      } catch (e) {
        console.warn("Firebase initialization notice:", e);
      }
    }

    let currentUser = null;
    let activeCompanyId = null;
    let companies = [];
    let branches = [];
    let employees = [];
    let salesEmployees = [];
    let users = [];
    let roles = [];
    let dimensions = [];
    let dimensionTypes = [];
    let docSeries = [];
    let items = [];
    let boms = [];
    let prodOrders = [];
    let opportunities = [];
    let activities = [];
    let assets = [];
    let leaveRequests = [];
    let warehouses = [];
    let stockDocs = [];
    let partners = [];
    let priceLists = [];
    let salesDocs = [];
    let purchaseDocs = [];
    let payments = [];
    let accounts = [];
    let journals = [];
    let accountMaps = [];
    let partnerGroups = [];
    let currencies = [];
    let exchangeRates = [];
    let taxCodes = [];
    let itemSeriesDefs = [];
    let uiTemplates = [];

    const SESSION_KEY = "keshasha_erp_session_v1";

    function showProgress(pct, text) {
      const bar = document.getElementById("progress-bar");
      const fill = document.getElementById("progress-fill");
      const txt = document.getElementById("progress-text");
      const pctEl = document.getElementById("progress-pct");
      if (!bar) return;
      bar.classList.add("show");
      const p = Math.max(0, Math.min(100, pct || 0));
      if (fill) fill.style.width = p + "%";
      if (txt) txt.textContent = text || "Processing…";
      if (pctEl) pctEl.textContent = Math.round(p) + "%";
    }
    function hideProgress() {
      const bar = document.getElementById("progress-bar");
      if (bar) bar.classList.remove("show");
    }
    let __busy = false;

    function toast(msg, ok) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "toast show " + (ok ? "ok" : "err");
      setTimeout(() => t.className = "toast", 2800);
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function scoped(list, companyId) {
      if (!companyId) return list;
      return list.filter(x => x.companyId === companyId);
    }
    function companyFilterId() {
      return activeCompanyId || null;
    }
    function activeCompany() {
      return companies.find(c => c.id === activeCompanyId) || null;
    }
    function getCompanyOptionsHtml() {
      const ac = activeCompany();
      if (!ac) return `<option value="">— Select —</option>`;
      return `<option value="${ac.id}" selected>${esc(ac.code)} — ${esc(ac.name)}</option>`;
    }

    // ============================================================
    // DATA LAYER (LOAD / SAVE)
    // ============================================================
    async function loadAll() {
      if (!db) {
        // Fallback in-memory defaults if offline
        return;
      }
      try {
        const [co, br, emp, se, us, dim, dimt, ds, it, wh, st, bp, pl, sd, pd, py, ac, jn, am, pg, cu, tc, er, isd] = await Promise.all([
          db.collection("companies").get(),
          db.collection("branches").get(),
          db.collection("employees").get(),
          db.collection("sales_employees").get(),
          db.collection("users").get(),
          db.collection("dimensions").get(),
          db.collection("dimension_types").get(),
          db.collection("doc_series").get(),
          db.collection("items").get(),
          db.collection("warehouses").get(),
          db.collection("stock_docs").get(),
          db.collection("partners").get(),
          db.collection("price_lists").get(),
          db.collection("sales_docs").get(),
          db.collection("purchase_docs").get(),

    async function doLogin() {
      document.getElementById("login-err").textContent = "";
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const password = document.getElementById("login-password").value;
      const companyId = document.getElementById("login-company").value;
      if (!companyId) return document.getElementById("login-err").textContent = "Select a company to continue.";

      const co = companies.find(c => c.id === companyId);

      const u = users.find(x => x.email === email && x.password === password && x.isActive !== false);

      localStorage.setItem(SESSION_KEY, JSON.stringify({ email, companyId }));
      showApp();

    }

    async function triggerExcelImport(moduleKey, input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const cid = activeCompanyId;
      if (!cid) { toast("No active company"); input.value = ""; return; }
      try {
        showProgress(10, "Reading Excel File…");
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        if (!rows.length) { toast("Excel file is empty"); hideProgress(); input.value = ""; return; }

        let added = 0;
        showProgress(30, "Importing " + rows.length + " records…");

        if (moduleKey === "items") {
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            const itemCode = String(r.itemCode || r.ItemCode || r.code || r.Code || "").trim().toUpperCase();
            const name = String(r.name || r.Name || r.description || r.ItemName || "").trim();
            if (!itemCode || !name) continue;
            if (items.some(x => x.companyId === cid && x.itemCode === itemCode)) continue;
            const data = {
              companyId: cid, itemCode, name,
              itemGroup: r.itemGroup || r.Group || "General",
              uom: r.uom || r.UoM || "pcs",
              manageBy: r.manageBy || "None",
              lastPurchasePrice: parseFloat(r.lastPurchasePrice || r.price || 0) || 0,
              isActive: true, createdAt: new Date().toISOString()
            };
            if (db) {
              const ref = await db.collection("items").add(data);
              items.push({ id: ref.id, ...data });
            } else {
              items.push({ id: "it_" + Date.now() + i, ...data });
            }
            added++;
          }
          renderItems(document.getElementById("main"));
        } else if (moduleKey === "partners") {
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            const bpCode = String(r.bpCode || r.CardCode || r.code || "").trim().toUpperCase();
            const name = String(r.name || r.CardName || "").trim();
            if (!bpCode || !name) continue;
            if (partners.some(x => x.companyId === cid && x.bpCode === bpCode)) continue;
            const data = {
              companyId: cid, bpCode, name,
              bpType: (r.bpType || "C").toUpperCase().startsWith("S") ? "S" : "C",
              groupCode: r.groupCode || "",
              tin: r.tin || "",
              phone: r.phone || "",
              email: r.email || "",
              currencyCode: r.currencyCode || "TZS",
              status: "active", isActive: true, createdAt: new Date().toISOString()
            };
            if (db) {
              const ref = await db.collection("partners").add(data);
              partners.push({ id: ref.id, ...data });
            } else {
              partners.push({ id: "bp_" + Date.now() + i, ...data });
            }
            added++;
          }
          renderPartners(document.getElementById("main"));
        } else if (moduleKey === "employees") {
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            const employeeCode = String(r.employeeCode || r.empID || r.code || "").trim();
            const fullName = String(r.fullName || r.name || "").trim();
            if (!employeeCode || !fullName) continue;
            if (employees.some(x => x.companyId === cid && x.employeeCode === employeeCode)) continue;
            const data = {
              companyId: cid, employeeCode, fullName,
              department: r.department || "",
              jobTitle: r.jobTitle || "",
              branchCode: r.branchCode || "HQ",
              mobile: r.mobile || "",
              status: "active", isActive: true, createdAt: new Date().toISOString()
            };
            if (db) {
              const ref = await db.collection("employees").add(data);
              employees.push({ id: ref.id, ...data });
            } else {
              employees.push({ id: "emp_" + Date.now() + i, ...data });
            }
            added++;
          }
          renderEmployees(document.getElementById("main"));
        } else if (moduleKey === "warehouses") {
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            const code = String(r.code || r.WhsCode || "").trim().toUpperCase();
            const name = String(r.name || r.WhsName || "").trim();
            if (!code || !name) continue;
            if (warehouses.some(x => x.companyId === cid && x.code === code)) continue;
            const data = { companyId: cid, code, name, branchCode: r.branchCode || "HQ", isActive: true };
            if (db) {
              const ref = await db.collection("warehouses").add(data);
              warehouses.push({ id: ref.id, ...data });
            } else {
              warehouses.push({ id: "wh_" + Date.now() + i, ...data });
            }
            added++;
          }
          renderWarehouses(document.getElementById("main"));
        } else if (moduleKey === "branches") {
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            const code = String(r.code || "").trim().toUpperCase();
            const name = String(r.name || "").trim();
            if (!code || !name) continue;
            if (branches.some(x => x.companyId === cid && x.code === code)) continue;
            const data = { companyId: cid, code, name, isHq: code === "HQ", isActive: true };
            if (db) {
              const ref = await db.collection("branches").add(data);
              branches.push({ id: ref.id, ...data });
            } else {
              branches.push({ id: "br_" + Date.now() + i, ...data });
            }
            added++;
          }
          renderBranches(document.getElementById("main"));
        }
        showProgress(100, "Done");
        toast("Import successful: " + added + " records added", true);
      } catch (err) {

      const q = (document.getElementById("item-q").value||"").toLowerCase();
      const list = scoped(items, companyFilterId()).filter(i =>

      );

    function openItemForm(id) {
      editingItemId = id || null;
      document.getElementById("item-form").style.display = "block";
      if (!id) {
        document.getElementById("item-code").value = "";
        document.getElementById("item-name").value = "";
        document.getElementById("item-group").value = "";
        document.getElementById("item-uom").value = "pcs";
        document.getElementById("item-manage").value = "None";
        document.getElementById("item-lpp").value = "0";
        return;
      }
      const it = items.find(x => x.id === id); if (!it) return;
      document.getElementById("item-code").value = it.itemCode || "";
      document.getElementById("item-name").value = it.name || "";
      document.getElementById("item-group").value = it.itemGroup || "";
      document.getElementById("item-uom").value = it.uom || "pcs";
      document.getElementById("item-manage").value = it.manageBy || "None";
      document.getElementById("item-lpp").value = it.lastPurchasePrice || 0;

    async function saveItem() {
      const cid = companyFilterId();
      const itemCode = document.getElementById("item-code").value.trim().toUpperCase();
      const name = document.getElementById("item-name").value.trim();
      if (!cid || !itemCode || !name) return toast("Code and Name are required");
      const data = {
        companyId: cid, itemCode, name,
        itemGroup: document.getElementById("item-group").value.trim() || "General",
        uom: document.getElementById("item-uom").value.trim() || "pcs",
        manageBy: document.getElementById("item-manage").value || "None",
        lastPurchasePrice: parseFloat(document.getElementById("item-lpp").value) || 0,
        isActive: true
      };
      if (editingItemId) {
        if (db) await db.collection("items").doc(editingItemId).update(data);
        const idx = items.findIndex(x => x.id === editingItemId);
        if (idx >= 0) items[idx] = { ...items[idx], ...data };
        toast("Item updated", true);
      } else {
        if (items.some(x => x.companyId === cid && x.itemCode === itemCode)) return toast("Code exists");
        data.createdAt = new Date().toISOString();
        if (db) {
          const ref = await db.collection("items").add(data);
          items.push({ id: ref.id, ...data });
        } else {
          items.push({ id: "it_" + Date.now(), ...data });
        }
        toast("Item saved", true);
      }
      editingItemId = null;
      renderItems(document.getElementById("main"));
    }
    async function deleteItem(id) {
      if (!confirm("Delete item?")) return;
      if (db) await db.collection("items").doc(id).delete();
      items = items.filter(x => x.id !== id);
      toast("Deleted", true);
      renderItems(document.getElementById("main"));
    }
    async function deleteSelectedItems() {
      const ids = [...document.querySelectorAll(".item-check:checked")].map(c => c.dataset.id);
      if (!ids.length) return toast("Select items to delete");
      if (!confirm("Delete " + ids.length + " item(s)?")) return;
      for (const id of ids) {
        if (db) await db.collection("items").doc(id).delete();
        items = items.filter(x => x.id !== id);
      }
      toast("Deleted " + ids.length, true);
      renderItems(document.getElementById("main"));
    }

    async function seedDocSeries() {
      const cid = companyFilterId();
      if (!cid) return toast("Company required");
      const yy = String(new Date().getFullYear()).slice(-2);
      const defaults = [
        ["SQ", "SQ-" + yy + "-"], ["SO", "SO-" + yy + "-"], ["DN", "DN-" + yy + "-"], ["INV", "IN-" + yy + "-"], ["CM", "CM-" + yy + "-"],
        ["PR", "PR-" + yy + "-"], ["PQ", "PQ-" + yy + "-"], ["PO", "PO-" + yy + "-"], ["GRPO", "GR-" + yy + "-"], ["APINV", "PI-" + yy + "-"], ["APCM", "PC-" + yy + "-"],
        ["IN", "GR-" + yy + "-"], ["OUT", "GI-" + yy + "-"], ["TR", "TR-" + yy + "-"], ["RC", "RC-" + yy + "-"], ["JE", "JE-" + yy + "-"]
      ];
      for (const [docType, prefix] of defaults) {
        if (docSeries.some(s => s.companyId === cid && s.docType === docType)) continue;
        const data = { companyId: cid, docType, prefix, nextNumber: 1, padLength: 4, isActive: true };
        if (db) {
          const ref = await db.collection("doc_series").add(data);
          docSeries.push({ id: ref.id, ...data });
        } else {
          docSeries.push({ id: "ds_" + Date.now(), ...data });
        }
      }
      toast("Series seeded", true);
      renderDocSeries(document.getElementById("main"));
    }

    async function getNextDocNumber(companyId, docType) {
      let s = docSeries.find(x => x.companyId === companyId && x.docType === docType);
      if (!s) {
        const yy = String(new Date().getFullYear()).slice(-2);
        s = { companyId, docType, prefix: docType + "-" + yy + "-", nextNumber: 1, padLength: 4 };
        if (db) {
          const ref = await db.collection("doc_series").add(s);
          s.id = ref.id;
        }
        docSeries.push(s);
      }
      const num = s.nextNumber;
      s.nextNumber++;
      if (db && s.id) await db.collection("doc_series").doc(s.id).update({ nextNumber: s.nextNumber });
      return s.prefix + String(num).padStart(s.padLength || 4, "0");
    }
