<script>
/* ===== Smart Search for every <select> =====
   - Type partial words, many words, any order:  "machale 12"  ==  "12 machale"
   - * is ignored (so "*meal" works), case-insensitive
   - Matches option text AND option value (e.g. item code)
   - Falls back to typo-tolerant matching if nothing matches
   - Underlying <select> stays in the DOM, so all existing code keeps working.
   - Opt out for one select with: data-nosmart
*/
(function () {
  const MAX = 200;
  let panel = null, cur = null;
  const vdesc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, "value");
  const sidesc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, "selectedIndex");

  const norm = s => String(s == null ? "" : s).toLowerCase();
  const tokens = q => norm(q).split(/[\s*%]+/).filter(Boolean);
  const eh = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function subseq(t, hay) {
    let i = 0;
    for (const ch of hay) { if (ch === t[i]) i++; if (i === t.length) return true; }
    return false;
  }
  function search(sel, q) {
    const toks = tokens(q);
    const opts = Array.from(sel.options);
    if (!toks.length) return opts.map(o => ({ o, score: 0 }));
    const res = [];
    for (const o of opts) {
      if (o.value === "") continue;
      const hay = norm(o.textContent + " " + o.value);
      let ok = true, score = 0;
      for (const t of toks) {
        const p = hay.indexOf(t);
        if (p < 0) { ok = false; break; }
        if (!(p === 0 || /[\s(\-_\/]/.test(hay[p - 1]))) score += 1;
      }
      if (ok) res.push({ o, score });
    }
    if (!res.length) {
      for (const o of opts) {
        if (o.value === "") continue;
        const hay = norm(o.textContent + " " + o.value);
        if (toks.every(t => t.length >= 3 && subseq(t, hay))) res.push({ o, score: 5 });
      }
    }
    res.sort((a, b) => a.score - b.score);
    return res;
  }

  function refresh(sel) {
    const inp = sel.__ss; if (!inp) return;
    const o = sel.options[sel.selectedIndex];
    const empty = !o || o.value === "";
    inp.value = empty ? "" : o.textContent.trim();
    inp.placeholder = o ? o.textContent.trim() : "";
    inp.disabled = sel.disabled;
    inp.title = inp.value;
  }

  function enhance(sel) {
    if (sel.__ss || sel.multiple || sel.size > 1 || sel.hasAttribute("data-nosmart") || !sel.parentNode) return;
    const st = sel.style;
    const wrap = document.createElement("span");
    wrap.className = "ss-wrap";
    ["width", "minWidth", "maxWidth", "margin", "marginTop", "marginBottom", "marginLeft", "marginRight"].forEach(p => { if (st[p]) wrap.style[p] = st[p]; });
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "ss-input"; inp.autocomplete = "off"; inp.spellcheck = false;
    ["padding", "fontSize", "background", "border", "borderRadius"].forEach(p => { if (st[p]) inp.style[p] = st[p]; });
    wrap.appendChild(inp);
    sel.parentNode.insertBefore(wrap, sel.nextSibling);
    sel.classList.add("ss-hidden");
    sel.__ss = inp; inp.__sel = sel;

      configurable: true,
      get() { return vdesc.get.call(this); },
      set(v) { vdesc.set.call(this, v); refresh(this); }
    });
    Object.defineProperty(sel, "selectedIndex", {
      configurable: true,
      get() { return sidesc.get.call(this); },
      set(v) { sidesc.set.call(this, v); refresh(this); }
    });
    refresh(sel);
    inp.addEventListener("focus", () => { open(sel); inp.select(); });
    inp.addEventListener("click", () => { if (!cur || cur.sel !== sel) open(sel); });
    inp.addEventListener("input", () => { if (!cur || cur.sel !== sel) open(sel); render(inp.value); });
    inp.addEventListener("keydown", onKey);
    inp.addEventListener("blur", () => { if (cur && cur.sel === sel) close(); refresh(sel); });
  }

  function open(sel) {
    close();
    const inp = sel.__ss; if (!inp || inp.disabled) return;
    panel = document.createElement("div");
    panel.className = "ss-panel";
    panel.addEventListener("mousedown", e => e.preventDefault());
    panel.addEventListener("click", e => {
      const el = e.target.closest(".ss-opt");
      if (el && cur) pick(cur.items[+el.dataset.i].o);
    });
    document.body.appendChild(panel);
    cur = { sel, inp, items: [], idx: 0, q: "" };
    render("");
  }
  function close() {
    if (panel) { panel.remove(); panel = null; }
    cur = null;
  }
  function render(q) {
    if (!cur) return;
    const all = search(cur.sel, q);
    cur.items = all.slice(0, MAX);
    cur.q = q;
    const selIdx = cur.sel.selectedIndex;
    panel.innerHTML = cur.items.map((x, i) =>
      `<div class="ss-opt${x.o.index === selIdx ? " sel" : ""}" data-i="${i}">${eh(x.o.textContent.trim() || "\u2014")}</div>`
    ).join("") || `<div class="ss-empty">No match</div>`;
    if (all.length > MAX) panel.insertAdjacentHTML("beforeend", `<div class="ss-more">${all.length - MAX} more \u2014 keep typing to narrow</div>`);
    cur.idx = q ? 0 : Math.max(0, cur.items.findIndex(x => x.o.index === selIdx));
    hl(); place();
  }
  function hl() {
    if (!panel || !cur) return;
    panel.querySelectorAll(".ss-opt").forEach((el, i) => {
      const on = i === cur.idx;
      el.classList.toggle("active", on);
      if (on) el.scrollIntoView({ block: "nearest" });
    });
  }
  function place() {
    if (!panel || !cur) return;
    const r = cur.inp.getBoundingClientRect();
    const w = Math.max(r.width, 220);
    panel.style.minWidth = w + "px";
    panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + "px";
    const h = Math.min(panel.offsetHeight, 280);
    const below = window.innerHeight - r.bottom;
    if (below < h + 8 && r.top > below) { panel.style.top = ""; panel.style.bottom = (window.innerHeight - r.top) + "px"; }
    else { panel.style.bottom = ""; panel.style.top = r.bottom + "px"; }
  }
  function pick(o) {
    if (!cur) return;
    const sel = cur.sel;
    const changed = sel.selectedIndex !== o.index;
    sel.selectedIndex = o.index;
    close();
    refresh(sel);
    if (changed) sel.dispatchEvent(new Event("change", { bubbles: true }));
  }
  function onKey(e) {
    const inp = e.currentTarget;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a") { e.stopPropagation(); return; }
    if (!cur || cur.inp !== inp) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { open(inp.__sel); e.preventDefault(); }
      return;
    }
    if (e.key === "ArrowDown") { cur.idx = Math.min(cur.items.length - 1, cur.idx + 1); hl(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { cur.idx = Math.max(0, cur.idx - 1); hl(); e.preventDefault(); }
    else if (e.key === "Enter") { e.preventDefault(); const x = cur.items[cur.idx]; if (x) pick(x.o); }
    else if (e.key === "Escape") { close(); refresh(inp.__sel); e.stopPropagation(); }
    else if (e.key === "Tab") { if (cur.q) { const x = cur.items[cur.idx]; if (x) pick(x.o); } }
  }

  window.addEventListener("scroll", e => {
    if (!cur || e.target === panel) return;
    if (!cur.inp.isConnected) close(); else place();
  }, true);
  window.addEventListener("resize", () => { if (cur) place(); });

  const obs = new MutationObserver(muts => {
    for (const m of muts) {
      if (m.type === "attributes") { if (m.target.__ss) refresh(m.target); continue; }
      const t = m.target;
      if (t.nodeType === 1) {
        const s = t.tagName === "SELECT" ? t : (t.closest ? t.closest("select") : null);
        if (s && s.__ss) refresh(s);
      }
      m.addedNodes.forEach(n => {
        if (n.nodeType !== 1) return;
        if (n.tagName === "SELECT") enhance(n);
        else if (n.querySelectorAll) n.querySelectorAll("select").forEach(enhance);
      });
    }
    if (cur && !cur.inp.isConnected) close();
  });
  obs.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["disabled"] });
  document.querySelectorAll("select").forEach(enhance);
})();
</script>

window.generateSQL = function(){
  const table=(document.getElementById("qg-table")||{}).value;
  const fieldsSel=document.getElementById("qg-fields");
  const fields = fieldsSel ? Array.from(fieldsSel.selectedOptions).map(o=>o.value) : ["*"];
  const where=(document.getElementById("qg-where")||{}).value.trim();
  let sql = "SELECT " + (fields.length?fields.join(", "):"*") + " FROM " + table;

};

window.executeSQL = function(sql, title){
  // Simple client-side interpreter for demo against in-memory data
  const res=document.getElementById("q-result");
  if(!res) return;
  let rows = [], headers = [];
  try {
    const m = /FROM\s+(\w+)/i.exec(sql);
    const table = m ? m[1].toUpperCase() : "";
    const map = {OITM:items, OCRD:partners, OHEM:employees, OWHS:warehouses, OACT:accounts};
    const data = map[table] || [];
    if(!data.length){
      res.innerHTML = `<div style="padding:10px;background:#fff7ed;border:1px solid #fdba74">No live data for ${table||"table"}. Query saved. SQL: <code>${esc(sql)}</code></div>`;
      return;
    }
    headers = Object.keys(data[0]||{}).slice(0,8);
    rows = data.slice(0,50).map(r=>headers.map(h=>esc(r[h]||"")));
  } catch(e){
    res.innerHTML = `<div style="color:#b91c1c">Query error: ${esc(e.message)}</div>`;
    return;
  }
  res.innerHTML = `<h3 style="margin:8px 0;color:#0b3d91">${esc(title||"Result")}</h3>
    <div class="grid-wrap"><table class="grid"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <p style="font-size:11px;color:#64748b">${rows.length} row(s)</p>`;
  toast("Query executed", true);
};

  nav("queries");
  setTimeout(()=>{

    const ta=document.getElementById("qg-result");
    if(ta) ta.value=sql;
    const sel=document.getElementById("qg-table");

window.sendWhatsAppReport = async function(){
  const phone=(document.getElementById("wa-phone")||{}).value.trim().replace(/[^0-9]/g,"");
  const rep=(document.getElementById("wa-rep")||{}).value;
  const docNo=(document.getElementById("wa-docno")||{}).value.trim();
  if(!phone || phone.length < 10) return toast("Enter valid phone with country code");
  const co=(typeof activeCompany==="function"&&activeCompany())||{};
  const reportNames = {sfp:"Statement of Financial Position",pl:"Profit or Loss",soce:"Changes in Equity",cf:"Cash Flow",tb:"Trial Balance",sales:"Sales Report",purch:"Purchase Report",inv:"Inventory Status",invaudit:"Inventory Audit",invval:"Inventory Valuation",bank:"Banking Report",quot:"Sales Quotation",so:"Sales Order",invdoc:"A/R Invoice",apinv:"A/P Invoice",dashboard:"Dashboard",payroll:"Payroll Report"};
  const reportName = reportNames[rep] || rep;
  const logo = co.logoData || "";
  const header = co.printHeader || "";
  const footer = co.printFooter || "";
  const fileName = reportName.replace(/\s+/g,"_")+"_"+(docNo||new Date().toISOString().slice(0,10))+".pdf";
  // Generate PDF as blob using html2pdf approach or print
  const pdfHtml = `<!DOCTYPE html><html><head><title>${reportName}</title>
    <style>body{font-family:Arial,sans-serif;margin:20px}
    .hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0b3d91;padding-bottom:8px;margin-bottom:16px}
    .logo{max-height:60px}h1{margin:4px 0;color:#0b3d91;font-size:18px}
    table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #ccc;padding:6px 8px;font-size:11px}th{background:#0b3d91;color:#fff}
    .ft{margin-top:20px;font-size:10px;color:#64748b;border-top:1px solid #ddd;padding-top:6px}</style></head>
    <body><div class="hdr"><div>${logo?'<img class="logo" src="'+logo+'">':''}<div style="font-weight:700;font-size:14px;color:#0b3d91">${co.name||""}</div></div>
    <div style="text-align:right;font-size:11px">${(header||"").replace(/\n/g,"<br>")}</div></div>
    <h1>${reportName}${docNo?" — "+docNo:""}</h1>
    <p style="font-size:12px">Generated: ${new Date().toLocaleString()} | Company: ${co.name||""}</p>
    <table><thead><tr><th>Description</th><th>Value</th></tr></thead>
    <tbody><tr><td>Report Type</td><td>${reportName}</td></tr>
    <tr><td>Document No</td><td>${docNo||"—"}</td></tr>

    <div class="ft">${footer||""} | KESHASHA ERP</div></body></html>`;
  // Create blob and file
  const blob = new Blob([pdfHtml], {type:"text/html"});
  const file = new File([blob], fileName.replace(".pdf",".html"), {type:"text/html"});
  // Try Web Share API with file
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
    try {
      await navigator.share({
        files: [file],
        title: reportName,
        text: "KESHASHA Report: "+reportName+" from "+(co.name||"")
      });
      toast("Shared successfully", true);
      return;
    } catch(e){ console.log("Share cancelled or failed", e); }
  }
  // Fallback: download file and open WhatsApp
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = fileName.replace(".pdf",".html");
  a.click();
  URL.revokeObjectURL(url);
  const waLink = "https://wa.me/"+phone;
  const preview=document.getElementById("wa-preview");
  if(preview) preview.innerHTML = `
    <b style="color:#059669">File Downloaded</b><br>
    Report: ${reportName}<br>
    File: ${fileName.replace(".pdf",".html")}<br><br>
    <div style="background:#fef3c7;border:1px solid #f59e0b;padding:8px;border-radius:4px;font-size:12px;margin:8px 0">

      3. Select contact +${phone}<br>

    </div>
    <button class="btn btn-sm btn-primary" onclick="window.open('${waLink}','_blank')">Open WhatsApp</button>
    <p style="font-size:11px;color:#64748b;margin-top:8px">
      Note: WhatsApp Web cannot auto-attach files. Download + manual attach is required, or use WhatsApp Business API for full automation.
    </p>`;
  toast("File downloaded — attach in WhatsApp", true);
};

window.addLicensePool = function(){
  if(!currentUser || currentUser.email !== window.FOUNDER_EMAIL) return toast("Founder only");
  const qty = parseInt((document.getElementById("lic-qty")||{}).value)||0;
  if(qty<1) return toast("Enter quantity");

window.reduceLicensePool = function(){
  if(!currentUser || currentUser.email !== window.FOUNDER_EMAIL) return toast("Founder only");
  const qty = parseInt((document.getElementById("lic-qty")||{}).value)||0;
  if(qty<1) return toast("Enter quantity to reduce");
  const assigned = window.licensePool.assigned.length;
  const newTotal = window.licensePool.total - qty;
  if(newTotal < assigned) return toast("Cannot reduce below assigned ("+assigned+"). Revoke some first.");
  if(newTotal < 0) return toast("Cannot go below 0");
  window.licensePool.total = newTotal;
  toast(qty+" licenses removed. Total: "+window.licensePool.total, true);
  renderLicense(document.getElementById("main"));
};
window.assignLicense = function(){
  if(!currentUser || currentUser.email !== window.FOUNDER_EMAIL) return toast("Founder only");
  const email = (document.getElementById("lic-user")||{}).value.trim().toLowerCase();
  const until = (document.getElementById("lic-until")||{}).value;
  if(!email) return toast("Enter user email");
  const available = window.licensePool.total - window.licensePool.assigned.length;
  if(available<1) return toast("No licenses available. Add to pool first.");
  if(window.licensePool.assigned.some(a=>a.email===email)) return toast("User already has a license");
  window.licensePool.assigned.push({email, assignedAt:new Date().toISOString(), validUntil:until||""});
  toast("License assigned to "+email+". Available: "+(available-1), true);
  renderLicense(document.getElementById("main"));
};
window.revokeUserLicense = function(i){
  if(!currentUser || currentUser.email !== window.FOUNDER_EMAIL) return toast("Founder only");
  const a = window.licensePool.assigned[i];
  if(!a) return;
  window.licensePool.assigned.splice(i,1);
  toast("License revoked from "+a.email+". Returned to pool.", true);
  renderLicense(document.getElementById("main"));
};
window.hasValidLicense = function(email){
  if(!email) return false;
  if(email === window.FOUNDER_EMAIL) return true;
  const a = (window.licensePool.assigned||[]).find(x=>x.email===email.toLowerCase());
  if(!a) return false;
  if(a.validUntil && new Date(a.validUntil) < new Date()) return false;
  return true;
};

function findAns(q){
  q=(q||"").toLowerCase().trim();
  // Greetings and conversation
  if(/^(hi|hello|hey|habari|mambo|niaje|shikamoo|hola|bonjour|salam)/.test(q)){
    const greets = ["Habari! Ninaweza kukusaidia vipi leo?","Hello! How can I help you today?","Mambo! Sema, unahitaji nini?","Hey! I'm KESHASHA AI. Ask me anything about the system."];
    return greets[Math.floor(Math.random()*greets.length)];
  }
  if(/^(asante|thanks|thank you|shukrani|merci)/.test(q)){
    return "Karibu sana! Ukihitaji kitu kingine, niulize. 😊";
  }
  if(/^(bye|kwaheri|goodbye|see you|baadaye)/.test(q)){
    return "Kwaheri! Karibu tena wakati wowote. KESHASHA AI iko hapa kukusaidia.";
  }
  if(/how are you|habari yako|ukoje|niaje/.test(q)){
    return "Niko vizuri, asante kwa kuuliza! Niko tayari kukusaidia na mfumo. Wewe je?";
  }
  if(/who are you|wewe ni nani|jina lako/.test(q)){
    return "Mimi ni KESHASHA AI — msaidizi wako wa mfumo. Ninajua documents, reports, payroll, approvals, na mengi zaidi. Naweza pia kukuunganisha na mtoa huduma ukihitaji.";
  }
  if(/story|hadithi|joke|utani|simulate/.test(q)){
    return "Haha! Mimi ni AI ya kazi, lakini naweza kukusaidia. Uliza kuhusu mfumo au sema 'connect me' kama unataka mtu halisi.";
  }
  // Connect to human support
  if(/connect|mtoa huduma|human|person|agent|support|sijaridhika|not satisfied|help me|nisaidie|contact/.test(q)){
    return "SUPPORT_CONNECT";
  }
  // Normalize informal language, typos, abbreviations
  q = q.replace(/pls|plz|please/g,"")
       .replace(/whts|whats|wats/g,"what")
       .replace(/hw|howw/g,"how")
       .replace(/cnt|cant/g,"cannot")
       .replace(/u /g,"you ")
       .replace(/ur /g,"your ")
       .replace(/nini maana|nini mana/g,"nini")
       .replace(/vipi|vipi ya|vpp/g,"vipi")
       .replace(/so |s\.o\./g,"sales order ")
       .replace(/po |p\.o\./g,"purchase order ")
       .replace(/inv |invoice/g,"invoice ")
       .replace(/tb /g,"trial balance ")
       .replace(/bp /g,"business partner ")
       .replace(/gl /g,"account ")
       .replace(/\s+/g," ").trim();
  const isSuper = !!(currentUser && currentUser.isSuperAdmin);
  // Block attempts to get HTML / structure / source (except super admin asking for templates)
  if(/html|source|code|structure|script|function |innerhtml|index\.html/.test(q) && !isSuper){
    return "I can only help with procedures on how to use the system. I cannot show code, HTML, or internal structure.";
  }
  // Error diagnosis
  if(/error|failed|cannot|haiwezi|imeshindwa|kosa|tatizo/.test(q)){
    if(/warehouse|ghala/.test(q)) return "Error cause: Warehouse is required for stock documents (Delivery, Invoice, GRPO). Fix: Select a Warehouse on the document header before posting.";
    if(/branch|tawi/.test(q)) return "Error cause: Branch is required. Fix: Select a Branch on the document. If you see no branches, your user may not be assigned any (check Authorizations → User Profile).";
    if(/customer|vendor|bp|mteja|muuzaji/.test(q)) return "Error cause: Business Partner missing or wrong type. Fix: Select a Customer (CardType C) for Sales, or Vendor (CardType S) for Purchase. Create BP in Business Partners → BP Master Data if needed.";
    if(/account|gl|determination/.test(q)) return "Error cause: GL Account Determination missing. Fix: Go to Financials → Account Determination and set AR Control, Revenue, AP Control, Inventory, COGS, VAT accounts.";
    if(/tax|vat|kodi/.test(q)) return "Error cause: Tax Code not found or rate missing. Fix: Financials → Tax Codes — ensure the code exists and has a rate. Select it on the document line.";
    if(/authorization|ruhusa|not authorized/.test(q)) return "Error cause: No authorization for this action. Fix: Ask your administrator to grant Full Authorization for this module in Administration → Authorizations.";
    if(/locked|fungwa/.test(q)) return "Error cause: User account is locked. Fix: Administrator must uncheck Lock User Account in Users or Authorizations → User Profile.";
    return "Describe the error message more specifically (e.g. warehouse, branch, account, tax, authorization) and I will tell you the cause and how to fix it.";
  }
  // Super Admin: generate import template (Excel)
  if(isSuper && /import template|template ya import|excel template|tengeneza template/.test(q)){
    const templates = {
      items: ["ItemCode","ItemName","ItemGroup","UoM","ManageBy","Barcode","LastPurchasePrice"],
      partners: ["BPCode","Name","BPType","Phone","Email","Currency"],
      employees: ["EmployeeCode","FullName","Department","JobTitle","Branch","Mobile","Email"],
      branches: ["Code","Name"],
      accounts: ["AcctCode","AcctName","AcctType","Postable"]
    };
    let kind = "items";
    if(/partner|bp|customer|vendor/.test(q)) kind = "partners";
    else if(/employee|mfanyakazi/.test(q)) kind = "employees";
    else if(/branch|tawi/.test(q)) kind = "branches";
    else if(/account|coa/.test(q)) kind = "accounts";
    const cols = templates[kind];
    if(typeof XLSX!=="undefined"){
      const ws = XLSX.utils.aoa_to_sheet([cols]);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, kind);
      XLSX.writeFile(wb, "KESHASHA_Import_"+kind+"_"+new Date().toISOString().slice(0,10)+".xlsx");
      return "KESHASHA AI: Import template for "+kind+" generated and downloaded. Columns: "+cols.join(", ")+". Fill the rows and use Import Excel.";
    }
    return "KESHASHA AI: Import template for "+kind+". Columns: "+cols.join(", ")+". (Excel library not loaded — copy these headers manually.)";
  }
  // Super Admin: generate report template
  if(isSuper && /template|tengeneza|generate report|create report/.test(q)){
    if(/sales|mauzo/.test(q)) return "Report Template — Sales Summary:\nColumns: DocNo, DocDate, CardCode, CardName, DocTotal, Status\nSource: ORDR + RDR1\nFilter: DocDate between @From and @To\nGroup by: CardCode\nI can refine this. Describe more details.";
    if(/inventory|stock|bidhaa/.test(q)) return "Report Template — Inventory Status:\nColumns: ItemCode, ItemName, WhsCode, OnHand, AvgPrice, Value\nSource: OITM + OITW\nFilter: OnHand > 0\nI can add more fields. What else do you need?";
    if(/financial|tb|trial|mizania/.test(q)) return "Report Template — Trial Balance:\nColumns: AcctCode, AcctName, Debit, Credit, Balance\nSource: OJDT + JDT1 + OACT\nFilter: RefDate between @From and @To\nGroup by: AcctCode";
    if(/payroll|mishahara/.test(q)) return "Report Template — Payroll:\nColumns: Employee, Basic, Allowances, Deductions, Net\nSource: Payroll Run\nIncludes: Company logo, printHeader, printFooter from Document Settings";
    return "Tell me the report you want (Sales, Inventory, Financial, Payroll, or custom) and I will generate a template structure for you.";
  }
  // Authorization check: only answer about modules the user can access
  const pageMap = {
    "sales":"so", "purchase":"po", "item":"items", "partner":"partners", "bp":"partners",
    "report":"pl", "financial":"pl", "inventory":"items", "approval":"apprstatus",
    "power bi":"powerbi", "whatsapp":"whatsapp", "batch":"batch", "query":"queries"
  };
  for(const [kw, page] of Object.entries(pageMap)){
    if(q.includes(kw)){
      if(typeof hasAuth==="function" && typeof currentUser!=="undefined" && currentUser && !currentUser.isSuperAdmin){
        const key = (typeof pageAuthKey==="function" ? pageAuthKey(page) : page);
        if(key && !hasAuth(key, 1)){
          return "You are not authorized to access this module. Contact your administrator.";
        }
      }
    }
  }
  for(const item of KB) if(item.k.some(k=>q.includes(k))) {
    let ans = item.a;
    // Simple language hint
    if(/[\u0600-\u06FF]/.test(q)) ans = "[AR] " + ans;
    else if(/kwa |nini |vipi |wapi |naomba/.test(q)) ans = ans; // Swahili keywords already in KB
    return ans;
  }
  // Default multilingual
  if(/[\u0600-\u06FF]/.test(q)) return "يمكنني المساعدة في الإجراءات. اسأل عن المستندات أو التقارير أو الضرائب.";
  if(/kwa |nini |vipi |wapi |naomba|msaada/.test(q)) return "Naweza kusaidia na taratibu za mfumo. Uliza kuhusu documents, reports, tax, payroll, queries, au module yoyote. Sijui kufuta au kuonyesha code.";
  if(/comment |où |aide|bonjour/.test(q)) return "Je peux aider avec les procédures du système. Demandez sur les documents, rapports, taxes, ou modules.";
  // Smarter default - try to be helpful
  if(/vipi|how|nini|what|wapi|where/.test(q)){
    return "KESHASHA AI: Naweza kukusaidia. Uliza kwa undani zaidi, mfano:\n• 'vipi ku-post sales order'\n• 'error warehouse'\n• 'payroll inafanyaje'\n• 'tables za purchase'\n• 'nani anaweza ku-approve'\nNinajua documents, tables, reports, payroll, approvals, na settings.";
  }
  return "KESHASHA AI: Niko hapa. Uliza kuhusu document yoyote (SO, PO, Invoice, PR), table (ORDR, RDR1, OPRQ, PRQ1, OJDT, JDT1), report, payroll, approval, query, au error. Ninajibu kwa lugha yako.";
}

window.clearAIChat = function(){
  const b = document.getElementById("chat-msgs");
  if(b) b.innerHTML = "";
  addMsg("bot","Conversation cleared. How can I help?");
};
window.sendAI = function(){
  const i=document.getElementById("chat-in"); if(!i) return;
  const q=i.value.trim(); if(!q) return;
  addMsg("user",q); i.value="";
  const ans = findAns(q);
  if(ans==="SUPPORT_CONNECT"){
    setTimeout(()=>{
      addMsg("bot","Naelewa. Hapa kuna mawasiliano ya mtoa huduma:");
      setTimeout(()=>{
        const co = (typeof activeCompany==="function" && activeCompany()) || {};
        const phones = [co.supportPhone1, co.supportPhone2, co.supportPhone3, co.supportPhone4].filter(p=>p&&p.trim());
        const email = co.supportEmail || "";
        let msg = "";
        if(phones.length){
          msg += "WhatsApp:\n" + phones.map(p=>"• +"+p.replace(/[^0-9]/g,"")+" → https://wa.me/"+p.replace(/[^0-9]/g,"")).join("\n");
        }
        if(email) msg += (msg?"\n\n":"") + "Email: "+email;
        if(!msg) msg = "Hakuna mawasiliano yaliyowekwa. Admin aweke kwenye Document Settings → Contact Support.";
        addMsg("bot", msg);
      },500);
    },300);
    return;
  }
  setTimeout(()=>addMsg("bot",ans),250);
};
function addMsg(role,t){
  const b=document.getElementById("chat-msgs"); if(!b) return;
  const d=document.createElement("div");
  d.style.cssText="margin:4px 0;padding:6px 8px;border-radius:6px;max-width:90%;"+(role==="user"?"background:var(--primary);color:#fff;margin-left:auto":"background:#fff;border:1px solid #e2e8f0");
  d.textContent=t; b.appendChild(d); b.scrollTop=b.scrollHeight;
}

<script>
// ===== BRANCH ASSIGNMENT ON USER =====
(function(){
  // Filter branches a user can access
  window.getUserBranches = function(user){
    if(!user) return [];
    if(user.isSuperAdmin) return (typeof branches!=="undefined"?branches:[]);
    const assigned = user.assignedBranches || [];
    if(!assigned.length) return []; // no branches assigned = none
    return (branches||[]).filter(b => assigned.includes(b.id) || assigned.includes(b.code));
  };

  // Enhance user form with branch multi-select
  const _renderUsers = window.renderUsers;
  window.renderUsers = function(el){
    if(_renderUsers) _renderUsers(el);
    const form = el.querySelector("#u-form");
    if(form && !form.querySelector("#u-branches")){
      const cid = (typeof companyFilterId==="function"?companyFilterId():null);
      const brList = (branches||[]).filter(b => !cid || b.companyId===cid);
      const opts = brList.map(b=>`<label style="display:flex;align-items:center;gap:6px;margin:2px 0;font-size:12px">
        <input type="checkbox" class="u-br-check" value="${b.id}"> ${esc(b.code)} — ${esc(b.name)}
      </label>`).join("") || "<span style='color:#64748b'>No branches</span>";
      form.insertAdjacentHTML("beforeend", `
        <div class="fg" style="grid-column:1/-1">
          <label>Assigned Branches</label>
          <div id="u-branches" style="max-height:120px;overflow:auto;border:1px solid #c5cdd8;padding:6px;background:#fff">${opts}</div>
        </div>
      `);
    }
  };

  // When editing user, check assigned branches
  const _editUser = window.editUser;
  window.editUser = function(id){
    if(_editUser) _editUser(id);
    setTimeout(()=>{
      const u = (users||[]).find(x=>x.id===id);
      if(!u) return;
      const assigned = u.assignedBranches || [];
      document.querySelectorAll(".u-br-check").forEach(cb=>{
        cb.checked = assigned.includes(cb.value);
      });
    }, 50);
  };

  // Save assigned branches with user
  const _saveUser = window.saveUser;
  window.saveUser = async function(){
    const assigned = Array.from(document.querySelectorAll(".u-br-check:checked")).map(cb=>cb.value);
    if(typeof _saveUser==="function") await _saveUser();
    // attach after original save
    if(typeof editingUserId!=="undefined" && editingUserId && typeof users!=="undefined"){
      const u = users.find(x=>x.id===editingUserId);
      if(u){
        u.assignedBranches = assigned;
        if(typeof db!=="undefined") await db.collection("users").doc(u.id).set(u);
        toast("Branch assignment saved", true);
      }
    }
  };

  // Filter branch list for non-super users
  const _renderBranches = window.renderBranches;
  window.renderBranches = function(el){
    if(typeof currentUser!=="undefined" && currentUser && !currentUser.isSuperAdmin){
      const allowed = getUserBranches(currentUser);
      // temporarily filter
      const orig = branches;
      window.branches = allowed;
      if(_renderBranches) _renderBranches(el);
      window.branches = orig;
      // banner
      const banner = document.createElement("div");
      banner.style.cssText="background:#eef3fb;border:1px solid #93c5fd;color:#1e40af;padding:6px 10px;margin-bottom:8px;font-size:12px";
      banner.textContent = "Showing only branches assigned to you ("+allowed.length+")";
      el.insertBefore(banner, el.firstChild);
    } else if(_renderBranches){
      _renderBranches(el);
    }
  };

  // Helper used by documents: only show assigned branches in selects
  window.branchOptionsForUser = function(){
    const list = getUserBranches(currentUser);
    if(!list.length && currentUser && currentUser.isSuperAdmin) return (branches||[]);
    return list;
  };

  console.log("Branch assignment on user loaded");
})();
</script>


<script>
// ===== LOCK USER ACCOUNT =====
(function(){
  // Add Lock checkbox to user form
  const _renderUsers = window.renderUsers;
  window.renderUsers = function(el){
    if(_renderUsers) _renderUsers(el);
    const form = el.querySelector("#u-form");
    if(form && !form.querySelector("#u-locked")){
      form.insertAdjacentHTML("beforeend", `
        <div class="fg">
          <label style="display:flex;align-items:center;gap:8px;text-transform:none;font-weight:600;color:#b91c1c">
            <input type="checkbox" id="u-locked" style="width:auto;margin:0"> Lock User Account
          </label>
          <span style="font-size:11px;color:#64748b">Locked users cannot login</span>
        </div>
      `);
    }
    // Show lock status in list
    const tbody = el.querySelector("table.grid tbody");
    if(tbody && !el.querySelector("[data-lock-col]")){
      const th = el.querySelector("table.grid thead tr");
      if(th){
        const td = document.createElement("th");
        td.dataset.lockCol="1";
        td.textContent="Locked";
        th.insertBefore(td, th.children[3]||null);
      }
    }
  };

  // When editing, set lock checkbox
  const _editUser = window.editUser;
  window.editUser = function(id){
    if(_editUser) _editUser(id);
    setTimeout(()=>{
      const u = (users||[]).find(x=>x.id===id);
      const cb = document.getElementById("u-locked");
      if(cb && u) cb.checked = !!u.locked;
    }, 60);
  };

  // Save lock status
  const _saveUser = window.saveUser;
  window.saveUser = async function(){
    const locked = !!(document.getElementById("u-locked")||{}).checked;
    if(typeof _saveUser==="function") await _saveUser();
    if(typeof editingUserId!=="undefined" && editingUserId && typeof users!=="undefined"){
      const u = users.find(x=>x.id===editingUserId);
      if(u){
        u.locked = locked;
        if(typeof db!=="undefined") await db.collection("users").doc(u.id).set(u);
        toast(locked ? "User account LOCKED" : "User account unlocked", true);
      }
    }
  };

  // Block login for locked users
  const _doLogin = window.doLogin;
  if(typeof doLogin==="function"){
    window.doLogin = async function(){
      const email = (document.getElementById("login-email")||{}).value||"";
      const u = (users||[]).find(x=> (x.email||"").toLowerCase()===email.trim().toLowerCase());
      if(u && u.locked){
        const err = document.getElementById("login-err");
        if(err) err.textContent = "Account is locked. Contact administrator.";
        return;
      }
      if(u && typeof hasValidLicense==="function" && !hasValidLicense(u.email)){
        const err = document.getElementById("login-err");
        if(err) err.textContent = "No license. Contact admin for license.";
        return;
      }
      if(_doLogin) return _doLogin.apply(this, arguments);
    };
  }

  // Also check after load
  const origLoad = window.loadAllData;
  if(typeof loadAllData==="function"){
    window.loadAllData = async function(){
      if(origLoad) await origLoad();
      if(typeof currentUser!=="undefined" && currentUser && currentUser.locked){
        toast("Your account is locked");
        if(typeof logout==="function") logout();
      }
    };
  }

  console.log("Lock user account loaded");
})();
</script>

<script>
// ===== CHANGE LOG =====
(function(){
  window.changeLog = window.changeLog || [];

  window.logChange = function(opts){
    opts = opts || {};
    const entry = {
      id: "cl" + Date.now() + Math.random().toString(36).slice(2,6),
      ts: new Date().toISOString(),
      userId: (currentUser && currentUser.id) || "",
      userName: (currentUser && (currentUser.fullName || currentUser.email)) || "Unknown",
      action: opts.action || "Update",
      docType: opts.docType || "",
      docNo: opts.docNo || "",
      field: opts.field || "",
      previous: opts.previous != null ? String(opts.previous) : "",
      current: opts.current != null ? String(opts.current) : "",
      note: opts.note || ""
    };
    window.changeLog.unshift(entry);
    if(window.changeLog.length > 2000) window.changeLog.length = 2000;
    // persist lightly
    try { localStorage.setItem("keshasha_changelog", JSON.stringify(window.changeLog.slice(0,500))); } catch(e){}
    return entry;
  };

  // Load from localStorage
  try {
    const saved = localStorage.getItem("keshasha_changelog");
    if(saved) window.changeLog = JSON.parse(saved);
  } catch(e){}

  window.renderChangeLog = function(el){
    const rows = (window.changeLog||[]).slice(0,300).map(e=>`<tr>
      <td style="white-space:nowrap;font-size:11px">${esc(e.ts.replace("T"," ").slice(0,19))}</td>
      <td>${esc(e.userName)}</td>
      <td style="font-size:11px">${esc(e.userId)}</td>
      <td>${esc(e.action)}</td>
      <td>${esc(e.docType)} ${esc(e.docNo)}</td>
      <td>${esc(e.field)}</td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis" title="${esc(e.previous)}">${esc(e.previous)}</td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis" title="${esc(e.current)}">${esc(e.current)}</td>
      <td>${esc(e.note)}</td>
    </tr>`).join("") || `<tr><td colspan="9">No changes logged yet</td></tr>`;
    el.innerHTML = `
      <div class="toolbar">
        <h2>Change Log</h2>
        <button class="btn btn-sm" onclick="exportChangeLog()">Export Excel</button>
        <button class="btn btn-sm btn-danger" onclick="if(confirm('Clear change log?')){changeLog=[];localStorage.removeItem('keshasha_changelog');renderChangeLog(document.getElementById('main'))}">Clear</button>
      </div>
      <div class="form-bar">
        <div class="fg"><label>Filter User</label><input id="cl-user" oninput="filterChangeLog()" placeholder="name or id"></div>
        <div class="fg"><label>Filter Doc</label><input id="cl-doc" oninput="filterChangeLog()" placeholder="SO, INV..."></div>
        <div class="fg"><label>Action</label><select id="cl-act" onchange="filterChangeLog()"><option value="">All</option><option>Post</option><option>Update</option><option>Create</option><option>Delete</option></select></div>
      </div>
      <div class="grid-wrap"><table class="grid" id="cl-table">
        <thead><tr>
          <th>Date/Time</th><th>User Name</th><th>User ID</th><th>Action</th>
          <th>Document</th><th>Field</th><th>Previous</th><th>Current</th><th>Note</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p style="font-size:11px;color:#64748b;margin-top:6px">Shows who posted or updated, previous value, current value, user ID, name and time.</p>
    `;
  };

  window.filterChangeLog = function(){
    const u=(document.getElementById("cl-user")||{}).value.toLowerCase();
    const d=(document.getElementById("cl-doc")||{}).value.toLowerCase();
    const a=(document.getElementById("cl-act")||{}).value;
    const tb=document.querySelector("#cl-table tbody");
    if(!tb) return;
    const filtered=(window.changeLog||[]).filter(e=>{
      if(u && !(e.userName||"").toLowerCase().includes(u) && !(e.userId||"").toLowerCase().includes(u)) return false;
      if(d && !((e.docType||"")+(e.docNo||"")).toLowerCase().includes(d)) return false;
      if(a && e.action!==a) return false;
      return true;
    }).slice(0,300);
    tb.innerHTML = filtered.map(e=>`<tr>
      <td style="white-space:nowrap;font-size:11px">${esc(e.ts.replace("T"," ").slice(0,19))}</td>
      <td>${esc(e.userName)}</td><td style="font-size:11px">${esc(e.userId)}</td>
      <td>${esc(e.action)}</td><td>${esc(e.docType)} ${esc(e.docNo)}</td>
      <td>${esc(e.field)}</td>
      <td>${esc(e.previous)}</td><td>${esc(e.current)}</td><td>${esc(e.note)}</td>
    </tr>`).join("") || `<tr><td colspan="9">No matching entries</td></tr>`;
  };

  window.exportChangeLog = function(){
    if(typeof XLSX==="undefined") return toast("Excel library not loaded");
    const rows=[["Date/Time","User Name","User ID","Action","Doc Type","Doc No","Field","Previous","Current","Note"]];
    (window.changeLog||[]).forEach(e=>rows.push([e.ts,e.userName,e.userId,e.action,e.docType,e.docNo,e.field,e.previous,e.current,e.note]));
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"ChangeLog");
    XLSX.writeFile(wb,"ChangeLog_"+new Date().toISOString().slice(0,10)+".xlsx");
    toast("Change log exported", true);
  };

  // Hook into nav
  const _nav = window.nav;
  if(typeof nav==="function"){
    const origNav = nav;
    window.nav = function(page){
      if(page==="changelog"){
        const main=document.getElementById("main");
        if(main) renderChangeLog(main);
        return;
      }
      return origNav.apply(this, arguments);
    };
  }

  // Add to Tools menu
  setTimeout(()=>{
    const tools = document.querySelector(".menu .dropdown");
    // find Tools menu
    document.querySelectorAll(".menubar .menu").forEach(m=>{
      if(m.textContent.trim().startsWith("Tools")){
        const dd = m.querySelector(".dropdown");
        if(dd && !dd.querySelector("[data-cl]")){
          const b=document.createElement("button");
          b.dataset.cl="1";
          b.textContent="Change Log";
          b.onclick=()=>nav("changelog");
          dd.appendChild(b);
        }
      }
    });
    // sidebar
    const sb=document.getElementById("sidebar");
    if(sb && !sb.querySelector('[data-page="changelog"]')){
      const b=document.createElement("button");
      b.dataset.page="changelog";
      b.textContent="Change Log";
      b.onclick=()=>nav("changelog");
      sb.appendChild(b);
    }
  },1200);

  // Demo: log a sample if empty
  if(!window.changeLog.length){
    logChange({action:"Create", docType:"System", docNo:"", field:"", previous:"", current:"Change Log enabled", note:"System start"});
  }

  console.log("Change Log loaded");
})();
</script>

<script>
// ===== PROGRESS OVERLAY + BETTER SQL ERRORS =====
(function(){
  // Progress overlay
  window.showProgress = function(msg, pct){
    let ov = document.getElementById("progress-overlay");
    if(!ov){
      ov = document.createElement("div");
      ov.id = "progress-overlay";
      ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center";
      ov.innerHTML = `<div style="background:#fff;padding:24px 32px;border-radius:8px;min-width:320px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)">
        <div id="prog-msg" style="font-weight:600;margin-bottom:10px;color:#0b3d91">Working...</div>
        <div style="background:#e5e7eb;border-radius:6px;height:18px;overflow:hidden">
          <div id="prog-bar" style="background:var(--primary,#0b3d91);height:100%;width:0%;transition:width .2s"></div>
        </div>
        <div id="prog-pct" style="font-size:12px;color:#64748b;margin-top:6px">0%</div>
      </div>`;
      document.body.appendChild(ov);
    }
    ov.style.display = "flex";
    const m = document.getElementById("prog-msg"); if(m) m.textContent = msg || "Working...";
    const b = document.getElementById("prog-bar"); if(b) b.style.width = (pct||0) + "%";
    const p = document.getElementById("prog-pct"); if(p) p.textContent = (pct||0) + "%";
  };
  window.hideProgress = function(){
    const ov = document.getElementById("progress-overlay");
    if(ov) ov.style.display = "none";
  };
  window.updateProgress = function(pct, msg){
    showProgress(msg, pct);
  };

  // Better SQL error display
  const _executeSQL = window.executeSQL;
  window.executeSQL = function(sql, title){
    const res = document.getElementById("q-result");
    if(!res) return;
    if(!sql || !sql.trim()){
      res.innerHTML = `<div style="padding:12px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:6px">
        <b>Error:</b> Empty query<br><span style="font-size:12px">Write a SELECT statement first.</span></div>`;
      return;
    }
    try {
      // Basic syntax checks
      const s = sql.trim();
      if(!/^SELECT\b/i.test(s)){
        throw {message:"Query must start with SELECT", pos:0};
      }
      if((s.match(/\(/g)||[]).length !== (s.match(/\)/g)||[]).length){
        throw {message:"Unbalanced parentheses", pos:s.indexOf("(")};
      }
      if(/FROM\s*$/i.test(s) || /WHERE\s*$/i.test(s)){
        throw {message:"Incomplete statement — missing table or condition", pos:s.length};
      }
      // Call original
      if(_executeSQL) _executeSQL(sql, title);
    } catch(e){
      const msg = e.message || String(e);
      const pos = e.pos != null ? e.pos : 0;
      const snippet = sql.substring(Math.max(0,pos-20), pos+30);
      res.innerHTML = `<div style="padding:12px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;border-radius:6px">
        <b>SQL Error:</b> ${esc(msg)}<br>
        <span style="font-size:12px">Near: <code style="background:#fee2e2;padding:2px 4px">${esc(snippet)}</code></span><br>
        <span style="font-size:11px;color:#991b1b">Position: ${pos}</span>
      </div>`;
      toast("Query error: " + msg);
    }
  };

  // Wrap bulk delete functions with progress
  ["deleteSelectedItems","deleteSelectedEmployees","deleteSelectedBranches","deleteSelectedDimensions","deleteSelectedDimTypes","deleteSelectedStockDocs"].forEach(fnName=>{
    const orig = window[fnName];
    if(typeof orig !== "function") return;
    window[fnName] = async function(){
      showProgress("Deleting...", 10);
      try {
        await orig.apply(this, arguments);
        updateProgress(100, "Done");
        setTimeout(hideProgress, 600);
      } catch(e){
        hideProgress();
        toast("Delete failed: " + e.message);
      }
    };
  });

  // Wrap import with progress if function exists
  const _doImport = window.doImport || window.runImport;
  if(typeof _doImport === "function"){
    const name = window.doImport ? "doImport" : "runImport";
    window[name] = async function(){
      showProgress("Importing...", 5);
      try {
        const result = await _doImport.apply(this, arguments);
        updateProgress(100, "Import complete");
        setTimeout(hideProgress, 800);
        return result;
      } catch(e){
        hideProgress();
        toast("Import failed: " + e.message);
      }
    };
  }

  console.log("Progress overlay + SQL errors loaded");
})();
</script>
