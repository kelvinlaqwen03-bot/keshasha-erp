<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KESHASHA ERP</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #eef1f6; --panel: #fff; --border: #c5cdd8; --primary: #0b3d91;
      --primary-d: #072a66; --text: #1a1a2e; --muted: #667085; --hover: #eef3fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
    #login-view {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
    }
    .login-box {
      background: var(--panel); border: 1px solid var(--border); width: 380px; padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(11,61,145,.12);
    }
    .login-box h1 { color: var(--primary); font-size: 1.5rem; letter-spacing: 1px; }
    .login-box .sub { color: var(--muted); font-size: 12px; margin: 4px 0 18px; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
    input, select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); margin-bottom: 10px; font-size: 13px;
    }
    input:focus, select:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 7px 12px; border: 1px solid var(--border); background: #fff; cursor: pointer;
      font-size: 12.5px; font-weight: 600;
    }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-d); }
    .btn-sm { padding: 4px 9px; font-size: 12px; }
    .btn-danger { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
    .err { color: #b91c1c; font-size: 12px; margin-top: 6px; }

    #app-view { display: none; min-height: 100vh; }
    .topbar {
      background: var(--primary); color: #fff; padding: 8px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .topbar strong { font-size: 15px; letter-spacing: .6px; }
    .badge { background: rgba(255,255,255,.2); padding: 2px 7px; font-size: 11px; margin-left: 6px; }
    .layout { display: flex; min-height: calc(100vh - 42px); }
    .sidebar { width: 168px; background: #1e293b; flex-shrink: 0; padding: 6px 0; }
    .sidebar button {
      display: block; width: 100%; text-align: left; border: 0; background: none;
      color: #cbd5e1; padding: 9px 14px; cursor: pointer; font-size: 13px;
    }
    .sidebar button:hover, .sidebar button.active { background: var(--primary); color: #fff; }
    .main { flex: 1; padding: 10px 14px; overflow: auto; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
    .toolbar h2 { font-size: 15px; color: var(--primary); margin-right: auto; }

    /* Dense SAP/Excel-style grid */
    .grid-wrap { border: 1px solid var(--border); background: var(--panel); overflow: auto; max-height: calc(100vh - 160px); }
    table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.grid th {
      background: #e8eef7; border: 1px solid var(--border); padding: 5px 8px;
      text-align: left; font-weight: 700; position: sticky; top: 0; z-index: 1; white-space: nowrap;
    }
    table.grid td { border: 1px solid var(--border); padding: 3px 8px; }
    table.grid tr:hover td { background: var(--hover); }
    .form-bar {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 10px;
      background: var(--panel); border: 1px solid var(--border); padding: 8px 10px; margin-bottom: 8px;
    }
    .form-bar .fg label { margin-bottom: 2px; }
    .form-bar .fg input, .form-bar .fg select { margin-bottom: 0; padding: 6px 8px; }
    .toast {
      position: fixed; bottom: 16px; right: 16px; background: #0f172a; color: #fff;
      padding: 10px 14px; font-size: 13px; display: none; z-index: 99; max-width: 320px;
    }
    .toast.show { display: block; }
    .toast.ok { background: #166534; }
    .toast.err { background: #991b1b; }

    .mkt-hd {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px 48px;
      padding: 12px 14px; background: #f5f5f5; border: 1px solid #b0b0b0;
    }
    .mkt-hd .mkt-col { display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; align-items: center; }
    .mkt-hd .mkt-col label { font-size: 12px; font-weight: 600; color: #333; margin: 0; }
    .mkt-hd .mkt-col input, .mkt-hd .mkt-col select {
      margin: 0; padding: 4px 8px; font-size: 12px; border: 1px solid #999; background: #fffef0; width: 100%;
    }
    .mkt-hd .mkt-col input[readonly] { background: #e8e8e8; color: #333; }
    .mkt-lines-label { font-size: 12px; font-weight: 700; color: #0b3d91; padding: 4px 8px 6px; border-bottom: 2px solid #0b3d91; margin-bottom: 4px; }
    .mkt-ft {
      display: grid; grid-template-columns: 1fr 260px; gap: 16px;
      padding: 10px 14px; background: #f5f5f5; border-top: 1px solid #ccc;
    }
    .mkt-ft .totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12px; align-items: center; }
    .mkt-ft .totals b { text-align: right; min-width: 100px; }

    /* Smart Search Engine Wrapper */
    .smart-search-wrapper { position: relative; display: flex; flex-direction: column; gap: 2px; width: 100%; }
    .smart-search-input {
      font-size: 11px; padding: 2px 6px; margin: 0; border: 1px solid #94a3b8; border-radius: 2px; background: #fff;
    }
  </style>
</head>
<body>
  <div id="login-view">
    <div class="login-box">
      <div style="text-align:center;margin-bottom:12px">
        <h1 style="color:var(--primary)">KESHASHA ERP</h1>
      </div>
      <div class="sub" style="text-align:center">Sign in to your company</div>
      <label>Company *</label>
      <select id="login-company">
        <option value="">— Select company —</option>
      </select>
      <label>Email</label>
      <input type="email" id="login-email" placeholder="user@company.com" />
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" />
      <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Sign in</button>
      <div class="err" id="login-err"></div>
    </div>
  </div>

  <div id="app-view">
    <div class="topbar">
      <div>
        <strong>KESHASHA</strong><span class="badge">Phase 1</span>
        <span id="company-label" style="margin-left:10px;font-size:12px;opacity:.9"></span>
      </div>
      <div style="font-size:12px">
        <span id="user-label"></span>
        <button class="btn btn-sm" style="margin-left:8px" onclick="doLogout()">Logout</button>
      </div>
    </div>
    <div class="layout">
      <nav class="sidebar" id="sidebar"></nav>
      <div class="main" id="main"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBiGE_B8kv8zZZQ68kYUOC9ite-pelVbLc",
      authDomain: "keshasha-erp.firebaseapp.com",
      projectId: "keshasha-erp",
      storageBucket: "keshasha-erp.firebasestorage.app",
      messagingSenderId: "967244511867",
      appId: "1:967244511867:web:ac558966b64643156900de",
      measurementId: "G-1TK62JQTGM"
    };

    const CONFIG_READY = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("PASTE");
    let db = null;
    if (CONFIG_READY) {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    }

    // WILDCARD SEARCH ENGINE
    function matchSmartQuery(text, query) {
      if (!query) return true;
      const t = String(text || '').toLowerCase();
      const q = String(query || '').toLowerCase().trim();
      if (q.startsWith('*')) {
        const term = q.slice(1).trim();
        return term ? t.includes(term) : true;
      }
      return t.includes(q);
    }

    // ATTACH SMART SEARCH TO DROPDOWNS
    function enableSmartSearchOnSelect(selectEl, placeholder = 'Type or *wildcard (e.g. *Machale)...') {
      if (!selectEl || selectEl.dataset.smartInit) return;
      selectEl.dataset.smartInit = 'true';
      const originalOptions = Array.from(selectEl.options).map(opt => ({
        value: opt.value, text: opt.text, selected: opt.selected
      }));
      
      const wrapper = document.createElement('div');
      wrapper.className = 'smart-search-wrapper';
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = placeholder;
      input.className = 'smart-search-input';
      
      input.addEventListener('input', () => {
        const q = input.value;
        const curVal = selectEl.value;
        selectEl.innerHTML = '';
        const filtered = originalOptions.filter(o => !o.value || matchSmartQuery(o.text, q) || matchSmartQuery(o.value, q));
        filtered.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o.value;
          opt.textContent = o.text;
          if (o.value === curVal) opt.selected = true;
          selectEl.appendChild(opt);
        });
        if (selectEl.options.length > 1 && q) {
          selectEl.selectedIndex = 1;
          selectEl.dispatchEvent(new Event('change'));
        }
      });

      selectEl.parentNode.insertBefore(wrapper, selectEl);
      wrapper.appendChild(input);
      wrapper.appendChild(selectEl);
    }

    // DYNAMIC TAX CALCULATION
    function calculateDocumentTotals(lines) {
      let subtotal = 0, totalTax = 0;
      lines.forEach(l => {
        const qty = parseFloat(l.qty) || 0;
        const price = parseFloat(l.price) || 0;
        const disc = parseFloat(l.discPct) || 0;
        const lineNet = qty * price * (1 - disc / 100);
        subtotal += lineNet;
        const isExempt = String(l.taxCode || '').toUpperCase().includes('EXEMPT') || String(l.taxCode || '').toUpperCase() === 'X0';
        if (!isExempt) totalTax += lineNet * 0.18;
      });
      return { subtotal, totalTax, totalDue: subtotal + totalTax };
    }

    // Initialize application logic
    let currentUser = null, activeCompanyId = null, companies = [], users = [];
    async function loadAll() {
      if (!db) return;
      const snap = await db.collection("companies").get();
      companies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }

    async function doLogin() {
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const password = document.getElementById("login-password").value;
      const companyId = document.getElementById("login-company").value;
      if (!companyId) return alert("Select company first");
      await loadAll();
      const snap = await db.collection("users").get();
      users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const u = users.find(x => x.email === email && x.password === password);
      if (!u) return alert("Invalid credentials");
      currentUser = u;
      activeCompanyId = companyId;
      document.getElementById("login-view").style.display = "none";
      document.getElementById("app-view").style.display = "block";
      document.getElementById("user-label").textContent = u.fullName;
      document.getElementById("company-label").textContent = companyId;
    }

    function doLogout() {
      document.getElementById("app-view").style.display = "none";
      document.getElementById("login-view").style.display = "flex";
    }
  </script>
</body>
</html>
