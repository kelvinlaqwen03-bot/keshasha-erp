    async function deleteCompany(id) {
      if (!currentUser || !currentUser.isSuperAdmin) return toast("Super Admin only");
      const c = companies.find(x => x.id === id);
      if (!c) return;

      const typed = prompt(
        "WARNING — PERMANENT DELETE\n\n" +
        "Company: " + c.code + " — " + (c.name || "") + "\n\n" +
        "This erases ALL data: branches, employees, users, items, warehouses,\n" +
        "stock, partners, quotations, orders, deliveries, invoices, payments,\n" +
        "journals, accounts, currencies, dimensions/projects, series…\n\n" +
        "Type YES to continue."
      );
      if (typed === null || String(typed).trim().toUpperCase() !== "YES") {
        toast("Delete cancelled");
        return;
      }
      const pwd = prompt("Enter Super Admin password to erase company " + c.code + ":");
      if (pwd === null) return;
      if (String(pwd) !== String(currentUser.password || "")) {
        toast("Wrong password — nothing deleted");
        return;
      }

      toast("Erasing company data…");
      const cols = [
        "branches","employees","users","dimensions","dimension_types","doc_series","item_series",
        "items","warehouses","stock_docs","price_lists","partners","partner_groups",
        "sales_docs","payments","accounts","journals","account_maps","currencies","ui_templates"
      ];
      let total = 0;
      const report = [];
      try {
        for (const col of cols) {
          let docs = [];
          try {
            const snap = await db.collection(col).where("companyId", "==", id).get();
            docs = snap.docs;
          } catch (qe) {
            // Fallback: full scan (no index / type mismatch)
            const all = await db.collection(col).get();
            docs = all.docs.filter(d => {
              const cid = d.data().companyId;
              return cid === id || String(cid) === String(id);
            });
          }
          // Extra safety: also catch string/id mismatch via second pass full scan if empty and col is critical
          if (!docs.length && ["employees","dimensions","users","branches","sales_docs","partners"].includes(col)) {
            const all = await db.collection(col).get();
            docs = all.docs.filter(d => {
              const cid = d.data().companyId;
              return cid === id || String(cid) === String(id);
            });
          }
          for (let i = 0; i < docs.length; i += 400) {
            const batch = db.batch();
            docs.slice(i, i + 400).forEach(doc => batch.delete(doc.ref));
            await batch.commit();
          }
          if (docs.length) report.push(col + ":" + docs.length);
          total += docs.length;
        }
        await db.collection("companies").doc(id).delete();
        companies = companies.filter(x => x.id !== id);
        const drop = (arr) => (arr || []).filter(x => x.companyId !== id && String(x.companyId) !== String(id));
        branches = drop(branches); employees = drop(employees);
        users = users.filter(u => u.companyId !== id && String(u.companyId) !== String(id));
        dimensions = drop(dimensions);
        dimensionTypes = drop(dimensionTypes); docSeries = drop(docSeries); itemSeriesDefs = drop(itemSeriesDefs);
        items = drop(items); warehouses = drop(warehouses); stockDocs = drop(stockDocs);
        priceLists = drop(priceLists); partners = drop(partners); partnerGroups = drop(partnerGroups);
        salesDocs = drop(salesDocs); payments = drop(payments); accounts = drop(accounts);
        journals = drop(journals); accountMaps = drop(accountMaps); currencies = drop(currencies);
        uiTemplates = drop(uiTemplates);
        toast("Company erased (" + total + " records). " + (report.join(", ") || "clean"), true);
        renderCompanies(document.getElementById("main"));
      } catch (e) {
        console.error(e);
        toast("Delete failed: " + e.message);
      }
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Ctrl+A selects all checkboxes in current grid
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a") {
        const checks = document.querySelectorAll(".item-check, .bp-check, .emp-check, .dim-check, .br-check, .wh-check, .sales-check, .stock-check, .acct-check, .dt-check");
        if (!checks.length) return;
        e.preventDefault();
        const allOn = [...checks].every(c => c.checked);
        checks.forEach(c => { c.checked = !allOn; });
      }
    });
    // keydown-ctrl-a

    // Session restore
    (async () => {
      if (!CONFIG_READY) {
        document.getElementById("login-err").textContent = "Set Firebase config in index.html before use.";
        return;
      }
      await refreshLoginCompanies();
      const s = localStorage.getItem(SESSION_KEY);
      if (s) {
        try {
          await loadAll();
          const { email, companyId } = JSON.parse(s);
          const u = users.find(x => x.email === email);
          if (u && companyId && companies.some(c => c.id === companyId)) {
            if (!u.isSuperAdmin && u.companyId !== companyId) {
              localStorage.removeItem(SESSION_KEY);
            } else {
              currentUser = u;
              activeCompanyId = companyId;
              showApp();
            }
          }
        } catch (e) { console.error(e); }
      }
    })();
